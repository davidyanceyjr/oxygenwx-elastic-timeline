<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="2000" height="1320" viewBox="0 0 2000 1320">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#79a9c8"/>
      <stop offset="0.58" stop-color="#b9d3dc"/>
      <stop offset="1" stop-color="#e7d7bc"/>
    </linearGradient>
    <radialGradient id="sunGlow">
      <stop offset="0" stop-color="#ffe7a2" stop-opacity="0.50"/>
      <stop offset="0.55" stop-color="#ffe7a2" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#ffe7a2" stop-opacity="0"/>
    </radialGradient>
    <pattern id="checker" width="24" height="24" patternUnits="userSpaceOnUse">
      <rect width="24" height="24" fill="#f5f8f9"/>
      <rect width="12" height="12" fill="#dfe7eb"/>
      <rect x="12" y="12" width="12" height="12" fill="#dfe7eb"/>
    </pattern>
    <marker id="arrow" markerWidth="7" markerHeight="7" refX="4" refY="3.5" orient="auto">
      <path d="M0 0 L7 3.5 L0 7 Z" fill="#6b8493"/>
    </marker>
    <marker id="cloudArrow" markerWidth="7" markerHeight="7" refX="4" refY="3.5" orient="auto">
      <path d="M0 0 L7 3.5 L0 7 Z" fill="#43867a"/>
    </marker>
    <clipPath id="sunScene"><rect x="500" y="270" width="350" height="480" rx="12"/></clipPath>
    <clipPath id="moonScene"><rect x="940" y="270" width="350" height="480" rx="12"/></clipPath>
    <style>
      .title { font: 700 34px 'DejaVu Sans', sans-serif; fill: #18364b; }
      .subtitle { font: 17px 'DejaVu Sans', sans-serif; fill: #557287; }
      .heading { font: 700 20px 'DejaVu Sans', sans-serif; fill: #1f3d52; }
      .body { font: 15px 'DejaVu Sans', sans-serif; fill: #405d70; }
      .small { font: 13px 'DejaVu Sans', sans-serif; fill: #587184; }
      .layer { font: 700 14px 'DejaVu Sans', sans-serif; fill: #233f53; }
      .panel { fill: #ffffff; stroke: #cad7df; stroke-width: 2; }
    </style>
  </defs>

  <rect width="2000" height="1320" fill="#f1f5f7"/>
  <text x="42" y="54" class="title">OX-109 · Urban Park layered sky and scene depth</text>
  <text x="44" y="84" class="subtitle">Three transparent cloud layers track across the sky; celestial paths remain behind them</text>
  <rect x="1590" y="35" width="375" height="46" rx="23" fill="#fff0ca" stroke="#e1bd6e"/>
  <text x="1777" y="64" text-anchor="middle" class="layer">PROPOSED · NOT APPROVED</text>

  <!-- Current installed screen reference -->
  <rect x="35" y="116" width="410" height="1080" rx="20" class="panel"/>
  <text x="58" y="154" class="heading">Current installed screen</text>
  <text x="58" y="179" class="small">Pixel 3 XL · Sun-visible cloudy state · OX-108 reference</text>
  <image x="77" y="196" width="326" height="670" preserveAspectRatio="xMidYMid meet" href="OX-109-current-sun-cloudy-reference.png"/>
  <text x="58" y="900" class="body">Existing forecast symbol, readouts, controls,</text>
  <text x="58" y="924" class="body">and timeline stay app-owned and unchanged.</text>
  <text x="58" y="970" class="small">Current-state reference only; not an OX-109</text>
  <text x="58" y="992" class="small">installed after image.</text>
  <rect x="58" y="1030" width="360" height="118" rx="14" fill="#f0f5f7"/>
  <text x="76" y="1061" class="body">Artwork concept shows the scene planes.</text>
  <text x="76" y="1086" class="small">It does not redraw the full-screen forecast UI.</text>
  <text x="76" y="1111" class="small">Installed evidence is still required after approval.</text>

  <!-- Sun-visible proposed composite: OX-108 event activates cloud type 1 -->
  <rect x="465" y="116" width="420" height="1080" rx="20" class="panel"/>
  <text x="490" y="154" class="heading">Sun-visible cloudy state</text>
  <text x="490" y="179" class="small">PARTLY_SUNNY_CLOUDY · Type 1 active · concept</text>
  <g clip-path="url(#sunScene)">
    <rect x="500" y="270" width="350" height="480" fill="url(#sky)"/>
    <image x="500" y="270" width="350" height="480" href="OX-108-urban-park-cloud-depth-park-background-preview.png"/>
    <path d="M540 315 C580 285 620 292 653 309 C690 329 735 326 775 296" fill="none" stroke="#f6dc9a" stroke-opacity="0.74" stroke-width="2.5" stroke-dasharray="8 7"/>
    <circle cx="770" cy="330" r="58" fill="url(#sunGlow)"/>
    <circle cx="770" cy="330" r="21" fill="#ffe8bb" stroke="#fff5dc" stroke-width="2"/>
    <g fill="#d5e2e9" fill-opacity="0.78" stroke="#f5fafc" stroke-opacity="0.74" stroke-width="2">
      <path d="M704 357 C708 345 718 342 729 344 C734 328 747 322 759 331 C771 322 786 329 788 342 C802 341 811 349 812 359 C811 370 802 375 789 375 L722 375 C710 374 703 368 704 357Z"/>
      <path d="M754 348 C759 335 770 332 782 334 C787 316 802 310 814 320 C827 309 844 317 846 332 C861 330 870 340 871 351 C869 362 861 367 846 367 L772 367 C761 366 753 360 754 348Z"/>
    </g>
    <image x="500" y="270" width="350" height="480" href="OX-108-urban-park-cloud-depth-park-middleground-preview.png"/>
    <image x="500" y="270" width="350" height="480" href="OX-108-urban-park-cloud-depth-park-foreground-preview.png"/>
  </g>
  <rect x="500" y="270" width="350" height="480" rx="12" fill="none" stroke="#718b9a" stroke-width="2"/>
  <text x="490" y="790" class="body">The active cloud is above the Sun and Background.</text>
  <text x="490" y="814" class="body">Non-cloud pixels remain transparent.</text>
  <text x="490" y="858" class="small">The dotted arc is the selected-time Sun path.</text>
  <text x="490" y="882" class="small">Cloud type 1 is separately tracked at a distinct rate.</text>
  <text x="490" y="928" class="small">Base Middleground then Foreground composite above it.</text>
  <text x="490" y="952" class="small">Cue position and scale remain selected-time driven.</text>
  <text x="490" y="1000" class="small">Preview art is illustrative; existing plane transforms</text>
  <text x="490" y="1024" class="small">and OX-108 event mapping remain in force.</text>

  <!-- Moon-visible proposed composite: OX-108 event activates cloud type 1 -->
  <rect x="905" y="116" width="420" height="1080" rx="20" class="panel"/>
  <text x="930" y="154" class="heading">Moon-visible cloudy state</text>
  <text x="930" y="179" class="small">PARTLY_CLOUDY_NIGHT · Type 1 active · concept</text>
  <g clip-path="url(#moonScene)">
    <rect x="940" y="270" width="350" height="480" fill="#26364b"/>
    <image x="940" y="270" width="350" height="480" href="OX-108-urban-park-cloud-depth-park-background-preview.png"/>
    <path d="M980 315 C1020 285 1060 292 1093 309 C1130 329 1175 326 1215 296" fill="none" stroke="#d8d1ee" stroke-opacity="0.62" stroke-width="2.5" stroke-dasharray="8 7"/>
    <circle cx="1210" cy="330" r="48" fill="#e7e7de" fill-opacity="0.16"/>
    <circle cx="1210" cy="330" r="21" fill="#f2ead5"/>
    <circle cx="1219" cy="324" r="18" fill="#26364b"/>
    <g fill="#b9c8d8" fill-opacity="0.82" stroke="#ecf2f6" stroke-opacity="0.72" stroke-width="2">
      <path d="M1144 357 C1148 345 1158 342 1169 344 C1174 328 1187 322 1199 331 C1211 322 1226 329 1228 342 C1242 341 1251 349 1252 359 C1251 370 1242 375 1229 375 L1162 375 C1150 374 1143 368 1144 357Z"/>
      <path d="M1194 348 C1199 335 1210 332 1222 334 C1227 316 1242 310 1254 320 C1267 309 1284 317 1286 332 C1301 330 1310 340 1311 351 C1309 362 1301 367 1286 367 L1212 367 C1201 366 1193 360 1194 348Z"/>
    </g>
    <image x="940" y="270" width="350" height="480" href="OX-108-urban-park-cloud-depth-park-middleground-preview.png"/>
    <image x="940" y="270" width="350" height="480" href="OX-108-urban-park-cloud-depth-park-foreground-preview.png"/>
  </g>
  <rect x="940" y="270" width="350" height="480" rx="12" fill="none" stroke="#718b9a" stroke-width="2"/>
  <text x="930" y="790" class="body">The active cloud is above the Moon and Background.</text>
  <text x="930" y="814" class="body">Non-cloud pixels remain transparent.</text>
  <text x="930" y="858" class="small">The dotted arc is the selected-time Moon path.</text>
  <text x="930" y="882" class="small">Cloud type 1 is separately tracked at a distinct rate.</text>
  <text x="930" y="928" class="small">Base Middleground then Foreground composite above it.</text>
  <text x="930" y="952" class="small">Cue position and scale remain selected-time driven.</text>
  <text x="930" y="1000" class="small">Preview art is illustrative; existing plane transforms</text>
  <text x="930" y="1024" class="small">and OX-108 event mapping remain in force.</text>

  <!-- Full hierarchy, independent motion model, and transparency -->
  <rect x="1345" y="116" width="620" height="1080" rx="20" class="panel"/>
  <text x="1375" y="154" class="heading">Back-to-front scene hierarchy</text>
  <text x="1375" y="180" class="small">Far layers first; Foreground is closest to the viewer.</text>

  <g>
    <rect x="1380" y="208" width="550" height="44" rx="10" fill="#e4edf2" stroke="#bdcdd6"/>
    <text x="1398" y="236" class="layer">1 · Background backdrop — blue sky / night stars</text>
    <path d="M1655 252 V261" stroke="#6b8493" stroke-width="2" marker-end="url(#arrow)"/>

    <rect x="1380" y="265" width="550" height="44" rx="10" fill="#dbeaf1" stroke="#bdcdd6"/>
    <text x="1398" y="293" class="layer">2 · Base Background Park image plane</text>
    <path d="M1655 309 V318" stroke="#6b8493" stroke-width="2" marker-end="url(#arrow)"/>

    <rect x="1380" y="322" width="550" height="44" rx="10" fill="#fff2d2" stroke="#e0c783"/>
    <text x="1398" y="350" class="layer">3 · Sun — selected-time path, when visible</text>
    <path d="M1655 366 V375" stroke="#6b8493" stroke-width="2" marker-end="url(#arrow)"/>

    <rect x="1380" y="379" width="550" height="44" rx="10" fill="#eee9f7" stroke="#c5b7df"/>
    <text x="1398" y="407" class="layer">4 · Moon — supported selected-time path</text>
    <path d="M1655 423 V432" stroke="#6b8493" stroke-width="2" marker-end="url(#arrow)"/>

    <rect x="1380" y="436" width="550" height="50" rx="10" fill="#e2f0eb" stroke="#71a297" stroke-width="2"/>
    <text x="1398" y="458" class="layer">5 · Cloud type 1 — separately painted + tracked</text>
    <text x="1398" y="478" class="small">Own transparent layer · motion rate differs from Sun/Moon</text>
    <path d="M1655 486 V495" stroke="#6b8493" stroke-width="2" marker-end="url(#arrow)"/>

    <rect x="1380" y="499" width="550" height="50" rx="10" fill="#e2f0eb" stroke="#71a297" stroke-width="2"/>
    <text x="1398" y="521" class="layer">6 · Cloud type 2 — separately painted + tracked</text>
    <text x="1398" y="541" class="small">Own transparent layer · motion rate differs from Sun/Moon</text>
    <path d="M1655 549 V558" stroke="#6b8493" stroke-width="2" marker-end="url(#arrow)"/>

    <rect x="1380" y="562" width="550" height="50" rx="10" fill="#e2f0eb" stroke="#71a297" stroke-width="2"/>
    <text x="1398" y="584" class="layer">7 · Cloud type 3 — separately painted + tracked</text>
    <text x="1398" y="604" class="small">Own transparent layer · motion rate differs from Sun/Moon</text>
    <path d="M1655 612 V621" stroke="#6b8493" stroke-width="2" marker-end="url(#arrow)"/>

    <rect x="1380" y="625" width="550" height="44" rx="10" fill="#e9eee4" stroke="#c5d1b6"/>
    <text x="1398" y="653" class="layer">8 · Base Middleground image plane</text>
    <path d="M1655 669 V678" stroke="#6b8493" stroke-width="2" marker-end="url(#arrow)"/>

    <rect x="1380" y="682" width="550" height="44" rx="10" fill="#e9eee4" stroke="#c5d1b6"/>
    <text x="1398" y="710" class="layer">9 · Added Middleground layers above the base</text>
    <path d="M1655 726 V735" stroke="#6b8493" stroke-width="2" marker-end="url(#arrow)"/>

    <rect x="1380" y="739" width="550" height="44" rx="10" fill="#dfe8de" stroke="#b9cbb3" stroke-width="2"/>
    <text x="1398" y="767" class="layer">10 · Foreground layer(s) — closest to viewer</text>
  </g>

  <rect x="1380" y="806" width="550" height="150" rx="14" fill="#f0f6f4" stroke="#c3d9d3"/>
  <text x="1400" y="835" class="heading">Separate sky tracks</text>
  <path d="M1410 876 C1480 850 1550 849 1610 875" fill="none" stroke="#d6a948" stroke-width="2.5" stroke-dasharray="7 6"/>
  <text x="1625" y="878" class="small">Sun path</text>
  <path d="M1410 908 C1480 933 1550 933 1610 908" fill="none" stroke="#8c83ad" stroke-width="2.5" stroke-dasharray="7 6"/>
  <text x="1625" y="914" class="small">Moon path</text>
  <line x1="1730" y1="862" x2="1825" y2="862" stroke="#43867a" stroke-width="2.5" marker-end="url(#cloudArrow)"/>
  <text x="1837" y="867" class="small">Type 1</text>
  <line x1="1730" y1="891" x2="1825" y2="891" stroke="#43867a" stroke-width="2.5" stroke-dasharray="5 4" marker-end="url(#cloudArrow)"/>
  <text x="1837" y="896" class="small">Type 2</text>
  <line x1="1730" y1="920" x2="1825" y2="920" stroke="#43867a" stroke-width="2.5" stroke-dasharray="2 4" marker-end="url(#cloudArrow)"/>
  <text x="1837" y="925" class="small">Type 3</text>
  <text x="1400" y="949" class="small">Cloud rates differ from celestial paths; no numeric values set.</text>

  <text x="1380" y="986" class="heading">Cloud-only alpha · each layer</text>
  <rect x="1380" y="1000" width="550" height="130" rx="12" fill="url(#checker)" stroke="#bdcdd6"/>
  <path d="M1420 1070 C1425 1044 1444 1038 1463 1045 C1472 1014 1499 1005 1518 1024 C1539 1005 1567 1018 1570 1043 C1596 1039 1612 1056 1612 1074 C1608 1095 1593 1103 1568 1103 L1451 1103 C1431 1102 1419 1090 1420 1070Z" fill="#cbd9e2" fill-opacity="0.80" stroke="#f9fcfd" stroke-opacity="0.78" stroke-width="3"/>
  <text x="1640" y="1046" class="small">Checkerboard means</text>
  <text x="1640" y="1068" class="small">transparent pixels.</text>
  <text x="1640" y="1100" class="small">Only cloud forms paint.</text>

  <text x="42" y="1240" class="body">The composite concept uses existing resized Park plane previews and schematic cues/clouds; it is not an installed after screenshot.</text>
  <text x="42" y="1270" class="small">Cloud event selection retains OX-108's cumulative mapping: Type 1, Types 1–2, or Types 1–3. Numeric motion rates are not set here.</text>
  <text x="42" y="1300" class="small">Existing precipitation remains a separate unchanged effect pass; the hierarchy here shows scene artwork planes.</text>
</svg>
