<svg xmlns="http://www.w3.org/2000/svg" width="1660" height="1110" viewBox="0 0 1660 1110" role="img" aria-labelledby="title desc">
  <title id="title">P.2.22 location-aware double-tap UI artwork board</title>
  <desc id="desc">Three schematic timeline states: Monday daily at 7 AM with Wednesday as the double-tap target, Wednesday hourly at 7 AM after entry, and Wednesday daily at 4 PM after returning from hourly.</desc>
  <defs>
    <linearGradient id="bg" x2="0" y2="1"><stop stop-color="#101e31"/><stop offset="1" stop-color="#1c3046"/></linearGradient>
    <linearGradient id="sky" x2="0" y2="1"><stop stop-color="#718c9d"/><stop offset=".55" stop-color="#3c5c75"/><stop offset="1" stop-color="#233d55"/></linearGradient>
    <linearGradient id="tape" x2="0" y2="1"><stop stop-color="#0b1b2c" stop-opacity=".84"/><stop offset="1" stop-color="#071320" stop-opacity=".99"/></linearGradient>
    <style>
      .title{font:700 32px system-ui;fill:#f1f6fa}.sub{font:16px system-ui;fill:#b4c4d1}.label{font:700 19px system-ui;fill:#f5f8fa}.small{font:14px system-ui;fill:#bfccd6}.day{font:600 17px system-ui;fill:#d8e2e9}.daySel{font:700 23px system-ui;fill:#fff}.hour{font:500 14px system-ui;fill:#d8e2e9}.body{font:16px system-ui;fill:#e6edf2}.tiny{font:13px system-ui;fill:#bccbd7}.panel{fill:#14283c;stroke:#516b83;stroke-width:2}.screen{fill:#203951;stroke:#66819a;stroke-width:2}.gold{fill:#f2d17e}.rail{stroke:#c0d0db;stroke-width:2}.tick{stroke:#899fb1;stroke-width:2}.play{stroke:#f2d17e;stroke-width:4}.arrow{stroke:#78c9df;stroke-width:4;fill:none;marker-end:url(#arrow)}.tag{fill:#344c64}.touch{fill:none;stroke:#f2d17e;stroke-width:3;stroke-dasharray:8 6}
    </style>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#78c9df"/></marker>
  </defs>
  <rect width="1660" height="1110" fill="url(#bg)"/>
  <text x="52" y="58" class="title">P.2.22 · Location-aware timeline double-tap</text>
  <text x="52" y="88" class="sub">UI artwork board · draft for review · owner approval pending</text>
  <text x="52" y="117" class="small">Schematic based on the approved P.2.21 daily timeline treatment; sample day labels and scene details are illustrative.</text>

  <rect x="44" y="148" width="492" height="806" rx="24" class="panel"/>
  <rect x="584" y="148" width="492" height="806" rx="24" class="panel"/>
  <rect x="1124" y="148" width="492" height="806" rx="24" class="panel"/>
  <text x="70" y="189" class="label">A · DAILY · MONDAY SELECTED</text>
  <text x="610" y="189" class="label">B · HOURLY · WEDNESDAY · 7 AM</text>
  <text x="1150" y="189" class="label">C · DAILY · WEDNESDAY · 4 PM</text>

  <!-- Screen A -->
  <rect x="72" y="211" width="436" height="580" rx="18" class="screen"/>
  <rect x="73" y="212" width="434" height="360" rx="17" fill="url(#sky)"/>
  <circle cx="421" cy="275" r="23" fill="#f6dcaa" opacity=".9"/>
  <path d="M74 510 Q130 462 186 500 T298 490 T420 492 T507 470V572H74Z" fill="#274354" opacity=".85"/>
  <path d="M92 548v-83h24v83m15 0v-120h28v120m16 0v-94h20v94m16 0v-145h30v145m18 0v-98h23v98m17 0v-132h27v132m18 0v-79h23v79m18 0v-159h31v159m19 0v-108h24v108" fill="#345975" opacity=".85"/>
  <text x="290" y="328" text-anchor="middle" class="body">Selected forecast scene</text>
  <text x="290" y="377" text-anchor="middle" class="label">Monday · selected 7 AM</text>
  <text x="290" y="410" text-anchor="middle" class="small">Existing forecast facts remain visible</text>
  <rect x="73" y="572" width="434" height="218" rx="0 0 17 17" fill="url(#tape)"/>
  <line x1="94" y1="660" x2="486" y2="660" class="rail"/>
  <g class="tick"><path d="M122 648v24M186 644v32M250 648v24M314 644v32M378 648v24M442 644v32M486 648v24"/></g>
  <text x="102" y="628" class="day">SUN</text><text x="164" y="628" class="daySel">MON</text><text x="232" y="628" class="day">TUE</text><text x="296" y="628" class="day">WED</text><text x="360" y="628" class="day">THU</text><text x="426" y="628" class="day">FRI</text>
  <g fill="#9ab7ca"><path d="M119 640c-8-13 13-22 20-9 12-2 14 13 4 17h-22c-7-1-8-6-2-8z"/><circle cx="185" cy="657" r="9"/><path d="M249 641c-8-13 13-22 20-9 12-2 14 13 4 17h-22c-7-1-8-6-2-8z"/><circle cx="378" cy="657" r="9"/><path d="M435 641c-8-13 13-22 20-9 12-2 14 13 4 17h-22c-7-1-8-6-2-8z"/></g>
  <line x1="186" y1="642" x2="186" y2="682" class="play"/>
  <rect x="144" y="716" width="84" height="30" rx="15" class="tag"/><text x="186" y="737" text-anchor="middle" class="small">7 AM</text>
  <ellipse cx="315" cy="651" rx="39" ry="44" class="touch"/>
  <path d="M314 604v-33" class="arrow"/><text x="322" y="557" class="small">Double-tap WED</text>
  <text x="92" y="769" class="tiny">Daily event icons and HI values stay date-aligned.</text>

  <!-- Screen B -->
  <rect x="612" y="211" width="436" height="580" rx="18" class="screen"/>
  <rect x="613" y="212" width="434" height="360" rx="17" fill="url(#sky)"/>
  <circle cx="961" cy="275" r="23" fill="#f6dcaa" opacity=".9"/>
  <path d="M614 510 Q670 462 726 500 T838 490 T960 492 T1047 470V572H614Z" fill="#274354" opacity=".85"/>
  <path d="M632 548v-83h24v83m15 0v-120h28v120m16 0v-94h20v94m16 0v-145h30v145m18 0v-98h23v98m17 0v-132h27v132m18 0v-79h23v79m18 0v-159h31v159m19 0v-108h24v108" fill="#345975" opacity=".85"/>
  <text x="830" y="328" text-anchor="middle" class="body">Wednesday's selected forecast</text>
  <text x="830" y="377" text-anchor="middle" class="label">Hourly facts follow the selected time</text>
  <text x="830" y="410" text-anchor="middle" class="small">No daily-high row in hourly scale</text>
  <rect x="613" y="572" width="434" height="218" rx="0 0 17 17" fill="url(#tape)"/>
  <line x1="634" y1="660" x2="1026" y2="660" class="rail"/>
  <g class="tick"><path d="M656 648v24M712 644v32M768 648v24M824 644v32M880 648v24M936 644v32M992 648v24"/></g>
  <text x="638" y="628" class="hour">4 AM</text><text x="694" y="628" class="hour">5 AM</text><text x="750" y="628" class="hour">6 AM</text><text x="806" y="628" class="hour">7 AM</text><text x="862" y="628" class="hour">8 AM</text><text x="918" y="628" class="hour">9 AM</text><text x="974" y="628" class="hour">10 AM</text>
  <line x1="824" y1="637" x2="824" y2="682" class="play"/>
  <rect x="782" y="716" width="84" height="30" rx="15" class="tag"/><text x="824" y="737" text-anchor="middle" class="small">7 AM</text>
  <text x="632" y="769" class="tiny">Wednesday at 7 AM local time centered at hourly entry.</text>

  <!-- Screen C -->
  <rect x="1152" y="211" width="436" height="580" rx="18" class="screen"/>
  <rect x="1153" y="212" width="434" height="360" rx="17" fill="url(#sky)"/>
  <circle cx="1501" cy="275" r="23" fill="#f6dcaa" opacity=".9"/>
  <path d="M1154 510 Q1210 462 1266 500 T1378 490 T1500 492 T1587 470V572H1154Z" fill="#274354" opacity=".85"/>
  <path d="M1172 548v-83h24v83m15 0v-120h28v120m16 0v-94h20v94m16 0v-145h30v145m18 0v-98h23v98m17 0v-132h27v132m18 0v-79h23v79m18 0v-159h31v159m19 0v-108h24v108" fill="#345975" opacity=".85"/>
  <text x="1370" y="328" text-anchor="middle" class="body">Wednesday · selected 4 PM</text>
  <text x="1370" y="377" text-anchor="middle" class="label">Daily representation remains readable</text>
  <text x="1370" y="410" text-anchor="middle" class="small">The selected instant does not reset to noon</text>
  <rect x="1153" y="572" width="434" height="218" rx="0 0 17 17" fill="url(#tape)"/>
  <line x1="1174" y1="660" x2="1566" y2="660" class="rail"/>
  <g class="tick"><path d="M1202 648v24M1266 644v32M1330 648v24M1394 644v32M1458 648v24M1522 644v32M1566 648v24"/></g>
  <text x="1182" y="628" class="day">MON</text><text x="1244" y="628" class="day">TUE</text><text x="1312" y="628" class="daySel">WED</text><text x="1376" y="628" class="day">THU</text><text x="1440" y="628" class="day">FRI</text><text x="1504" y="628" class="day">SAT</text>
  <g fill="#9ab7ca"><path d="M1314 641c-8-13 13-22 20-9 12-2 14 13 4 17h-22c-7-1-8-6-2-8z"/><circle cx="1202" cy="657" r="9"/><circle cx="1458" cy="657" r="9"/></g>
  <line x1="1322" y1="642" x2="1322" y2="682" class="play"/>
  <rect x="1280" y="716" width="84" height="30" rx="15" class="tag"/><text x="1322" y="737" text-anchor="middle" class="small">4 PM</text>
  <text x="1172" y="769" class="tiny">Same exact selected instant remains under the playhead.</text>

  <path d="M536 544H574" class="arrow"/><path d="M1076 544H1114" class="arrow"/>
  <text x="52" y="1007" class="label">BEHAVIOR</text><text x="170" y="1007" class="body">Daily double-tap selects 7 AM local on the touched date before entering hourly.</text>
  <text x="52" y="1040" class="label">RETURN</text><text x="170" y="1040" class="body">Hourly double-tap returns to daily with the exact selected time; no new controls or layout rows.</text>
  <text x="52" y="1080" class="sub">Proposed design input · not an installed screenshot · approved P.2.21 marks and current tape styling are preserved.</text>
</svg>
