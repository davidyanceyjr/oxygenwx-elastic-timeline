<line x1="64" y1="978" x2="1536" y2="978" stroke="#7690a6" stroke-width="1"/>
<text x="70" y="1018" class="label">Acceptance intent</text>
<text x="70" y="1050" class="body">Same selected instant and source bounds before/after. Scene meaning, readable forecast facts, selected-time behavior, and gesture ownership remain intact.</text>
<text x="70" y="1082" class="small">Approved 2026-11-01 · current scrub behavior preserved · no new easing, interpolation, weather family, or theme art</text>
