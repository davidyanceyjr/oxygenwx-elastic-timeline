</g>
<!-- Labels and typed reading summaries -->
<g class="body">
 <text x="84" y="250" class="label">CLEAR · day</text><text x="84" y="280">supported categorical condition</text><text x="84" y="305" class="small">selected instant + point/interval bounds</text>
 <text x="84" y="374" class="label">Rain · day</text><text x="84" y="404">supported precipitation</text><text x="84" y="429" class="small">chance / amount / rate support retained</text>
 <text x="84" y="498" class="label">Snow · night</text><text x="84" y="528">supported precipitation</text><text x="84" y="553" class="small">night light input retained</text>
 <text x="84" y="622" class="label">Storm · day/night</text><text x="84" y="652">supported categorical condition</text><text x="84" y="677" class="small">no new warning semantics</text>
 <text x="84" y="746" class="label">Probability only</text><text x="84" y="776">chance supported; event evidence absent</text><text x="84" y="801" class="small">does not become a rain event</text>
 <text x="84" y="870" class="label">Unknown</text><text x="84" y="900">weather support absent</text><text x="84" y="925" class="small">does not become CLEAR or zero</text>
</g>
