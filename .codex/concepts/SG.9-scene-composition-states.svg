<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1120" viewBox="0 0 1600 1120">
<defs>
  <linearGradient id="bg" x2="0" y2="1"><stop stop-color="#101b31"/><stop offset="1" stop-color="#203b58"/></linearGradient>
  <linearGradient id="day" x2="0" y2="1"><stop stop-color="#71b6dd"/><stop offset="1" stop-color="#d5e8e6"/></linearGradient>
  <linearGradient id="night" x2="0" y2="1"><stop stop-color="#172647"/><stop offset="1" stop-color="#526280"/></linearGradient>
  <style>
    .title{font:700 38px sans-serif;fill:#f5f8fc}.sub{font:20px sans-serif;fill:#bdcad8}.label{font:700 19px sans-serif;fill:#fff}.body{font:17px sans-serif;fill:#dbe5ee}.small{font:15px sans-serif;fill:#c5d3df}.muted{font:15px sans-serif;fill:#aab9c8}.card{fill:#16283c;stroke:#8da7b9;stroke-width:2}.line{stroke:#ffce6a;stroke-width:3;stroke-dasharray:10 8}.cloud{fill:#edf3f4;opacity:.9}.city{fill:#29465b}.rain{stroke:#a9dcf0;stroke-width:4;stroke-linecap:round}.snow{fill:#fff}.pill{fill:#203c53;stroke:#66869b;stroke-width:1.3}
  </style>
</defs>
<rect width="1600" height="1120" fill="url(#bg)"/>
<text x="64" y="68" class="title">SG.9 · First-theme scene comparison</text>
<text x="64" y="105" class="sub">OWNER APPROVED · Same selected time and source bounds before and after the composition refactor.</text>
<text x="64" y="143" class="small">Schematic comparison: preserve approved SG.4 visual meanings; the board defines states and invariants, not new artwork.</text>

<!-- headings -->
<text x="76" y="193" class="label">SELECTED STATE</text>
<text x="710" y="193" class="label">CURRENT SCENE (REFERENCE)</text>
<text x="1188" y="193" class="label">SG.9 COMPOSITION (TARGET)</text>

