<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1200" viewBox="0 0 1800 1200">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0b1725"/><stop offset="1" stop-color="#102b3b"/></linearGradient>
    <linearGradient id="mint" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#53c9b2"/><stop offset="1" stop-color="#83e0c9"/></linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#7b9aad"/></marker>
    <marker id="arrowMint" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#62d5bb"/></marker>
    <style>
      text{font-family:Inter,'DejaVu Sans',sans-serif;fill:#edf4f7}
      .muted{fill:#abc0cc}.dim{fill:#819cab}.mint{fill:#7be0c9}.amber{fill:#f2bd78}.red{fill:#ef9c94}
      .panel{fill:#132c3c;stroke:#375a6c;stroke-width:2}.card{fill:#19384a;stroke:#42687a;stroke-width:2}
      .subcard{fill:#102637;stroke:#355768;stroke-width:1.5}.line{stroke:#708e9f;stroke-width:3;fill:none;marker-end:url(#arrow)}
      .mintline{stroke:#62d5bb;stroke-width:3;fill:none;marker-end:url(#arrowMint)}
      .title{font-size:40px;font-weight:750;letter-spacing:.4px}.h{font-size:23px;font-weight:700;letter-spacing:.8px}
      .body{font-size:19px}.small{font-size:16px}.tiny{font-size:14px}.tag{font-size:14px;font-weight:700;letter-spacing:1px}
    </style>
  </defs>
  <rect width="1800" height="1200" fill="url(#bg)"/>
  <text x="58" y="70" class="title">WX.20 · Location-scoped catalog activation</text>
  <text x="60" y="108" class="body muted">Request → source-isolated load → validate → atomic activation</text>
  <rect x="1450" y="42" width="292" height="44" rx="22" fill="#593f25" stroke="#bd8c52" stroke-width="1.5"/>
  <text x="1596" y="70" text-anchor="middle" class="tag amber">CONCEPT · DRAFT FOR REVIEW</text>

  <rect x="55" y="145" width="420" height="635" rx="22" class="panel"/>
  <text x="82" y="188" class="h mint">01 · REQUEST</text>
  <text x="82" y="220" class="small muted">A caller asks for one complete catalog.</text>
  <rect x="82" y="247" width="366" height="132" rx="16" class="card"/>
  <text x="105" y="282" class="tag mint">REQUEST ID · r43</text>
  <text x="105" y="317" class="body">Location A · America/Chicago</text>
  <text x="105" y="347" class="small muted">origin: LIVE · dataset: forecast-44d</text>
  <text x="105" y="370" class="tiny dim">Identity comes from the saved location.</text>
  <path d="M105 409h315" stroke="#345667" stroke-width="1.5"/>
  <text x="82" y="447" class="tag">LATEST REQUEST OWNS THE RESULT</text>
  <rect x="82" y="466" width="366" height="86" rx="14" class="subcard"/>
  <text x="103" y="499" class="body">Cancel previous work</text>
  <text x="103" y="527" class="small muted">and advance the request token.</text>
  <rect x="82" y="570" width="366" height="85" rx="14" class="subcard"/>
  <text x="103" y="603" class="body">Keep current catalog active</text>
  <text x="103" y="631" class="small muted">while the replacement loads.</text>
  <text x="82" y="706" class="small dim">Selection is a saved LocationId;</text>
  <text x="82" y="732" class="small dim">load requests use its canonical point.</text>

  <path d="M477 451h42" class="line"/>

  <rect x="530" y="145" width="590" height="635" rx="22" class="panel"/>
  <text x="558" y="188" class="h mint">02 · LOAD WHOLE CATALOG</text>
  <text x="558" y="220" class="small muted">Each origin stays in its own source and cache namespace.</text>
  <rect x="558" y="248" width="250" height="118" rx="15" class="card"/>
  <text x="580" y="281" class="tag mint">LIVE</text>
  <text x="580" y="312" class="body">Live source + refresh</text>
  <text x="580" y="340" class="small muted">LIVE cache namespace</text>
  <rect x="842" y="248" width="250" height="118" rx="15" class="card"/>
  <text x="864" y="281" class="tag mint">SIMULATED</text>
  <text x="864" y="312" class="body">Deterministic source</text>
  <text x="864" y="340" class="small muted">SIMULATED namespace</text>
  <rect x="700" y="391" width="250" height="108" rx="15" class="card"/>
  <text x="722" y="424" class="tag mint">REPLAY</text>
  <text x="722" y="455" class="body">Selected recording</text>
  <text x="722" y="481" class="small muted">REPLAY namespace</text>
  <rect x="558" y="535" width="534" height="104" rx="15" fill="#173b49" stroke="#4f9e91" stroke-width="2"/>
  <text x="582" y="571" class="tag mint">STAGED CANDIDATE · NOT ACTIVE YET</text>
  <text x="582" y="604" class="body">One recording, one location, one origin</text>
  <text x="582" y="628" class="small muted">No field merge · provenance travels with the dataset</text>
  <text x="558" y="690" class="small dim">Validate source result and recording envelope before publish.</text>
  <text x="558" y="721" class="small dim">Stale completion is discarded even if cancellation arrives late.</text>

  <path d="M1122 448h43" class="mintline"/>

  <rect x="1175" y="145" width="570" height="635" rx="22" class="panel"/>
  <text x="1203" y="188" class="h mint">03 · VALIDATE &amp; COMMIT</text>
  <rect x="1203" y="224" width="514" height="134" rx="16" class="card"/>
  <text x="1227" y="260" class="tag">ACTIVATION GATE</text>
  <text x="1227" y="294" class="body">token is newest · location matches</text>
  <text x="1227" y="324" class="body">origin and dataset match · valid recording</text>
  <path d="M1460 358v37" class="mintline"/>
  <rect x="1203" y="403" width="514" height="135" rx="16" fill="#17443f" stroke="#58bca8" stroke-width="2"/>
  <text x="1227" y="440" class="tag mint">ATOMIC PUBLISH</text>
  <text x="1227" y="475" class="body">Replace active selection as one state update</text>
  <text x="1227" y="507" class="small muted">Increment view generation · no app restart</text>
  <rect x="1203" y="559" width="247" height="104" rx="14" class="subcard"/>
  <text x="1223" y="591" class="tag mint">TIME PRESERVED</text>
  <text x="1223" y="622" class="small">Keep exact Instant</text>
  <text x="1223" y="646" class="small muted">else choose nearest sample</text>
  <rect x="1470" y="559" width="247" height="104" rx="14" class="subcard"/>
  <text x="1490" y="591" class="tag amber">TIE RULE</text>
  <text x="1490" y="622" class="small">Tie → earlier sample</text>
  <text x="1490" y="646" class="small muted">instant wins</text>
  <text x="1203" y="711" class="small dim">Failure keeps the previous valid selection active.</text>
  <text x="1203" y="738" class="small dim">Non-selected locations and caches remain untouched.</text>

  <rect x="55" y="810" width="1690" height="205" rx="22" class="panel"/>
  <text x="82" y="852" class="h mint">RACE EXAMPLE · A → B → A</text>
  <text x="82" y="887" class="small muted">Location equality alone is insufficient; only the latest request token may publish.</text>
  <rect x="82" y="914" width="405" height="70" rx="13" class="subcard"/>
  <text x="103" y="943" class="body">r41 · A · LIVE</text><text x="103" y="970" class="small red">finishes late → discard (stale token)</text>
  <rect x="520" y="914" width="405" height="70" rx="13" class="subcard"/>
  <text x="541" y="943" class="body">r42 · B · LIVE</text><text x="541" y="970" class="small red">finishes late → discard (stale token)</text>
  <rect x="958" y="914" width="405" height="70" rx="13" fill="#17443f" stroke="#58bca8" stroke-width="2"/>
  <text x="979" y="943" class="body">r43 · A · SIMULATED</text><text x="979" y="970" class="small mint">newest valid request → activate</text>
  <path d="M487 949h27" class="line"/><path d="M925 949h27" class="line"/>
  <text x="1400" y="940" class="tag amber">A SECOND A IS STILL</text>
  <text x="1400" y="966" class="tag amber">A DIFFERENT REQUEST</text>

  <rect x="55" y="1040" width="1690" height="105" rx="18" fill="#0d2130" stroke="#29495a" stroke-width="1.5"/>
  <text x="82" y="1077" class="tag mint">SCOPE</text>
  <text x="170" y="1077" class="small">Data/state activation contract only · no selector UI · no renderer migration · no provider DTO in presentation.</text>
  <text x="82" y="1112" class="small muted">Owner review requested: confirm earlier-sample tie rule and replay recording selection input. This draft is not approval or installed acceptance evidence.</text>
  <text x="60" y="1180" class="tiny dim">WX.20 CONCEPT · LOCATION-SCOPED CATALOG ACTIVATION · DRAFT FOR OWNER REVIEW</text>
</svg>
