<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="2220" viewBox="0 0 1440 2220" role="img" aria-labelledby="title desc">
<title id="title">WX.10 — One DEMO catalog and a 44-day timeline</title>
<desc id="desc">Draft scope board for one deterministic synthetic DEMO timeline with 40 weather-event days and two clear buffer days at each edge, displayed as a rolling 30 historical and 14 forecast day window. Weather alerts and UI rendering are excluded.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#101d2b"/><stop offset="1" stop-color="#182d3c"/></linearGradient>
  <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#71d6c2"/><stop offset="1" stop-color="#8ebeff"/></linearGradient>
  <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0,0 L0,8 L8,4 z" fill="#8ee2cf"/></marker>
  <style>
    .sans{font-family:Inter,Roboto,"Arial",sans-serif}.mono{font-family:"Roboto Mono",monospace}
    .ink{fill:#f3f5f2}.muted{fill:#a8bac4}.teal{fill:#8ee2cf}.blue{fill:#a6caff}.amber{fill:#f1c477}.red{fill:#f29b91}
    .card{fill:#1e3443;stroke:#355263;stroke-width:1.5}.inner{fill:#162a38;stroke:#304b5c;stroke-width:1}
    .rule{stroke:#3b5969;stroke-width:1}.pill{fill:#294555;stroke:#496878;stroke-width:1}
  </style>
</defs>
<rect width="1440" height="2220" fill="url(#bg)"/>
<circle cx="1320" cy="130" r="180" fill="#55b8aa" opacity=".07"/><circle cx="90" cy="1920" r="230" fill="#709ad2" opacity=".06"/>
<g class="sans">
  <text x="84" y="78" class="teal" font-size="18" font-weight="700" letter-spacing="3">OXYGEN WX  /  DEMO DATA MODEL  /  WX.10</text>
  <text x="84" y="146" class="ink" font-size="48" font-weight="700">One DEMO catalog. A 44-day timeline.</text>
  <text x="84" y="188" class="muted" font-size="21">Synthetic weather coverage for development and troubleshooting; one shared catalog shape.</text>
  <rect x="1074" y="66" width="280" height="44" rx="22" class="pill"/><text x="1214" y="94" text-anchor="middle" class="teal" font-size="14" font-weight="700" letter-spacing="1">APPROVED · 2026-10-27</text>

  <rect x="72" y="230" width="1296" height="250" rx="22" class="card"/>
  <text x="106" y="275" class="teal" font-size="15" font-weight="700" letter-spacing="2">01  /  PURPOSE</text>
  <text x="106" y="316" class="ink" font-size="25" font-weight="650">A fast, predictable dataset lets teams troubleshoot data handling and app behavior.</text>
  <rect x="106" y="345" width="1228" height="94" rx="15" class="inner"/>
  <text x="132" y="383" class="blue" font-size="17" font-weight="700">ONE SYNTHETIC DEMO TIMELINE</text>
  <text x="132" y="414" class="ink" font-size="17">All agreed weather-event cases are arranged across one deterministic 44-day catalog window.</text>
  <text x="106" y="462" class="amber" font-size="15">The catalog contains weather data. It does not represent official alerts or claim to be observed weather.</text>

  <rect x="72" y="506" width="1296" height="450" rx="22" class="card"/>
  <text x="106" y="551" class="teal" font-size="15" font-weight="700" letter-spacing="2">02  /  THE 44-DAY WINDOW</text>
  <text x="106" y="592" class="ink" font-size="24" font-weight="650">30 historical days + 14 forecast days; two clear buffer days at both catalog edges.</text>
  <text x="106" y="632" class="blue mono" font-size="16">Window anchored to asOf / current date · each cell represents one local calendar day</text>
  <!-- 44 daily cells: 2 clear + 28 event historical + 12 event forecast + 2 clear -->
  <g>
    <rect x="110" y="665" width="23" height="48" rx="4" fill="#6f8792"/><rect x="137" y="665" width="23" height="48" rx="4" fill="#6f8792"/>
    <rect x="164" y="665" width="23" height="48" rx="4" fill="#4d91a1"/><rect x="191" y="665" width="23" height="48" rx="4" fill="#4d91a1"/>
    <rect x="218" y="665" width="23" height="48" rx="4" fill="#4d91a1"/><rect x="245" y="665" width="23" height="48" rx="4" fill="#4d91a1"/>
    <rect x="272" y="665" width="23" height="48" rx="4" fill="#4d91a1"/><rect x="299" y="665" width="23" height="48" rx="4" fill="#4d91a1"/>
    <rect x="326" y="665" width="23" height="48" rx="4" fill="#4d91a1"/><rect x="353" y="665" width="23" height="48" rx="4" fill="#4d91a1"/>
    <rect x="380" y="665" width="23" height="48" rx="4" fill="#4d91a1"/><rect x="407" y="665" width="23" height="48" rx="4" fill="#4d91a1"/>
    <rect x="434" y="665" width="23" height="48" rx="4" fill="#4d91a1"/><rect x="461" y="665" width="23" height="48" rx="4" fill="#4d91a1"/>
    <rect x="488" y="665" width="23" height="48" rx="4" fill="#4d91a1"/><rect x="515" y="665" width="23" height="48" rx="4" fill="#4d91a1"/>
    <rect x="542" y="665" width="23" height="48" rx="4" fill="#4d91a1"/><rect x="569" y="665" width="23" height="48" rx="4" fill="#4d91a1"/>
    <rect x="596" y="665" width="23" height="48" rx="4" fill="#4d91a1"/><rect x="623" y="665" width="23" height="48" rx="4" fill="#4d91a1"/>
    <rect x="650" y="665" width="23" height="48" rx="4" fill="#4d91a1"/><rect x="677" y="665" width="23" height="48" rx="4" fill="#4d91a1"/>
    <rect x="704" y="665" width="23" height="48" rx="4" fill="#4d91a1"/><rect x="731" y="665" width="23" height="48" rx="4" fill="#4d91a1"/>
    <rect x="758" y="665" width="23" height="48" rx="4" fill="#4d91a1"/><rect x="785" y="665" width="23" height="48" rx="4" fill="#4d91a1"/>
    <rect x="812" y="665" width="23" height="48" rx="4" fill="#4d91a1"/><rect x="839" y="665" width="23" height="48" rx="4" fill="#4d91a1"/>
    <rect x="866" y="665" width="23" height="48" rx="4" fill="#4d91a1"/><rect x="893" y="665" width="23" height="48" rx="4" fill="#4d91a1"/>
    <rect x="920" y="665" width="23" height="48" rx="4" fill="#4d91a1"/><rect x="947" y="665" width="23" height="48" rx="4" fill="#4d91a1"/>
    <rect x="974" y="665" width="23" height="48" rx="4" fill="#4d91a1"/><rect x="1001" y="665" width="23" height="48" rx="4" fill="#4d91a1"/>
    <rect x="1028" y="665" width="23" height="48" rx="4" fill="#4d91a1"/><rect x="1055" y="665" width="23" height="48" rx="4" fill="#4d91a1"/>
    <rect x="1082" y="665" width="23" height="48" rx="4" fill="#4d91a1"/><rect x="1109" y="665" width="23" height="48" rx="4" fill="#4d91a1"/>
    <rect x="1136" y="665" width="23" height="48" rx="4" fill="#4d91a1"/><rect x="1163" y="665" width="23" height="48" rx="4" fill="#4d91a1"/>
    <rect x="1190" y="665" width="23" height="48" rx="4" fill="#4d91a1"/><rect x="1217" y="665" width="23" height="48" rx="4" fill="#4d91a1"/>
    <rect x="1244" y="665" width="23" height="48" rx="4" fill="#4d91a1"/><rect x="1271" y="665" width="23" height="48" rx="4" fill="#4d91a1"/>
    <rect x="1298" y="665" width="23" height="48" rx="4" fill="#6f8792"/><rect x="1325" y="665" width="23" height="48" rx="4" fill="#6f8792"/>
  </g>
  <line x1="920" y1="650" x2="920" y2="730" stroke="#f1c477" stroke-width="2" stroke-dasharray="5 5"/>
  <text x="110" y="748" class="muted" font-size="14">D−30</text><text x="1348" y="748" text-anchor="end" class="muted" font-size="14">D+13</text>
  <rect x="110" y="773" width="54" height="28" rx="14" class="pill"/><text x="137" y="792" text-anchor="middle" class="ink" font-size="13">2 clear</text>
  <text x="542" y="793" text-anchor="middle" class="blue" font-size="15" font-weight="700">28 HISTORICAL EVENT DAYS</text>
  <text x="1110" y="793" text-anchor="middle" class="teal" font-size="15" font-weight="700">12 FORECAST EVENT DAYS</text>
  <rect x="1294" y="773" width="54" height="28" rx="14" class="pill"/><text x="1321" y="792" text-anchor="middle" class="ink" font-size="13">2 clear</text>
  <text x="106" y="842" class="ink" font-size="17">Today / asOf = D · history: D−30 … D−1 · forecast: D … D+13</text>
  <text x="106" y="876" class="ink" font-size="17">40-day event core: D−28 … D+11</text>
  <text x="106" y="910" class="muted" font-size="15">Cases may overlap. Clear edge days are explicit demo facts, not missing data.</text>
  <text x="106" y="938" class="amber" font-size="14">The 44-day view does not cap how much a saved location catalog may later retain.</text>

  <rect x="72" y="982" width="1296" height="300" rx="22" class="card"/>
  <text x="106" y="1027" class="teal" font-size="15" font-weight="700" letter-spacing="2">03  /  WEATHER-EVENT DATA COVERAGE</text>
  <text x="106" y="1067" class="ink" font-size="24" font-weight="650">One deterministic timeline exercises the agreed weather cases.</text>
  <rect x="106" y="1095" width="1228" height="126" rx="15" class="inner"/>
  <line x1="714" y1="1110" x2="714" y2="1206" class="rule"/>
  <text x="132" y="1132" class="blue" font-size="16" font-weight="700">PRECIPITATION &amp; STORMS</text>
  <text x="132" y="1167" class="ink" font-size="16">Rain · snow · sleet · thunderstorms</text>
  <text x="132" y="1198" class="muted" font-size="15">Heavy rain / flash-flood conditions are synthetic data, not alerts.</text>
  <text x="742" y="1132" class="blue" font-size="16" font-weight="700">SKY, VISIBILITY &amp; WIND</text>
  <text x="742" y="1167" class="ink" font-size="16">Clear · partly cloudy · haze · fog · high winds</text>
  <text x="742" y="1198" class="muted" font-size="15">Plus additional agreed cases; coverage is data-first, not UI acceptance.</text>
  <text x="106" y="1253" class="amber" font-size="15">Absent facts remain absent; explicitly supplied zero is preserved. Weather alerts are outside this roadmap.</text>

  <rect x="72" y="1308" width="1296" height="302" rx="22" class="card"/>
  <text x="106" y="1353" class="teal" font-size="15" font-weight="700" letter-spacing="2">04  /  LOCATION CATALOG · SHARED DATA SHAPE</text>
  <text x="106" y="1393" class="ink" font-size="24" font-weight="650">The catalog holds location facts; the app operates on the data present.</text>
  <rect x="106" y="1422" width="344" height="114" rx="15" class="inner"/>
  <text x="132" y="1458" class="blue" font-size="14" font-weight="700" letter-spacing="1">DEMO · THIS DATA WORK</text>
  <text x="132" y="1494" class="ink" font-size="17">One synthetic 44-day timeline</text>
  <text x="132" y="1520" class="muted" font-size="15">fast troubleshooting content</text>
  <path d="M450 1479 H516" fill="none" stroke="#8ee2cf" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="530" y="1422" width="380" height="114" rx="15" class="inner"/>
  <text x="720" y="1458" text-anchor="middle" class="blue" font-size="14" font-weight="700" letter-spacing="1">SAME LOCATION CATALOG</text>
  <text x="720" y="1494" text-anchor="middle" class="ink" font-size="17">location + dataset + valid times</text>
  <text x="720" y="1520" text-anchor="middle" class="muted" font-size="15">provider-neutral typed weather facts</text>
  <path d="M910 1479 H976" fill="none" stroke="#8ee2cf" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="990" y="1422" width="344" height="114" rx="15" class="inner"/>
  <text x="1016" y="1458" class="blue" font-size="14" font-weight="700" letter-spacing="1">REAL · FUTURE DATA PATH</text>
  <text x="1016" y="1494" class="ink" font-size="17">chosen location data</text>
  <text x="1016" y="1520" class="muted" font-size="15">same catalog contract</text>
  <text x="106" y="1575" class="amber" font-size="15">Real-data loading, saved multi-location updates, and source switching are future work—not WX.10 behavior.</text>

  <rect x="72" y="1636" width="1296" height="270" rx="22" class="card"/>
  <text x="106" y="1681" class="teal" font-size="15" font-weight="700" letter-spacing="2">05  /  VIEWPORT &amp; NAVIGATION</text>
  <text x="106" y="1721" class="ink" font-size="24" font-weight="650">A narrow viewport navigates through the already available 44-day window.</text>
  <rect x="106" y="1750" width="1228" height="86" rx="15" class="inner"/>
  <line x1="148" y1="1800" x2="1292" y2="1800" stroke="url(#accent)" stroke-width="3"/>
  <rect x="345" y="1767" width="251" height="67" rx="12" fill="#3e7182" stroke="#8ee2cf" stroke-width="2"/>
  <text x="470" y="1795" text-anchor="middle" class="ink" font-size="16" font-weight="700">VISIBLE VIEW</text>
  <text x="470" y="1819" text-anchor="middle" class="muted" font-size="14">about 7–9 days</text>
  <text x="148" y="1868" class="muted" font-size="15">scroll within loaded catalog</text>
  <text x="1292" y="1868" text-anchor="end" class="teal" font-size="15">44 days available · no fetch required for ordinary scrolling</text>

  <rect x="72" y="1932" width="1296" height="210" rx="22" class="card"/>
  <text x="106" y="1977" class="teal" font-size="15" font-weight="700" letter-spacing="2">06  /  SCOPE &amp; ACCEPTANCE BOUNDARY</text>
  <text x="106" y="2017" class="ink" font-size="23" font-weight="650">Data representation first. UI event display and behavior are separate roadmap work.</text>
  <text x="106" y="2057" class="muted" font-size="16">Verify deterministic event facts, dates, provenance, null/zero semantics, and clear boundary days.</text>
  <text x="106" y="2087" class="red" font-size="15">No official alerts · no UI rendering acceptance · no real provider integration in this slice.</text>
  <text x="84" y="2180" class="muted" font-size="14" letter-spacing="1">WX.10 DEMO TIMELINE BOARD  ·  OWNER-APPROVED DESIGN INPUT  ·  BOUNDED WX.10 CYCLE PLAN REQUIRED BEFORE IMPLEMENTATION</text>
</g>
</svg>
