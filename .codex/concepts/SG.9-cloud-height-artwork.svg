  <text x="72" y="840" fill="#fff" font-family="sans-serif" font-size="22" font-weight="700">Acceptance intent</text>
  <text x="72" y="878" fill="#c9d8e2" font-family="sans-serif" font-size="18">No cloud pixels cross the dashed boundary in any state or transition. A hard clip may enforce the cap, while rain and snow can occupy the scene below it.</text>
  <text x="72" y="914" fill="#c9d8e2" font-family="sans-serif" font-size="18">Cloud support, cloud-cover facts, precipitation meaning, city depth, time selection, and readable forecast text stay unchanged.</text>
  <text x="72" y="982" fill="#ffdc8a" font-family="sans-serif" font-size="17" font-weight="700">DRAFT · Approval pending for both cloud-height behavior and scene artwork.</text>
</svg>
