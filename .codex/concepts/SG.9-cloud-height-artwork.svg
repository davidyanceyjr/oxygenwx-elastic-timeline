      <rect y="190" width="460" height="400" fill="#1b2e45"/>
      <circle cx="381" cy="57" r="23" fill="#e8f1dd" fill-opacity=".9"/>
      <path d="M0 320h48v-105h42v76h38v-146h51v113h38v-86h36v126h51v-173h54v166h38v-95h64v284H0Z" fill="#294258"/>
      <path d="M0 426h52v-91h56v69h35v-123h67v97h48v-62h57v108h42v-137h65v116h38v-77h48v264H0Z" fill="#17283a"/>
