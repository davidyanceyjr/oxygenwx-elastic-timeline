  <rect width="1600" height="1040" fill="url(#page)"/>
  <text x="72" y="76" fill="#fff" font-family="sans-serif" font-size="36" font-weight="700">SG.9 · Cloud height rule</text>
  <text x="72" y="116" fill="#c4d4e1" font-family="sans-serif" font-size="19">DRAFT FOR OWNER REVIEW · Clouds remain entirely within the upper third of the scene viewport.</text>
  <text x="72" y="155" fill="#9fd5e5" font-family="sans-serif" font-size="17">BOUND: y = 0.33 × canvas height · includes silhouette edges, blur, shadow, and motion frames</text>

