      <rect x="12" y="120" width="187" height="28" rx="14" fill="#25364a" fill-opacity=".86"/>
      <text x="23" y="140" fill="#ffe39a" font-family="sans-serif" font-size="14" font-weight="700">33% CLOUD BOUNDARY</text>
      <text x="22" y="39" fill="#fff" font-family="sans-serif" font-size="17" font-weight="700">CLOUDY · DAY</text>
      <rect y="543" width="460" height="47" fill="#101d2a" fill-opacity=".82"/>
      <text x="20" y="573" fill="#e9f2f6" font-family="sans-serif" font-size="16">Forecast values remain readable above the scene.</text>
      <rect width="460" height="590" rx="18" fill="none" stroke="#a8c0d3" stroke-width="2"/>
    </g>
    <g transform="translate(500 0)">
      <rect width="460" height="590" rx="18" fill="url(#sky)"/>
      <rect y="190" width="460" height="400" fill="url(#city)"/>
      <path d="M0 320h48v-105h42v76h38v-146h51v113h38v-86h36v126h51v-173h54v166h38v-95h64v284H0Z" fill="#315067"/>
      <path d="M0 426h52v-91h56v69h35v-123h67v97h48v-62h57v108h42v-137h65v116h38v-77h48v264H0Z" fill="#1d3145"/>
      <g clip-path="url(#cloud-zone)" transform="translate(135 0) scale(1.35 .9)"><use href="#cloud"/></g>
      <use href="#rain"/>
      <line x1="0" x2="460" y1="115" y2="115" stroke="#ffdb75" stroke-width="3" stroke-dasharray="10 7"/>
      <rect x="12" y="120" width="187" height="28" rx="14" fill="#25364a" fill-opacity=".86"/>
      <text x="23" y="140" fill="#ffe39a" font-family="sans-serif" font-size="14" font-weight="700">33% CLOUD BOUNDARY</text>
      <text x="22" y="39" fill="#fff" font-family="sans-serif" font-size="17" font-weight="700">RAIN · DAY</text>
      <rect y="543" width="460" height="47" fill="#101d2a" fill-opacity=".82"/>
      <text x="20" y="573" fill="#e9f2f6" font-family="sans-serif" font-size="16">Rain continues below the bounded cloud band.</text>
