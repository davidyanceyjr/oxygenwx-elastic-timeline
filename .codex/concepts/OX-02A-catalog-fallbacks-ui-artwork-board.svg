        <circle cx="109" cy="119" r="20" fill="#1e374e" stroke="#b9cad6" stroke-width="1.5" stroke-dasharray="4 4"/>
        <text x="109" y="125" text-anchor="middle" font-size="17" fill="#d9e3eb">—</text>
