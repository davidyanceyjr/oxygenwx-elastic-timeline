<svg xmlns="http://www.w3.org/2000/svg" width="1660" height="1120" viewBox="0 0 1660 1120" role="img" aria-labelledby="title desc">
  <title id="title">OX-02A catalog fallback UI artwork board</title>
  <desc id="desc">A schematic parity target showing composition and reading route appearances side by side for supported, missing, and carried forecast conditions, plus the unverified view-only branches and slice boundaries.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#264e70"/>
      <stop offset="0.7" stop-color="#66899a"/>
      <stop offset="1" stop-color="#9c9b87"/>
    </linearGradient>
    <linearGradient id="darkSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#192d43"/>
      <stop offset="1" stop-color="#34495a"/>
    </linearGradient>
  </defs>
  <rect width="1660" height="1120" fill="#e9edf2"/>
  <text x="34" y="44" font-family="sans-serif" font-size="27" font-weight="700" fill="#16283e">OX-02A · Catalog renderer parity artwork</text>
  <text x="34" y="74" font-family="sans-serif" font-size="15" fill="#40546a">Draft for owner review · schematic target, not an installed screenshot · preserve the existing foreground, timeline, and scene treatment</text>
  <rect x="34" y="91" width="1592" height="42" rx="10" fill="#d5e1e9"/>
  <text x="52" y="117" font-family="sans-serif" font-size="14" font-weight="700" fill="#243d52">PARITY RULE</text>
  <text x="154" y="117" font-family="sans-serif" font-size="14" fill="#243d52">For the same selected instant and inputs, a reading route being consolidated must match the composition route’s supported facts, source-time disclosure, scene state, and timeline selection.</text>

