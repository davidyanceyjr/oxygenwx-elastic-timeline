  <!-- View-only route notes -->
  <g font-family="sans-serif">
    <g transform="translate(28,704)">
      <rect width="520" height="331" rx="18" fill="#fff" stroke="#b7c6d1" stroke-width="2"/>
      <text x="20" y="34" font-size="17" font-weight="700" fill="#20384e">VIEW-ONLY · scene = null</text>
      <text x="20" y="57" font-size="12" fill="#52677b">Known Android test input · no atmospheric renderer call on this branch</text>
      <rect x="20" y="77" width="215" height="180" rx="14" fill="#11263d"/>
      <text x="127" y="113" text-anchor="middle" font-size="11" fill="#e5edf4">plain scene field</text>
      <text x="127" y="154" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">selected facts remain</text>
      <text x="127" y="180" text-anchor="middle" font-size="12" fill="#dbe5ec">timeline and foreground UI</text>
      <line x1="42" y1="224" x2="213" y2="224" stroke="#9fb3c2"/>
      <line x1="127" y1="214" x2="127" y2="236" stroke="#fff" stroke-width="2"/>
      <text x="258" y="99" font-size="13" font-weight="700" fill="#31566c">SOURCE-ONLY FACT</text>
      <text x="258" y="124" font-size="12" fill="#52677b">The test source passes `scene = null`.</text>
      <text x="258" y="147" font-size="12" fill="#52677b">It identifies the no-scene branch;</text>
      <text x="258" y="170" font-size="12" fill="#52677b">it does not exercise state-only rendering.</text>
      <rect x="20" y="278" width="480" height="32" rx="8" fill="#e6edf2"/>
      <text x="32" y="299" font-size="11" fill="#40546a">Android test caller found; test not run · no production scene caller found</text>
    </g>

    <g transform="translate(570,704)">
      <rect width="520" height="331" rx="18" fill="#fff" stroke="#c7a45d" stroke-width="2"/>
      <text x="20" y="34" font-size="17" font-weight="700" fill="#20384e">STATE-ONLY · scene present</text>
      <text x="20" y="57" font-size="12" fill="#52677b">Reachability and resulting appearance are unverified</text>
      <rect x="20" y="77" width="480" height="114" rx="14" fill="#f3e8cf" stroke="#c7a45d" stroke-dasharray="6 4"/>
      <text x="260" y="113" text-anchor="middle" font-size="13" font-weight="700" fill="#775a2d">KEEP THE CURRENT ROUTE WHILE UNVERIFIED</text>
      <text x="260" y="139" text-anchor="middle" font-size="12" fill="#604d2c">No production scene caller or scene-present test caller was found.</text>
      <text x="260" y="163" text-anchor="middle" font-size="12" fill="#604d2c">Do not invent a parity claim or remove this branch by absence alone.</text>
      <text x="20" y="222" font-size="13" font-weight="700" fill="#31566c">Before a disposition changes</text>
      <text x="20" y="246" font-size="12" fill="#52677b">Record an actual caller + trigger, then compare the same selected instant,</text>
      <text x="20" y="267" font-size="12" fill="#52677b">source facts, scene output, and visible disclosures with installed evidence.</text>
      <text x="20" y="304" font-size="11" fill="#697e8f">This artwork leaves the state-present visual target open until reachable input exists.</text>
    </g>

    <g transform="translate(1112,704)">
      <rect width="520" height="331" rx="18" fill="#fff" stroke="#b7c6d1" stroke-width="2"/>
      <text x="20" y="34" font-size="17" font-weight="700" fill="#20384e">SCOPE &amp; ACCEPTANCE</text>
      <circle cx="27" cy="75" r="4" fill="#39766f"/>
      <text x="42" y="80" font-size="12" fill="#40546a">Composition stays the primary catalog renderer.</text>
      <circle cx="27" cy="108" r="4" fill="#39766f"/>
      <text x="42" y="113" font-size="12" fill="#40546a">Reading route consolidates only after supported, missing,</text>
      <text x="42" y="132" font-size="12" fill="#40546a">and carried-state parity plus direct interactions pass.</text>
      <circle cx="27" cy="161" r="4" fill="#c09542"/>
      <text x="42" y="166" font-size="12" fill="#40546a">Unverified state-only route remains until evidence supports</text>
      <text x="42" y="185" font-size="12" fill="#40546a">a keep/consolidate decision.</text>
      <circle cx="27" cy="214" r="4" fill="#8b79a2"/>
      <text x="42" y="219" font-size="12" fill="#40546a">Fixture / Time Lab previews stay separate and unchanged.</text>
      <rect x="20" y="252" width="480" height="54" rx="9" fill="#e6edf2"/>
      <text x="34" y="275" font-size="11" font-weight="700" fill="#40546a">BOARD SKETCH ≠ INSTALLED EVIDENCE</text>
      <text x="34" y="293" font-size="11" fill="#52677b">No runtime checks, captures, or app acceptance are claimed here.</text>
    </g>
  </g>
  <text x="34" y="1081" font-family="sans-serif" font-size="12" fill="#5a6e80">Values and condition names in the comparison panels are schematic placeholders. Artwork approval sets the parity target; later installed evidence must use actual catalog states and disclose their actual source times.</text>
</svg>
