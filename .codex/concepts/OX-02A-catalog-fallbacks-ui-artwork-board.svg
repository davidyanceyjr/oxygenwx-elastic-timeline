        <text x="109" y="194" text-anchor="middle" font-size="29" font-weight="700" fill="#ffffff">72°</text>
        <text x="109" y="214" text-anchor="middle" font-size="10" fill="#d8e2eb">INDEPENDENT FACT</text>
        <text x="109" y="287" text-anchor="middle" font-size="11" fill="#e6edf4">Selected · 3:00 PM</text>
        <text x="109" y="303" text-anchor="middle" font-size="10" fill="#e6edf4">No condition source claim</text>
        <line x1="17" y1="327" x2="201" y2="327" stroke="#a9bac9" stroke-width="1"/>
        <line x1="109" y1="317" x2="109" y2="339" stroke="#f5f8ff" stroke-width="2"/>
        <text x="109" y="350" text-anchor="middle" font-size="9" fill="#e6edf4">TIMELINE · SAME SELECTION</text>
