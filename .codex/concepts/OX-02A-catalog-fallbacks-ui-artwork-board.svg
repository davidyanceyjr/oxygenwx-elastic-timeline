      <text x="20" y="459" font-size="13" font-weight="700" fill="#31566c">MATCH WITHOUT A CONDITION CLAIM</text>
      <text x="20" y="481" font-size="12" fill="#52677b">Retain independent values; do not add a weather symbol or claim.</text>
      <text x="20" y="499" font-size="12" fill="#52677b">Scene details follow the supported reading; no runtime claim.</text>
      <text x="20" y="518" font-size="11" fill="#697e8f">Illustrative values only; inspect actual scene output during execution.</text>
