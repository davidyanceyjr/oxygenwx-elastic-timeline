<svg xmlns="http://www.w3.org/2000/svg" width="1900" height="1430" viewBox="0 0 1900 1430" role="img" aria-labelledby="title desc">
  <title id="title">OX-18 UI artwork board: minimal second world, same weather truth</title>
  <desc id="desc">Approved schematic comparing the First City baseline with a minimal open landscape at the same selected catalog instant and shared weather decisions. The paired view is for review only, not an in-app split screen. Both scenes preserve selected-time evidence, support, and source-time meaning.</desc>
