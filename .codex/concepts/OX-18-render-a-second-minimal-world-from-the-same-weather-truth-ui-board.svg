      <text x="14" y="154" font-family="DejaVu Sans, sans-serif" font-size="9" font-weight="700" fill="#fff0c5">upper-third cloud guide</text>
    </g>
    <rect x="24" y="538" width="822" height="34" rx="8" fill="#e8f0f3" stroke="#c2d3db"/>
    <text x="39" y="560" font-family="DejaVu Sans, sans-serif" font-size="12" font-weight="700" fill="#31566b">Same condition decision · same support · same exact instant T</text>
    <text x="24" y="602" font-family="DejaVu Sans, sans-serif" font-size="11" fill="#60788a">City-specific depth and composition stay intact; the single rain field crosses near buildings as approved.</text>
    <text x="24" y="630" font-family="DejaVu Sans, sans-serif" font-size="11" fill="#60788a">Forecast foreground and timeline are unchanged; the pair is a board-only comparison.</text>
    <text x="24" y="676" font-family="DejaVu Sans, sans-serif" font-size="10" font-weight="700" fill="#526b7e">SAME SELECTED-TIME ANCHOR</text>
