    <linearGradient id="page" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f7f9fb"/><stop offset="1" stop-color="#e5ecf1"/></linearGradient>
    <linearGradient id="rainSky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#263c52"/><stop offset=".68" stop-color="#637d8a"/><stop offset="1" stop-color="#9b9d96"/></linearGradient>
    <linearGradient id="landSky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#30495b"/><stop offset=".67" stop-color="#718895"/><stop offset="1" stop-color="#aeb2a5"/></linearGradient>
    <linearGradient id="readout" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#203c54"/><stop offset="1" stop-color="#11283d"/></linearGradient>
    <clipPath id="cityClip"><rect x="0" y="0" width="822" height="420" rx="12"/></clipPath>
    <clipPath id="landClip"><rect x="0" y="0" width="822" height="420" rx="12"/></clipPath>
  </defs>
  <rect width="1900" height="1430" fill="url(#page)"/>
  <text x="54" y="48" font-family="DejaVu Sans, sans-serif" font-size="30" font-weight="700" fill="#1e3448">OX-18 · one weather truth, two minimal world compositions</text>
  <text x="55" y="78" font-family="DejaVu Sans, sans-serif" font-size="15" fill="#526b7e">UI artwork board · cycle 146 · APPROVED BY PRODUCT OWNER · 2026-11-16 · schematic, not installed evidence</text>

