  <circle cx="83" cy="129" r="12" fill="#d08a32"/>
  <text x="108" y="124" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="700" fill="#654d2b">REVIEW COMPARISON ONLY</text>
  <text x="108" y="145" font-family="DejaVu Sans, sans-serif" font-size="13" fill="#695d49">The two panes are not an in-app split-screen; no scene picker, switching interaction, or layout change is proposed.</text>
  <text x="1278" y="134" font-family="DejaVu Sans, sans-serif" font-size="13" font-weight="700" fill="#176f7c">Same catalog · same selected instant · same semantic weather decisions</text>

  <rect x="54" y="184" width="1792" height="156" rx="18" fill="#ffffff" stroke="#91aab8" stroke-width="2"/>
  <text x="82" y="216" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="700" fill="#20384a">SHARED INPUT AND DECISION CONTRACT</text>
  <rect x="80" y="232" width="540" height="47" rx="10" fill="#e7f0f3" stroke="#b5c9d3"/>
  <text x="103" y="262" font-family="DejaVu Sans, sans-serif" font-size="13" font-weight="700" fill="#31566b">ONE CATALOG / LOCATION · identical in both panes</text>
  <rect x="680" y="232" width="540" height="47" rx="10" fill="#e7f0f3" stroke="#b5c9d3"/>
  <text x="703" y="262" font-family="DejaVu Sans, sans-serif" font-size="13" font-weight="700" fill="#31566b">EXACT SELECTED INSTANT T · unchanged</text>
  <rect x="1280" y="232" width="540" height="47" rx="10" fill="#e7f0f3" stroke="#b5c9d3"/>
  <text x="1303" y="262" font-family="DejaVu Sans, sans-serif" font-size="13" font-weight="700" fill="#31566b">EVIDENCE / SOURCE TIMES · identical</text>
  <text x="82" y="315" font-family="DejaVu Sans, sans-serif" font-size="13" fill="#526b7e">Weather meaning is resolved once; each world applies its own minimal composition and artwork. Forecast facts and timeline remain at their approved baseline.</text>

