<!-- behavioral contract -->
<rect x="40" y="770" width="1420" height="236" rx="20" fill="#fff" stroke="#c8d7df" stroke-width="2"/>
<text x="66" y="811" class="label">PROPOSED CLOUD STORY</text>
<text x="66" y="849" class="note">• Rain uses one continuous, broad cloud bank arriving from a single side; a heavy-rain storm uses banks converging from both sides.</text>
<text x="66" y="882" class="note">• Keep each bank coherent and smooth: no repeated cloud puffs, dotted paths, or marching-ants motion.</text>
<text x="66" y="915" class="note">• Blue buildings stay distant; storm banks pass in front. Missing cloud data adds no cloud claim.</text>
<text x="66" y="948" class="note">• Selected time determines the scene; interpolate smoothly while scrubbing and hold a still frame for reduced motion.</text>
<text x="66" y="982" class="small">Direction is a scene cue for precipitation, not a claim about measured wind, cloud speed, or unsupported event timing.</text>
<text x="1440" y="1036" class="small" text-anchor="end">Product-owner approved 2026-10-31 · not installed evidence</text>
</svg>
