<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="1320" viewBox="0 0 1700 1320" role="img" aria-labelledby="title desc">
  <title id="title">WX.18 · Saved location state concept</title>
  <desc id="desc">Review board showing stable local location identity, saved location records, selected location restoration, and explicit open policy decisions for persistence.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth"><path d="M1,1 L11,6 L1,11 Z" fill="#81d8c3"/></marker>
    <style>
      text{font-family:Inter,"DejaVu Sans",Arial,sans-serif;fill:#eef3f7}
      .title{font-size:39px;font-weight:700}.sub{font-size:19px;fill:#b8c6d2}
      .head{font-size:22px;font-weight:700;fill:#81d8c3}.label{font-size:18px;font-weight:700}
      .body{font-size:16px;fill:#c0ccd6}.small{font-size:14px;fill:#b8c6d2}
      .mono{font-family:"DejaVu Sans Mono",monospace;font-size:16px;fill:#eef3f7}
      .panel{fill:#192a39;stroke:#4b687b;stroke-width:2}.mint{fill:#1a343b;stroke:#81d8c3;stroke-width:2}
      .blue{fill:#1b3041;stroke:#66869c;stroke-width:2}.warm{fill:#332b2c;stroke:#f2a184;stroke-width:2}
      .deep{fill:#112432;stroke:#486779;stroke-width:1.5}.line{fill:none;stroke:#81d8c3;stroke-width:3;marker-end:url(#arrow)}
      .mutedline{fill:none;stroke:#7190a4;stroke-width:2.5;stroke-dasharray:8 7}
    </style>
  </defs>
  <rect width="1700" height="1320" fill="#101a24"/>
  <text x="70" y="67" class="title">WX.18 · Saved locations as durable application state</text>
  <text x="72" y="103" class="sub">Concept board · stable local identity, explicit selection, and location-scoped catalog ownership</text>
  <rect x="1434" y="42" width="194" height="42" rx="21" fill="#3a3028" stroke="#f2b27f"/>
  <text x="1531" y="69" text-anchor="middle" font-size="15" font-weight="700" fill="#f2c994">DRAFT · REVIEW</text>

  <rect x="70" y="138" width="1560" height="236" rx="18" class="panel"/>
  <text x="98" y="178" class="head">01  Accept a place once; keep app identity local</text>
  <rect x="98" y="201" width="337" height="131" rx="14" class="blue"/>
  <text x="121" y="235" class="label">Chosen WX.17 result</text>
  <text x="121" y="267" class="mono">PlaceSearchResult</text>
  <text x="121" y="297" class="body">Name · coordinates · IANA zone</text>
  <text x="121" y="319" class="small">Provider ID stays source metadata</text>
  <path d="M435 264 H492" class="line"/>
  <rect x="505" y="201" width="363" height="131" rx="14" class="mint"/>
  <text x="529" y="235" class="label">Accepting app layer</text>
  <text x="529" y="267" class="mono">create LocationId once</text>
  <text x="529" y="297" class="body">Build canonical CatalogLocation</text>
  <text x="529" y="319" class="small">Do not derive ID from label or coordinates</text>
  <path d="M868 264 H925" class="line"/>
  <rect x="938" y="201" width="310" height="131" rx="14" class="blue"/>
  <text x="962" y="235" class="label">Persist saved record</text>
  <text x="962" y="267" class="mono">LocationId → location</text>
  <text x="962" y="297" class="body">Name + precise coordinates</text>
  <text x="962" y="319" class="body">+ validated timezone</text>
  <path d="M1248 264 H1305" class="line"/>
  <rect x="1318" y="201" width="284" height="131" rx="14" class="mint"/>
  <text x="1342" y="235" class="label">Selection is a pointer</text>
  <text x="1342" y="267" class="mono">selectedLocationId</text>
  <text x="1342" y="297" class="body">References saved identity</text>
  <text x="1342" y="319" class="small">Not a second location copy</text>

  <rect x="70" y="399" width="975" height="455" rx="18" class="panel"/>
  <text x="98" y="440" class="head">02  Saved locations and the selected ID</text>
  <text x="100" y="474" class="small">Illustrative persisted state · distinct locations stay distinct even when names are similar</text>
  <rect x="98" y="496" width="919" height="73" rx="12" class="mint"/>
  <circle cx="127" cy="532" r="10" fill="#81d8c3"/>
  <text x="151" y="525" class="label">Chicago · Illinois · United States</text>
  <text x="151" y="550" class="small">America/Chicago  ·  41.8781, −87.6298</text>
  <text x="988" y="539" text-anchor="end" class="mono">loc_a91…</text>
  <rect x="98" y="582" width="919" height="73" rx="12" class="deep"/>
  <circle cx="127" cy="618" r="10" fill="none" stroke="#9bb3bf" stroke-width="2"/>
  <text x="151" y="611" class="label">Springfield · Illinois · United States</text>
  <text x="151" y="636" class="small">America/Chicago  ·  39.8017, −89.6437</text>
  <text x="988" y="625" text-anchor="end" class="mono">loc_f24…</text>
  <rect x="98" y="668" width="919" height="73" rx="12" class="deep"/>
  <circle cx="127" cy="704" r="10" fill="none" stroke="#9bb3bf" stroke-width="2"/>
  <text x="151" y="697" class="label">Springfield · Massachusetts · United States</text>
  <text x="151" y="722" class="small">America/New_York  ·  42.1015, −72.5898</text>
  <text x="988" y="711" text-anchor="end" class="mono">loc_c53…</text>
  <rect x="98" y="764" width="919" height="62" rx="12" class="blue"/>
  <text x="121" y="791" class="mono">selectedLocationId = loc_a91…</text>
  <text x="121" y="815" class="small">Selection survives process restart when the referenced saved record still exists.</text>

  <rect x="1070" y="399" width="560" height="455" rx="18" class="panel"/>
  <text x="1098" y="440" class="head">03  State transitions</text>
  <rect x="1098" y="469" width="504" height="81" rx="13" class="blue"/>
  <text x="1121" y="501" class="label">ADD</text>
  <text x="1222" y="499" class="body">Chosen valid result → new stable ID</text>
  <text x="1222" y="526" class="small">Persist location; selection policy is explicit.</text>
  <rect x="1098" y="562" width="504" height="81" rx="13" class="mint"/>
  <text x="1121" y="594" class="label">SELECT</text>
  <text x="1222" y="592" class="body">Save the ID; restore same record on launch</text>
  <text x="1222" y="619" class="small">Do not imply weather has loaded or switched.</text>
  <rect x="1098" y="655" width="504" height="81" rx="13" class="warm"/>
  <text x="1121" y="687" class="label">REMOVE</text>
  <text x="1222" y="685" class="body">Delete only the requested saved location</text>
  <text x="1222" y="712" class="small">Catalog retention and selected-ID fallback need policy.</text>
  <rect x="1098" y="748" width="504" height="78" rx="13" class="deep"/>
  <text x="1121" y="780" class="label">RESTORE</text>
  <text x="1222" y="778" class="body">Resolve selected ID against saved records</text>
  <text x="1222" y="805" class="small">Missing/corrupt state must have an explicit outcome.</text>

  <rect x="70" y="881" width="1560" height="241" rx="18" class="panel"/>
  <text x="98" y="922" class="head">04  Ownership boundary and review decisions</text>
  <rect x="98" y="946" width="684" height="139" rx="14" class="blue"/>
  <text x="122" y="980" class="label">WX.18 owns</text>
  <text x="122" y="1014" class="body">Saved location records · add/remove/select · stable ID retention</text>
  <text x="122" y="1044" class="body">Selected-location restoration · association by LocationId</text>
  <text x="122" y="1072" class="small">Manual-search UI is WX.19; loading/activation is WX.20.</text>
  <rect x="804" y="946" width="798" height="139" rx="14" class="warm"/>
  <text x="828" y="980" class="label">Resolve in the bounded plan before implementation</text>
  <text x="828" y="1014" class="body">If the selected place is removed, what becomes selected?</text>
  <text x="828" y="1044" class="body">When may a location's catalog history be deleted?</text>
  <text x="828" y="1072" class="small">Define duplicate-ID behavior and empty/corrupt restore handling.</text>

  <rect x="70" y="1147" width="1560" height="105" rx="16" class="deep"/>
  <text x="98" y="1183" class="label">Reference lineage</text>
  <text x="305" y="1183" class="body">WX.15 Room keys and migrations  ·  WX.13R fixed catalog identity/window  ·  WX.17 local ID handoff</text>
  <text x="98" y="1220" class="small">No UI, GPS permission, provider ID as storage key, weather fetch, catalog activation, or deprecated-app changes. Review artwork only; not implementation or acceptance evidence.</text>
</svg>
