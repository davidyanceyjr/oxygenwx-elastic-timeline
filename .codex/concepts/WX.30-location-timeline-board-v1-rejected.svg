<g transform="translate(1280 184)">
 <rect width="1148" height="1146" rx="24" fill="#0d2030" stroke="#294456" stroke-width="2"/>
 <text x="42" y="62" class="h" style="font-size:30px">ONE CONTROLLER · TWO LOCATION TRACKS</text><text x="42" y="98" class="sub">The location timeline owns gesture, focus, loop, readout, and actions.</text>
 <rect x="42" y="130" width="1064" height="220" rx="18" fill="#122b3d" stroke="#315264"/>
 <text x="70" y="169" class="label">SHARED HORIZONTAL NAVIGATION</text><path d="M118 220 H1025" stroke="#91b6c1" stroke-width="3" stroke-linecap="round"/><path d="M118 220 l16 -10 M118 220 l16 10 M1025 220 l-16 -10 M1025 220 l-16 10" stroke="#91b6c1" stroke-width="3" fill="none"/>
 <line x1="572" y1="194" x2="572" y2="248" stroke="#ffd67b" stroke-width="3"/><circle cx="572" cy="220" r="9" fill="#ffd67b"/><text x="572" y="272" text-anchor="middle" class="small">one pan · one center · both tracks move</text>
