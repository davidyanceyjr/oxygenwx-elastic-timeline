 <path d="M375 788 H432" stroke="#8fc3c2" stroke-width="3"/><path d="M432 788 l-12 -8 v16Z" fill="#8fc3c2"/>
 <rect x="444" y="725" width="322" height="126" rx="16" fill="#112d3c" stroke="#4a8b77"/><text x="470" y="764" style="font:700 18px Inter,Roboto,Arial,sans-serif;fill:#8fea9b">VIEW RESULT</text><text x="470" y="795" class="small">Activate in memory;</text><text x="470" y="820" class="small">discard on switch/restart.</text>
 <path d="M777 788 H834" stroke="#8fc3c2" stroke-width="3"/><path d="M834 788 l-12 -8 v16Z" fill="#8fc3c2"/>
 <rect x="846" y="725" width="260" height="126" rx="16" fill="#112d3c" stroke="#4a8b77"/><text x="872" y="764" style="font:700 18px Inter,Roboto,Arial,sans-serif;fill:#8fea9b">NEXT LOCATION</text><text x="872" y="795" class="small">Saved selection wins</text><text x="872" y="820" class="small">on restore.</text>
 <text x="42" y="910" class="label">UNCHANGED LOCATION FLOW</text><text x="42" y="947" class="note">• Manual query, loading, matches, empty and failed states stay in the city scene.</text><text x="42" y="980" class="note">• Attribution and place identity remain available; no device-location request is added.</text><text x="42" y="1013" class="note">• Saved removal uses the approved confirmation and storage behavior.</text>
