 <rect x="70" y="542" width="150" height="44" rx="22" fill="#ffd67b"/><text x="145" y="570" text-anchor="middle" class="chip">SAVE</text><rect x="240" y="542" width="150" height="44" rx="22" fill="#153a45" stroke="#67c8b6" stroke-width="2"/><text x="315" y="570" text-anchor="middle" class="body">View</text><text x="70" y="619" class="small">Save persists location + catalog · View is temporary</text>
