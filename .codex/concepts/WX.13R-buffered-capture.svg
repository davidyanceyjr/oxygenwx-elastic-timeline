<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="900" viewBox="0 0 1500 900">
  <rect width="1500" height="900" fill="#101a24"/>
  <text x="80" y="90" fill="#f5f7fa" font-family="sans-serif" font-size="38" font-weight="700">WX.13R · Forecast buffer, fixed catalog window</text>
  <text x="80" y="138" fill="#b9c6d3" font-family="sans-serif" font-size="22">Proposed request and clipping contract for a new canonical recording</text>

  <rect x="80" y="205" width="1340" height="180" rx="20" fill="#192938" stroke="#4a6579" stroke-width="2"/>
  <text x="120" y="258" fill="#85d7c5" font-family="sans-serif" font-size="23" font-weight="700">Provider request</text>
  <text x="120" y="310" fill="#f5f7fa" font-family="monospace" font-size="27">past_days=30  ·  forecast_days=15</text>
  <text x="120" y="350" fill="#b9c6d3" font-family="sans-serif" font-size="20">One extra forecast date gives the target tail a buffer; it does not expand the catalog.</text>

  <path d="M750 385 L750 440" fill="none" stroke="#85d7c5" stroke-width="4" marker-end="url(#arrow)"/>

  <rect x="80" y="465" width="1100" height="235" rx="20" fill="#1c3440" stroke="#85d7c5" stroke-width="3"/>
  <text x="120" y="520" fill="#85d7c5" font-family="sans-serif" font-size="23" font-weight="700">Canonical catalog · exactly 44 local dates</text>
  <rect x="125" y="560" width="490" height="85" rx="12" fill="#274451"/>
  <text x="155" y="598" fill="#f5f7fa" font-family="monospace" font-size="24">D−30 … D−1</text>
  <text x="155" y="628" fill="#b9c6d3" font-family="sans-serif" font-size="18">30 archived-model dates</text>
  <rect x="635" y="560" width="495" height="85" rx="12" fill="#34514e"/>
  <text x="665" y="598" fill="#f5f7fa" font-family="monospace" font-size="24">D … D+13</text>
  <text x="665" y="628" fill="#b9c6d3" font-family="sans-serif" font-size="18">14 forecast dates · expected support by IANA grid</text>

  <rect x="1200" y="465" width="220" height="235" rx="20" fill="#342b2b" stroke="#da987f" stroke-width="2" stroke-dasharray="9 8"/>
  <text x="1230" y="520" fill="#f2b49f" font-family="sans-serif" font-size="22" font-weight="700">Buffer only</text>
  <text x="1230" y="578" fill="#f5f7fa" font-family="monospace" font-size="23">D+14</text>
  <text x="1230" y="620" fill="#d5c6c1" font-family="sans-serif" font-size="18">Excluded from</text>
  <text x="1230" y="646" fill="#d5c6c1" font-family="sans-serif" font-size="18">facts and support</text>

  <rect x="80" y="755" width="1340" height="90" rx="18" fill="#192938" stroke="#4a6579" stroke-width="2"/>
  <text x="120" y="795" fill="#f5f7fa" font-family="sans-serif" font-size="21" font-weight="700">Validation</text>
  <text x="255" y="795" fill="#b9c6d3" font-family="sans-serif" font-size="20">Compare returned instants/intervals to full target support; preserve any real gaps.</text>
  <text x="255" y="825" fill="#b9c6d3" font-family="sans-serif" font-size="20">Keep approved cycle 054 v2 bytes and hash unchanged; review a new candidate separately.</text>

  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="8" refY="4" orient="auto">
      <path d="M0,0 L0,8 L10,4 z" fill="#85d7c5"/>
    </marker>
  </defs>
</svg>
