<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1320" viewBox="0 0 1800 1320">
<defs><style>
.bg{fill:#edf2f4}.title{font:700 34px Inter,Arial,sans-serif;fill:#14283c}.sub{font:16px Inter,Arial,sans-serif;fill:#52697a}.eye{font:700 14px Inter,Arial,sans-serif;letter-spacing:1.5px;fill:#227889}.h{font:700 21px Inter,Arial,sans-serif;fill:#18334b}.body{font:16px Inter,Arial,sans-serif;fill:#304a5d}.small{font:14px Inter,Arial,sans-serif;fill:#5b7182}.white{fill:#f7f9fa;font-family:Inter,Arial,sans-serif}.teal{fill:#79d5c5;font-family:Inter,Arial,sans-serif}.panel{fill:#fff;stroke:#d2dee4;stroke-width:2}.dark{fill:#132b40}.field{fill:#f5f8f9;stroke:#b7c8d0;stroke-width:1.5}.chip{fill:#e2f4ef;stroke:#98cfc4;stroke-width:1.5}.amber{fill:#fbf2df;stroke:#ddc58a;stroke-width:1.5}.line{stroke:#aabdc7;stroke-width:2}.tick{stroke:#c5d3da;stroke-width:1}
</style><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#398b94"/></marker></defs>
<rect class="bg" width="1800" height="1320"/>
<text x="54" y="48" class="eye">OXYGEN · DFM.4 · UI ARTWORK BOARD · OWNER APPROVED · 2026-11-01</text>
<text x="54" y="94" class="title">Build and replay named local forecast timelines</text>
<text x="54" y="126" class="sub">#PICKER opens only inside an active debug session. Build with supported typed facts, save locally, then explicitly preview.</text>
<rect x="1480" y="38" width="270" height="46" rx="23" class="amber"/><text x="1615" y="67" text-anchor="middle" class="eye" fill="#86651f">OWNER APPROVED · 2026-11-01</text>
<!-- two picker states -->
<rect x="52" y="162" width="816" height="970" rx="22" class="panel"/><rect x="900" y="162" width="848" height="970" rx="22" class="panel"/>
<text x="80" y="204" class="eye">01 · CATALOG LIBRARY</text><text x="928" y="204" class="eye">02 · BUILD / EDIT A SIMULATION</text>
<!-- library -->
<rect x="100" y="230" width="720" height="850" rx="22" fill="#f5f8f9" stroke="#cad8df" stroke-width="2"/>
<rect x="100" y="230" width="720" height="86" rx="22" class="dark"/><path d="M100 294H820V316H100Z" class="dark"/>
<text x="132" y="274" class="white" font-size="24" font-weight="700">Forecast catalog</text><text x="788" y="274" text-anchor="end" class="teal" font-size="14">CLOSE</text>
<rect x="132" y="337" width="330" height="50" rx="12" class="chip"/><text x="297" y="368" text-anchor="middle" class="h">Saved catalogs</text><rect x="478" y="337" width="310" height="50" rx="12" fill="#e7edf0"/><text x="633" y="368" text-anchor="middle" class="small">Build new</text>
<text x="132" y="425" class="h">SIMULATED</text><text x="788" y="425" text-anchor="end" class="small">editable local timelines</text>
<rect x="132" y="444" width="656" height="142" rx="15" fill="#fff" stroke="#d4dfe4"/>
<text x="156" y="477" class="h">Chicago · Autumn rain window</text><text x="156" y="508" class="small">Oct 30 – Nov 3 · 5 local dates · saved 4:12 PM</text>
<rect x="156" y="528" width="208" height="40" rx="10" class="chip"/><text x="260" y="554" text-anchor="middle" class="body">EDIT</text><rect x="382" y="528" width="180" height="40" rx="10" class="dark"/><text x="472" y="554" text-anchor="middle" class="white" font-size="14">PREVIEW</text><rect x="580" y="528" width="184" height="40" rx="10" fill="#edf2f4" stroke="#bac9d0"/><text x="672" y="554" text-anchor="middle" class="body">SAVE AS REPLAY</text>
<text x="132" y="634" class="h">REPLAY · FIXED SNAPSHOTS</text><text x="788" y="634" text-anchor="end" class="small">read-only after capture</text>
<rect x="132" y="653" width="656" height="125" rx="15" fill="#fff" stroke="#d4dfe4"/>
<text x="156" y="687" class="h">Chicago · Clear-to-storm study</text><text x="156" y="718" class="small">Nov 1 · 24 hours · captured from SIMULATED</text><rect x="156" y="738" width="190" height="28" rx="9" class="dark"/><text x="251" y="757" text-anchor="middle" class="white" font-size="12">PREVIEW REPLAY</text><text x="788" y="818" text-anchor="end" class="small">Saved items are local to this debug installation.</text>
<rect x="132" y="847" width="656" height="176" rx="15" class="amber"/>
<text x="156" y="884" class="h">Catalog types stay distinct</text><text x="156" y="916" class="body">SIMULATED = editable generated timeline.</text><text x="156" y="946" class="body">REPLAY = immutable saved snapshot of a timeline.</text><text x="156" y="984" class="small">Both keep synthetic provenance. Neither changes LIVE, provider,</text><text x="156" y="1008" class="small">cache, selected location, or the user's saved places.</text>
<!-- editor -->
<rect x="948" y="230" width="752" height="850" rx="22" fill="#f5f8f9" stroke="#cad8df" stroke-width="2"/>
<rect x="948" y="230" width="752" height="86" rx="22" class="dark"/><path d="M948 294H1700V316H948Z" class="dark"/>
<text x="980" y="274" class="white" font-size="24" font-weight="700">Build simulated catalog</text><text x="1668" y="274" text-anchor="end" class="teal" font-size="14">CLOSE</text>
<text x="980" y="352" class="h">Name</text><rect x="1070" y="326" width="596" height="46" rx="9" class="field"/><text x="1088" y="356" class="body">Chicago · Autumn rain window</text>
<text x="980" y="414" class="h">Timeline period · local time</text>
<rect x="980" y="430" width="300" height="54" rx="10" class="field"/><text x="1000" y="454" class="small">START</text><text x="1000" y="475" class="body">Oct 30 · 12:00 AM</text>
<rect x="1300" y="430" width="366" height="54" rx="10" class="field"/><text x="1320" y="454" class="small">END</text><text x="1320" y="475" class="body">Nov 3 · 11:00 PM</text>
<text x="980" y="530" class="h">Event timeline</text><text x="1668" y="530" text-anchor="end" class="teal" font-size="14">+ ADD EVENT</text>
<rect x="980" y="548" width="686" height="116" rx="12" fill="#fff" stroke="#d4dfe4"/>
<line x1="1010" y1="613" x2="1637" y2="613" class="line"/><g class="tick"><line x1="1020" y1="594" x2="1020" y2="630"/><line x1="1110" y1="599" x2="1110" y2="627"/><line x1="1200" y1="599" x2="1200" y2="627"/><line x1="1290" y1="594" x2="1290" y2="630"/><line x1="1380" y1="599" x2="1380" y2="627"/><line x1="1470" y1="599" x2="1470" y2="627"/><line x1="1560" y1="594" x2="1560" y2="630"/></g>
<rect x="1110" y="576" width="275" height="27" rx="8" fill="#5599a0"/><text x="1248" y="595" text-anchor="middle" class="white" font-size="12">RAIN · 18:00–23:00</text><rect x="1385" y="576" width="155" height="27" rx="8" fill="#bacbd0"/><text x="1462" y="595" text-anchor="middle" class="white" font-size="12">CLOUDY</text>
<text x="1020" y="650" class="small">OCT 30</text><text x="1290" y="650" text-anchor="middle" class="small">NOV 1</text><text x="1560" y="650" text-anchor="end" class="small">NOV 3</text>
<text x="980" y="704" class="h">Selected event · typed facts</text>
<rect x="980" y="721" width="206" height="48" rx="9" class="field"/><text x="998" y="751" class="body">Rain condition ▾</text>
<rect x="1202" y="721" width="210" height="48" rx="9" class="field"/><text x="1220" y="751" class="body">Chance 60% ▾</text>
<rect x="1428" y="721" width="238" height="48" rx="9" class="field"/><text x="1446" y="751" class="body">Amount unavailable ▾</text>
<text x="980" y="804" class="small">Probability, amount, type, and missing values are separate inputs.</text>
<rect x="980" y="829" width="686" height="83" rx="12" class="amber"/><text x="1002" y="861" class="h">Missing means unavailable</text><text x="1002" y="887" class="small">Never silently replace an absent value with zero or a guessed condition.</text>
<rect x="980" y="934" width="213" height="54" rx="12" class="chip"/><text x="1086" y="968" text-anchor="middle" class="body">SAVE SIMULATION</text>
<rect x="1208" y="934" width="205" height="54" rx="12" class="dark"/><text x="1310" y="968" text-anchor="middle" class="white" font-size="14">PREVIEW</text>
<rect x="1428" y="934" width="238" height="54" rx="12" fill="#fff" stroke="#aec0c9"/><text x="1547" y="968" text-anchor="middle" class="body">CAPTURE AS REPLAY</text>
<text x="980" y="1030" class="small">Preview is explicit and returns to the main screen through the existing selected-time path.</text>
<rect x="52" y="1150" width="1696" height="126" rx="18" fill="#e2f1ef" stroke="#add4cd" stroke-width="2"/>
<text x="82" y="1190" class="h">Period-first workflow</text><text x="82" y="1224" class="body">Name → choose local start/end → place supported weather events → save SIMULATED → optionally capture immutable REPLAY → explicitly preview.</text><text x="82" y="1252" class="small">No provider requests, live/cache writes, location edits, background generation, or new weather meanings. Local preview is labeled synthetic.</text>
</svg>
