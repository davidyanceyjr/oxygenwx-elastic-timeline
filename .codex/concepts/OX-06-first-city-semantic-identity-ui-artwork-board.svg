  <title id="title">OX-06 UI artwork board: First City semantic identities</title>
  <desc id="desc">Draft schematic showing unchanged First City day, night, and rain appearances with review-only labels that map meaningful objects to semantic roles. The labels are not part of the app UI; the existing readout, timeline, weather meaning, and depth order remain unchanged.</desc>
