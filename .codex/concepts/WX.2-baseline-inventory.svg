<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 z" fill="#52637a"/>
    </marker>
    <marker id="futureArrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 z" fill="#5675ad"/>
    </marker>
    <style>
      text { font-family: Inter, "DejaVu Sans", sans-serif; fill: #17243a; }
      .title { font-size: 34px; font-weight: 750; letter-spacing: .4px; }
      .subtitle { font-size: 16px; fill: #5b6b80; }
      .panelTitle { font-size: 20px; font-weight: 700; }
      .panelSub { font-size: 13px; fill: #68788e; }
      .nodeTitle { font-size: 15px; font-weight: 700; }
      .nodeText { font-size: 12px; fill: #45566e; }
      .tiny { font-size: 10px; fill: #607087; }
      .badge { font-size: 10px; font-weight: 700; letter-spacing: .8px; }
      .callTitle { font-size: 14px; font-weight: 700; }
      .callText { font-size: 12px; fill: #475971; }
      .solid { stroke: #52637a; stroke-width: 2.4; fill: none; marker-end: url(#arrow); }
      .future { stroke: #5675ad; stroke-width: 2.4; stroke-dasharray: 8 6; fill: none; marker-end: url(#futureArrow); }
    </style>
  </defs>

  <rect width="1920" height="1080" fill="#f3f6fa"/>
  <text x="48" y="55" class="title">WX.2  |  CURRENT → TARGET DATAFLOW</text>
  <text x="50" y="83" class="subtitle">Example inventory board • solid arrows = checked-in flow • dashed arrows = roadmap direction • dotted card = isolated inventory</text>

  <!-- Current-state panel -->
  <rect x="42" y="112" width="900" height="665" rx="18" fill="#ffffff" stroke="#d4dce7" stroke-width="1.5"/>
  <rect x="42" y="112" width="900" height="62" rx="18" fill="#eaf0f7"/>
  <path d="M42 156 V174 H942 V156" fill="#eaf0f7"/>
  <text x="68" y="145" class="panelTitle">CURRENT • synthetic prototype</text>
  <text x="68" y="164" class="panelSub">Normal sample and generated debug profiles share presentation input.</text>

  <rect x="70" y="198" width="260" height="86" rx="11" fill="#f8fafc" stroke="#b9c7d8"/>
  <text x="88" y="223" class="nodeTitle">Normal sample</text>
  <text x="88" y="245" class="nodeText">SampleForecast</text>
  <text x="88" y="266" class="nodeText">→ ForecastSource.sample</text>

  <rect x="70" y="307" width="260" height="126" rx="11" fill="#f8fafc" stroke="#b9c7d8"/>
  <text x="88" y="333" class="nodeTitle">Generated debug profiles</text>
  <text x="88" y="355" class="nodeText">profileFacts → DebugProfileSample</text>
  <text x="88" y="375" class="nodeText">→ adapter → ForecastSource</text>
  <text x="88" y="411" class="tiny">debug/DebugForecastProfiles.kt</text>

  <rect x="70" y="461" width="260" height="119" rx="11" fill="#fbfaf6" stroke="#bcae8a" stroke-dasharray="5 4"/>
  <text x="88" y="487" class="nodeTitle">Debug catalog • separate</text>
  <text x="88" y="509" class="nodeText">12 scenarios • 3 transition sequences</text>
  <text x="88" y="531" class="nodeText">Inventory definition; no runtime edge</text>
  <text x="88" y="559" class="tiny">debug/DebugForecastCatalog.kt</text>

  <rect x="385" y="288" width="205" height="104" rx="12" fill="#edf5ff" stroke="#8ba9cf" stroke-width="1.5"/>
  <text x="407" y="318" class="nodeTitle">ForecastSource</text>
  <text x="407" y="341" class="nodeText">typed hourly facts</text>
  <text x="407" y="364" class="nodeText">reference time • provenance</text>
  <text x="407" y="381" class="tiny">presentation/ForecastSource.kt</text>

  <rect x="631" y="288" width="270" height="104" rx="12" fill="#edf5ff" stroke="#8ba9cf" stroke-width="1.5"/>
  <text x="653" y="318" class="nodeTitle">ForecastProjection</text>
  <text x="653" y="341" class="nodeText">exact sample facts → ForecastView</text>
  <text x="653" y="364" class="nodeText">scene continuity may interpolate</text>
  <text x="653" y="381" class="tiny">presentation/ForecastProjection.kt</text>

  <path d="M330 241 C354 241 356 318 385 318" class="solid"/>
  <path d="M330 370 C354 370 356 361 385 361" class="solid"/>
  <path d="M590 340 H631" class="solid"/>

