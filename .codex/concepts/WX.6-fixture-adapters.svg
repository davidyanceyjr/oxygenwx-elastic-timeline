<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1860" viewBox="0 0 1440 1860" role="img" aria-labelledby="title desc">
<title id="title">WX.6 — Fixture adapters and compatibility contract</title>
<desc id="desc">Owner-approved board for adapting existing normal and debug fixtures into canonical synthetic catalogs while retaining fixture identities and unsupported source values in adapter metadata.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#101d2b"/><stop offset="1" stop-color="#182d3c"/></linearGradient>
  <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#71d6c2"/><stop offset="1" stop-color="#8ebeff"/></linearGradient>
  <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0,0 L0,8 L8,4 z" fill="#8ee2cf"/></marker>
  <style>
    .sans{font-family:Inter,Roboto,"Arial",sans-serif}.mono{font-family:"Roboto Mono",monospace}
    .ink{fill:#f3f5f2}.muted{fill:#a8bac4}.teal{fill:#8ee2cf}.blue{fill:#a6caff}.amber{fill:#f1c477}.red{fill:#f29b91}
    .card{fill:#1e3443;stroke:#355263;stroke-width:1.5}.inner{fill:#162a38;stroke:#304b5c;stroke-width:1}
    .rule{stroke:#3b5969;stroke-width:1}.pill{fill:#294555;stroke:#496878;stroke-width:1}
  </style>
</defs>
<rect width="1440" height="1860" fill="url(#bg)"/>
<circle cx="1320" cy="130" r="180" fill="#55b8aa" opacity=".07"/><circle cx="95" cy="1610" r="230" fill="#709ad2" opacity=".06"/>
<g class="sans">
  <text x="84" y="78" class="teal" font-size="18" font-weight="700" letter-spacing="3">OXYGEN WX  /  DATA CONTRACT  /  06</text>
  <text x="84" y="146" class="ink" font-size="48" font-weight="700">Fixtures in. Canonical facts out.</text>
  <text x="84" y="188" class="muted" font-size="21">Preserve fixture identity and legacy meaning at a pure adapter boundary.</text>
  <rect x="1080" y="66" width="274" height="44" rx="22" class="pill"/><text x="1217" y="94" text-anchor="middle" class="teal" font-size="14" font-weight="700" letter-spacing="1">APPROVED · 2026-10-27</text>

  <rect x="72" y="230" width="1296" height="304" rx="22" class="card"/>
  <text x="106" y="275" class="teal" font-size="15" font-weight="700" letter-spacing="2">01  /  FIXTURE INPUTS</text>
  <text x="106" y="315" class="ink" font-size="24" font-weight="650">Three independent fixture families remain unchanged sources of truth.</text>
  <rect x="106" y="342" width="382" height="142" rx="15" class="inner"/>
  <text x="132" y="377" class="blue" font-size="14" font-weight="700">MAIN · NORMAL SAMPLE</text>
  <text x="132" y="411" class="ink" font-size="19">192 hours · 8 fixture dates</text>
  <text x="132" y="442" class="muted" font-size="15">Daily representative: sample hour 14</text>
  <text x="132" y="468" class="amber" font-size="14">LocalDateTime has no fixture zone</text>
  <rect x="529" y="342" width="382" height="142" rx="15" class="inner"/>
  <text x="555" y="377" class="blue" font-size="14" font-weight="700">DEBUG · CATALOG + SEQUENCES</text>
  <text x="555" y="411" class="ink" font-size="19">12 scenarios · 3 ordered sequences</text>
  <text x="555" y="442" class="muted" font-size="15">Keep IDs, names, step order, both times</text>
  <text x="555" y="468" class="amber" font-size="14">validTime ≠ sequenceTime</text>
  <rect x="952" y="342" width="382" height="142" rx="15" class="inner"/>
  <text x="978" y="377" class="blue" font-size="14" font-weight="700">DEBUG · GENERATED PROFILES</text>
  <text x="978" y="411" class="ink" font-size="19">3 independent profile generators</text>
  <text x="978" y="442" class="muted" font-size="15">RAIN_3_DAY · STORM_7_DAY</text>
  <text x="978" y="468" class="amber" font-size="14">COLD_SNOW_10_DAY · horizons 7/11/14</text>
  <text x="106" y="515" class="muted" font-size="14">Keep profile formulas, clear buffers, event ranges, and reference times; do not derive profiles from scenario rows.</text>

  <rect x="72" y="558" width="1296" height="348" rx="22" class="card"/>
  <text x="106" y="603" class="teal" font-size="15" font-weight="700" letter-spacing="2">02  /  EXPLICIT CONTEXT · STRICT LOCAL-TIME RESOLUTION</text>
  <text x="106" y="643" class="ink" font-size="23" font-weight="650">No location, timezone, dataset identity, or clock value is guessed.</text>
  <rect x="106" y="672" width="1228" height="66" rx="14" class="inner"/>
  <text x="132" y="700" class="blue mono" font-size="17">Every adapter: CatalogLocation (IANA zone) + DatasetId + asOf: Instant</text>
  <text x="132" y="725" class="muted" font-size="14">Synthetic provenance = SIMULATED + SYNTHETIC_METEOROLOGICAL_PRODUCT</text>
  <rect x="106" y="761" width="540" height="112" rx="14" class="inner"/>
  <text x="130" y="793" class="blue mono" font-size="15">getValidOffsets(localDateTime)</text>
  <text x="130" y="824" class="teal" font-size="15">Exactly 1 → convert using that offset</text>
  <text x="130" y="852" class="red" font-size="14">0 → DST gap · 2 → DST overlap · typed failure</text>
  <rect x="672" y="761" width="662" height="112" rx="14" class="inner"/>
  <text x="696" y="793" class="blue" font-size="15" font-weight="700">WHOLE OPERATION OR FAILURE</text>
  <text x="696" y="824" class="ink" font-size="15">Any required time fails → no partial catalog.</text>
  <text x="696" y="852" class="amber" font-size="14">Never shift, choose an overlap offset, or drop a time.</text>
  <text x="106" y="894" class="muted" font-size="14">Apply to normal hours/daily representatives, scenario valid times, sequence times, and profile sample/reference times.</text>

  <rect x="72" y="930" width="1296" height="226" rx="22" class="card"/>
  <text x="106" y="975" class="teal" font-size="15" font-weight="700" letter-spacing="2">03  /  ADAPTER FLOW</text>
  <text x="106" y="1015" class="ink" font-size="23" font-weight="650">Canonical facts and compatibility metadata travel as separate layers.</text>
  <rect x="106" y="1044" width="270" height="70" rx="14" class="inner"/><text x="241" y="1073" text-anchor="middle" class="blue" font-size="14" font-weight="700">EXISTING FIXTURES</text><text x="241" y="1098" text-anchor="middle" class="ink" font-size="15">main + debug source sets</text>
  <path d="M376 1079 H441" fill="none" stroke="#8ee2cf" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="456" y="1044" width="274" height="70" rx="14" class="inner"/><text x="593" y="1073" text-anchor="middle" class="blue" font-size="14" font-weight="700">PURE ADAPTERS</text><text x="593" y="1098" text-anchor="middle" class="ink" font-size="15">explicit input + typed errors</text>
  <path d="M730 1079 H795" fill="none" stroke="#8ee2cf" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="810" y="1044" width="236" height="70" rx="14" class="inner"/><text x="928" y="1073" text-anchor="middle" class="blue" font-size="14" font-weight="700">CANONICAL</text><text x="928" y="1098" text-anchor="middle" class="ink" font-size="15">catalog + weather facts</text>
  <path d="M1046 1079 H1111" fill="none" stroke="#8ee2cf" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="1126" y="1044" width="208" height="70" rx="14" class="inner"/><text x="1230" y="1073" text-anchor="middle" class="blue" font-size="14" font-weight="700">METADATA</text><text x="1230" y="1098" text-anchor="middle" class="ink" font-size="15">fixture compatibility</text>
  <text x="106" y="1140" class="amber" font-size="14">Canonical validTime uses fixture valid/sample time. Sequence time remains separate metadata; never use it as validTime.</text>

  <rect x="72" y="1180" width="1296" height="394" rx="22" class="card"/>
  <text x="106" y="1225" class="teal" font-size="15" font-weight="700" letter-spacing="2">04  /  FACTS AND COMPATIBILITY</text>
  <text x="106" y="1265" class="ink" font-size="23" font-weight="650">The shared schema stays provider-neutral; adapters retain fixture-specific detail.</text>
  <rect x="106" y="1294" width="590" height="226" rx="15" class="inner"/>
  <text x="132" y="1330" class="blue" font-size="14" font-weight="700" letter-spacing="1">CANONICAL FACTS</text>
  <text x="132" y="1368" class="ink" font-size="16">• absent remains null; explicit zero remains supplied</text>
  <text x="132" y="1401" class="ink" font-size="16">• synthetic origin and product kind are explicit</text>
  <text x="132" y="1434" class="ink" font-size="16">• validTime is an Instant from fixture valid/sample time</text>
  <text x="132" y="1467" class="ink" font-size="16">• no provider DTO, UI, or renderer types</text>
  <text x="132" y="1501" class="amber" font-size="14">Do not widen canonical facts for fixture-only fields.</text>
  <rect x="730" y="1294" width="604" height="226" rx="15" class="inner"/>
  <text x="756" y="1330" class="blue" font-size="14" font-weight="700" letter-spacing="1">ADAPTER METADATA</text>
  <text x="756" y="1368" class="ink" font-size="16">• scenario/profile/sequence IDs, names, and order</text>
  <text x="756" y="1401" class="ink" font-size="16">• sequence times and profile reference times</text>
  <text x="756" y="1434" class="ink" font-size="16">• daily date/extrema/max chance/representative</text>
  <text x="756" y="1467" class="ink" font-size="16">• unsupported legacy values and unmapped reasons</text>
  <text x="756" y="1501" class="amber" font-size="14">Warning preview and precipitation identity stay debug-only metadata.</text>
  <text x="106" y="1553" class="muted" font-size="14">Debug warning preview is never an official alert; warning state is never inserted into canonical weather facts.</text>

  <rect x="72" y="1598" width="1296" height="204" rx="22" class="card"/>
  <text x="106" y="1643" class="teal" font-size="15" font-weight="700" letter-spacing="2">05  /  LOSS-AWARE MAPPING · APPLICATION BOUNDARY</text>
  <rect x="106" y="1666" width="575" height="91" rx="14" class="inner"/>
  <text x="130" y="1699" class="blue" font-size="15" font-weight="700">RainLiquidMm</text>
  <text x="130" y="1728" class="ink" font-size="14">Retain exact value + ACCUMULATION_INTERVAL_UNAVAILABLE</text>
  <text x="130" y="1749" class="amber" font-size="13">Canonical interval rain stays null; invent no interval.</text>
  <rect x="703" y="1666" width="276" height="91" rx="14" class="inner"/>
  <text x="727" y="1699" class="blue" font-size="15" font-weight="700">SnowDepthCm</text>
  <text x="727" y="1728" class="ink" font-size="14">→ snow depth point fact</text>
  <text x="727" y="1749" class="amber" font-size="13">Never infer snowfall</text>
  <rect x="1001" y="1666" width="333" height="91" rx="14" class="inner"/>
  <text x="1025" y="1699" class="red" font-size="14" font-weight="700">NO APP DATA-PATH CHANGE</text>
  <text x="1025" y="1728" class="ink" font-size="14">No startup/source/picker wiring</text>
  <text x="1025" y="1749" class="amber" font-size="13">Debug stays debug; release isolated</text>
  <text x="84" y="1840" class="muted" font-size="14" letter-spacing="1">WX.6 ADAPTER CONTRACT BOARD  ·  OWNER-APPROVED DESIGN INPUT  ·  NOT IMPLEMENTATION OR ACCEPTANCE EVIDENCE</text>
</g>
</svg>
