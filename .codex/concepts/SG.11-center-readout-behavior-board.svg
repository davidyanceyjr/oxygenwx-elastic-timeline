<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
<title id="title">SG.11 visual behavior board</title>
<desc id="desc">A selected time and catalog evaluation branches to three phone-screen states. A supported rain condition displays weather artwork beside temperature. An eligible missing hour carries the prior supplied rainy symbol with a visible source time. An unavailable condition displays a question mark symbol. Each state keeps the location label with a small picker trigger, sun and moon event times, and high and low in the same positions. Selected day and time remain on the timeline.</desc>
<defs>
 <linearGradient id="screen" x2="0" y2="1"><stop stop-color="#6584a3"/><stop offset="1" stop-color="#193753"/></linearGradient>
 <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#7be0c9"/></marker>
 <style>.title{font:700 30px Arial;fill:#edf4f7}.subtitle{font:17px Arial;fill:#abc0cc}.label{font:700 18px Arial;fill:#edf4f7}.note{font:17px Arial;fill:#d5e8ef}.tiny{font:15px Arial;fill:#abc0cc}.white{font-family:Arial;fill:#fff}.line{fill:none;stroke:#7be0c9;stroke-width:3;marker-end:url(#arrow)}</style>
 <g id="cloud" fill="#eaf7ff" stroke="#bde6f7" stroke-width="3"><circle cx="20" cy="42" r="15"/><circle cx="45" cy="32" r="25"/><circle cx="70" cy="43" r="16"/><rect x="17" y="41" width="56" height="18" rx="9"/></g>
 <g id="rain"><use href="#cloud"/><path d="M27 69l-5 14m27-14l-5 14m27-14l-5 14" stroke="#76d9ff" stroke-width="5" stroke-linecap="round"/></g>
 <g id="unknown"><circle cx="47" cy="45" r="37" fill="#d9e9f0" opacity=".18"/><path d="M31 32c0-12 8-19 19-19 12 0 20 8 20 18 0 12-18 14-18 27" fill="none" stroke="#e8f7ff" stroke-width="8" stroke-linecap="round"/><circle cx="52" cy="74" r="5" fill="#ffd98c"/></g>
</defs>
<rect width="1600" height="1000" fill="#0b1725"/>
<text x="45" y="52" class="title">SG.11  /  WHAT THE CENTER READOUT SHOWS</text>
<text x="45" y="83" class="subtitle">Visual behavior board · owner approved 2026-11-04 with location-trigger amendment</text>

<!-- selector -->
<rect x="470" y="113" width="660" height="105" rx="24" fill="#17384a" stroke="#42687a" stroke-width="2"/>
<circle cx="533" cy="165" r="27" fill="#193e4d" stroke="#7be0c9" stroke-width="3"/>
<path d="M533 146v20l13 9" fill="none" stroke="#7be0c9" stroke-width="4" stroke-linecap="round"/>
<text x="581" y="152" class="label">SELECTED TIME + LOADED CATALOG</text>
<text x="581" y="182" class="note">Evaluate the typed condition for this instant.</text>
<path d="M800 219V248H266V286" class="line"/><path d="M800 248V286" class="line"/><path d="M800 248H1334V286" class="line"/>

<!-- state headers -->
<rect x="47" y="284" width="438" height="57" rx="14" fill="#1b493e"/>
<circle cx="82" cy="312" r="17" fill="#438d6a"/><text x="76" y="319" class="white" font-size="18" font-weight="700">A</text>
<text x="113" y="317" class="label">SUPPORTED AT SELECTED HOUR</text>
<rect x="581" y="284" width="438" height="57" rx="14" fill="#564023"/>
<circle cx="616" cy="312" r="17" fill="#c28d43"/><text x="610" y="319" class="white" font-size="18" font-weight="700">B</text>
<text x="647" y="317" class="label">ELIGIBLE PRIOR-HOUR FACT</text>
<rect x="1115" y="284" width="438" height="57" rx="14" fill="#493a50"/>
<circle cx="1150" cy="312" r="17" fill="#946d92"/><text x="1144" y="319" class="white" font-size="18" font-weight="700">C</text>
<text x="1181" y="317" class="label">NO CONDITION CLAIM</text>

<!-- three screen states -->
<g>
 <rect x="90" y="363" width="350" height="474" rx="30" fill="url(#screen)" stroke="#1b4565" stroke-width="3"/>
 <rect x="625" y="363" width="350" height="474" rx="30" fill="url(#screen)" stroke="#1b4565" stroke-width="3"/>
 <rect x="1160" y="363" width="350" height="474" rx="30" fill="url(#screen)" stroke="#1b4565" stroke-width="3"/>
 <!-- A -->
 <text x="252" y="416" text-anchor="middle" class="white" font-size="24" font-weight="700">Chicago</text>
 <g transform="translate(333 399)" fill="none" stroke="#fff" stroke-width="2"><path d="M10 1c-5 0-9 4-9 9 0 7 9 15 9 15s9-8 9-15c0-5-4-9-9-9z"/><circle cx="10" cy="10" r="3"/></g>
 <text x="199" y="558" text-anchor="middle" class="white" font-size="76" font-weight="300">33°</text>
 <use href="#rain" x="285" y="482"/>
 <text x="265" y="628" text-anchor="middle" class="white" font-size="14">SUN ↑ 6:45  ↓ 4:38</text>
 <text x="265" y="651" text-anchor="middle" class="white" font-size="14">MOON ↑ 7:12  ↓ 5:50</text>
 <text x="265" y="702" text-anchor="middle" class="white" font-size="17">HIGH 36°   /   LOW 28°</text>
 <line x1="130" y1="785" x2="400" y2="785" stroke="#e3f5ff" opacity=".6"/><line x1="265" y1="770" x2="265" y2="801" stroke="#ffe0a1" stroke-width="3"/>
 <!-- B -->
 <text x="787" y="416" text-anchor="middle" class="white" font-size="24" font-weight="700">Chicago</text>
 <g transform="translate(868 399)" fill="none" stroke="#fff" stroke-width="2"><path d="M10 1c-5 0-9 4-9 9 0 7 9 15 9 15s9-8 9-15c0-5-4-9-9-9z"/><circle cx="10" cy="10" r="3"/></g>
 <text x="734" y="558" text-anchor="middle" class="white" font-size="76" font-weight="300">33°</text>
 <use href="#rain" x="820" y="482"/>
 <rect x="647" y="588" width="306" height="48" rx="10" fill="#edb95e" opacity=".95"/>
 <text x="800" y="608" text-anchor="middle" font-family="Arial" font-size="15" font-weight="700" fill="#193753">FROM 2 PM · SELECTED HOUR</text>
 <text x="800" y="627" text-anchor="middle" font-family="Arial" font-size="15" font-weight="700" fill="#193753">UNAVAILABLE</text>
 <text x="800" y="664" text-anchor="middle" class="white" font-size="13">SUN ↑ 6:45  ↓ 4:38 · MOON ↑ 7:12  ↓ 5:50</text>
 <text x="800" y="702" text-anchor="middle" class="white" font-size="17">HIGH 36°   /   LOW 28°</text>
 <line x1="665" y1="785" x2="935" y2="785" stroke="#e3f5ff" opacity=".6"/><line x1="800" y1="770" x2="800" y2="801" stroke="#ffe0a1" stroke-width="3"/>
 <!-- C -->
 <text x="1322" y="416" text-anchor="middle" class="white" font-size="24" font-weight="700">Chicago</text>
 <g transform="translate(1403 399)" fill="none" stroke="#fff" stroke-width="2"><path d="M10 1c-5 0-9 4-9 9 0 7 9 15 9 15s9-8 9-15c0-5-4-9-9-9z"/><circle cx="10" cy="10" r="3"/></g>
 <text x="1269" y="558" text-anchor="middle" class="white" font-size="76" font-weight="300">33°</text>
 <use href="#unknown" x="1355" y="478"/>
 <text x="1335" y="613" text-anchor="middle" class="white" font-size="17">Condition unavailable</text>
 <text x="1335" y="628" text-anchor="middle" class="white" font-size="14">SUN ↑ 6:45  ↓ 4:38</text>
 <text x="1335" y="651" text-anchor="middle" class="white" font-size="14">MOON ↑ 7:12  ↓ 5:50</text>
 <text x="1335" y="702" text-anchor="middle" class="white" font-size="17">HIGH 36°   /   LOW —</text>
 <line x1="1200" y1="785" x2="1470" y2="785" stroke="#e3f5ff" opacity=".6"/><line x1="1335" y1="770" x2="1335" y2="801" stroke="#ffe0a1" stroke-width="3"/>
</g>

<!-- slim transition tags -->
<text x="266" y="869" text-anchor="middle" class="note">Selected fact → matching WA symbol</text>
<text x="800" y="869" text-anchor="middle" class="note">Interior gap → prior symbol + source time</text>
<text x="1334" y="869" text-anchor="middle" class="note">No eligible fact → WA unknown symbol</text>
<path d="M460 889H1134" stroke="#5d8591" stroke-width="2" stroke-dasharray="6 7"/>
<text x="800" y="920" text-anchor="middle" class="label">Any state can follow any other when time or catalog changes.</text>
<text x="800" y="951" text-anchor="middle" class="tiny">Location/time stay authoritative on timeline · temperature and high/low are independently nullable · condition remains accessible</text>
<text x="800" y="975" text-anchor="middle" class="tiny">Small icon by location opens existing picker; lower magnifier and gear go. Other gestures, solar/lunar times, provenance remain.</text>
</svg>
