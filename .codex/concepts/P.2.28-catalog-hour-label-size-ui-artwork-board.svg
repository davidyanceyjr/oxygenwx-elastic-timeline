<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1320" viewBox="0 0 1800 1320" role="img" aria-labelledby="title desc">
  <title id="title">P.2.28 Active-catalog hourly label target · 18 dp</title>
  <desc id="desc">Prior installed 20 dp catalog screen shown as context next to the approved 18 dp target below existing long ticks; daily mode and fixture/debug at 16 dp remain unchanged.</desc>
  <defs>
    <linearGradient id="bg" x2="0" y2="1"><stop stop-color="#101c30"/><stop offset="1" stop-color="#1b2d44"/></linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur in="SourceAlpha" stdDeviation="2"/><feOffset dy="2"/><feComponentTransfer><feFuncA type="linear" slope="0.55"/></feComponentTransfer><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <style>
      .title{font:700 34px sans-serif;fill:#f4f8fc}.sub{font:16px sans-serif;fill:#b6cadc}.panel{fill:#f5f8fb;stroke:#c9d6e1;stroke-width:2}.head{font:700 21px sans-serif;fill:#18324a}.small{font:15px sans-serif;fill:#49647b}.body{font:16px sans-serif;fill:#334e66}.axis{stroke:#67859b;stroke-width:3}.major{stroke:#25435b;stroke-width:5}.minor{stroke:#abc0cf;stroke-width:3}.target{font:700 63px Roboto,Arial,sans-serif;fill:#18324a;text-anchor:middle}.caption{font:700 16px sans-serif;fill:#0d6373}.note{fill:#e7eff5;stroke:#cfdae3;stroke-width:1}.pill{fill:#18334b}.pilltext{font:700 17px sans-serif;fill:#f5f8fb}
    </style>
    <clipPath id="screen"><rect x="68" y="226" width="410" height="842" rx="10"/></clipPath>
  </defs>
  <rect width="1800" height="1320" fill="url(#bg)"/>
  <text id="title" x="48" y="58" class="title">P.2.28 — Reduce catalog hourly labels to 18 dp</text>
  <text x="50" y="90" class="sub">OWNER-DIRECTED TARGET · FIXTURE/DEBUG RETAINS ITS ACCEPTED 16 DP LABELS</text>

  <rect x="38" y="122" width="470" height="1018" rx="18" class="panel"/>
  <text x="62" y="164" class="head">Installed context · 20 dp</text>
  <text x="62" y="194" class="small">Cycle 128 capture · current active-catalog appearance</text>
  <image href="P.2.28-active-catalog-20dp-context.png" x="68" y="226" width="410" height="842" preserveAspectRatio="none" clip-path="url(#screen)"/>
  <text x="62" y="1102" class="small">7 AM selection · the 18 dp update reduces only this label paint.</text>

  <rect x="530" y="122" width="1232" height="715" rx="18" class="panel"/>
  <text x="562" y="164" class="head">Active-catalog hourly target · 18 dp</text>
  <text x="562" y="194" class="small">Labels remain centered below the same longest ticks; 18 dp is drawn at a proportional 3.5× board scale.</text>
  <path d="M610 360 H1680" class="axis"/>
  <path d="M760 292 V378 M1110 316 V378 M1460 292 V378 M1650 292 V378" class="major"/>
  <path d="M935 342 V378 M1285 342 V378 M1535 342 V378" class="minor"/>
  <text x="760" y="462" class="target" filter="url(#shadow)">3</text>
  <text x="1110" y="462" class="target" filter="url(#shadow)">6</text>
  <text x="1460" y="462" class="target" filter="url(#shadow)">9</text>
  <text x="1650" y="462" class="target" filter="url(#shadow)">12 AM</text>
  <rect x="590" y="520" width="1110" height="2" fill="#cfdae3"/>
  <text x="562" y="572" class="small">Illustrative neighboring viewport: noon and midnight keep their explicit wording at the same 18 dp size.</text>
  <path d="M690 650 H1640" class="axis"/>
  <path d="M960 598 V668 M1380 598 V668" class="major"/>
  <text x="960" y="754" class="target">12 AM</text>
  <text x="1380" y="754" class="target">12 PM</text>

  <rect x="530" y="860" width="1232" height="280" rx="18" class="panel"/>
  <text x="562" y="904" class="head">Preserved appearance and behavior</text>
  <rect x="562" y="934" width="560" height="70" rx="14" class="note"/>
  <text x="582" y="978" class="body">Daily mode: existing layout · no hourly labels</text>
  <rect x="1140" y="934" width="590" height="70" rx="14" class="note"/>
  <text x="1160" y="978" class="body">Fixture/debug: existing 16 dp labels · no change</text>
  <text x="562" y="1050" class="body">Fixed ticks · label-to-tick attachment · 48 dp/hour · minute-precise readout · forecast facts · gestures</text>
  <text x="562" y="1090" class="body">Installed screenshots and direct scrub observations are still required for cycle 129 acceptance.</text>
  <text x="562" y="1120" class="caption">TARGET: ACTIVE-CATALOG LABEL PAINT CHANGES 20 DP → 18 DP ONLY</text>
</svg>
