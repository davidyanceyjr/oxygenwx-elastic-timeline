<text x="48" y="42" class="eyebrow">OXYGEN · SCENE GENERATION · SG.4 · DEVICE-ANCHORED CONCEPT BOARD</text>
<text x="48" y="91" class="title">Add precipitation inside the installed forecast scene.</text>
<text x="48" y="123" class="sub">Real Pixel 3 XL capture anchors the current layout; the adjacent rain and snow sketches are proposed additions.</text>

