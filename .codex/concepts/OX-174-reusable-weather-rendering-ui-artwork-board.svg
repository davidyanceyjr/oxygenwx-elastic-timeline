<svg xmlns="http://www.w3.org/2000/svg" width="1680" height="1860" viewBox="0 0 1680 1860" role="img" aria-labelledby="title desc">
  <title id="title">Cycle 174 reusable weather rendering UI artwork board</title>
  <desc id="desc">A conceptual review board showing affected First City and Minimal Open Landscape weather states for OX-07, OX-45, OX-08, OX-46, and OX-47. This is not an installed screenshot.</desc>
  <defs>
    <linearGradient id="page" x2="0" y2="1"><stop stop-color="#f6f8fb"/><stop offset="1" stop-color="#e8edf4"/></linearGradient>
    <linearGradient id="sky" x2="0" y2="1"><stop stop-color="#6f8dab"/><stop offset=".7" stop-color="#a9becd"/><stop offset="1" stop-color="#d3dedf"/></linearGradient>
    <linearGradient id="rain-sky" x2="0" y2="1"><stop stop-color="#53677c"/><stop offset=".75" stop-color="#8b9cac"/><stop offset="1" stop-color="#d1d7d9"/></linearGradient>
    <linearGradient id="ground" x2="0" y2="1"><stop stop-color="#6f8a74"/><stop offset="1" stop-color="#405c4d"/></linearGradient>
    <filter id="cloud-shadow" x="-15%" y="-25%" width="130%" height="150%"><feGaussianBlur in="SourceAlpha" stdDeviation="2"/><feOffset dy="1"/><feComponentTransfer><feFuncA type="linear" slope=".18"/></feComponentTransfer><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <symbol id="city" viewBox="0 0 240 112">
      <rect width="240" height="112" rx="9" fill="url(#sky)"/>
      <path d="M0 78h240v34H0z" fill="#26364a"/>
      <path d="M8 78V54h25v24M37 78V43h26v35M67 78V58h18v20M91 78V36h31v42M128 78V49h24v29M157 78V55h17v23M181 78V31h29v47M216 78V50h18v28" fill="#334960"/>
      <path d="M13 61h5m8 0h5M43 51h5m8 0h5m-13 10h5m8 0h5M99 44h5m9 0h5m-14 10h5m9 0h5M187 40h5m9 0h5m-14 10h5m9 0h5" stroke="#d3bd87" stroke-width="2" opacity=".72"/>
      <path d="M0 78h240" stroke="#e1d3aa" stroke-width="1.5" opacity=".45"/>
    </symbol>
    <symbol id="landscape" viewBox="0 0 240 112">
      <rect width="240" height="112" rx="9" fill="url(#sky)"/>
      <path d="M0 74q46-11 83-2t80-2q37-8 77-1v43H0z" fill="#839a8a"/>
      <path d="M0 85q42-10 93 1t87-2q29-6 60-1v29H0z" fill="url(#ground)"/>
      <g fill="#29483a"><path d="M39 84V56h5v28m-2-36-13 18h9l-8 11h24l-8-11h9L42 48z"/><path d="M184 86V52h5v34m-3-43-15 20h10l-9 13h27l-9-13h10l-15-20z"/></g>
      <path d="M0 84h240" stroke="#d7d0a8" stroke-width="1.3" opacity=".4"/>
    </symbol>
    <symbol id="clouds" viewBox="0 0 240 112">
      <g fill="#e4edf2" opacity=".88" filter="url(#cloud-shadow)">
        <path d="M20 24c0-7 5-12 12-12 2-8 9-12 17-10 7 1 11 6 12 12 8-1 14 4 14 11 0 6-5 10-12 10H32c-7 0-12-4-12-11z"/>
        <path d="M102 27c0-7 5-12 12-12 2-8 9-12 17-10 7 1 11 6 12 12 8-1 14 4 14 11 0 6-5 10-12 10h-31c-7 0-12-4-12-11z"/>
        <path d="M177 21c0-6 5-10 11-10 2-7 8-10 15-9 6 1 9 5 10 10 7-1 12 3 12 9 0 5-4 9-10 9h-28c-6 0-10-4-10-9z"/>
      </g>
    </symbol>
    <symbol id="rain" viewBox="0 0 240 112">
      <g stroke="#dce9f1" stroke-width="2.2" stroke-linecap="round" opacity=".8">
        <path d="M37 50l-8 18M63 52l-8 18M88 52l-8 18M115 53l-8 18M141 52l-8 18M165 53l-8 18M192 51l-8 18M218 52l-8 18"/>
      </g>
    </symbol>
    <symbol id="snow" viewBox="0 0 240 112">
      <g fill="#f4f7f7" opacity=".95"><circle cx="30" cy="48" r="2.5"/><circle cx="62" cy="58" r="2.3"/><circle cx="89" cy="45" r="2.6"/><circle cx="116" cy="60" r="2.2"/><circle cx="145" cy="48" r="2.5"/><circle cx="174" cy="59" r="2.2"/><circle cx="208" cy="46" r="2.6"/><circle cx="48" cy="75" r="2.1"/><circle cx="100" cy="78" r="2.3"/><circle cx="158" cy="76" r="2.2"/><circle cx="198" cy="79" r="2.1"/></g>
    </symbol>
    <symbol id="cloud-boundary" viewBox="0 0 240 112">
      <path d="M0 37H240" stroke="#cf9b3c" stroke-width="1.8" stroke-dasharray="5 4" opacity=".95"/>
    </symbol>
    <style>
      text { font-family: Inter, 'DejaVu Sans', sans-serif; fill: #1b2a3e; }
      .title { font-size: 32px; font-weight: 760; letter-spacing: .2px; }
      .subtitle { font-size: 15px; fill: #536579; }
      .rowtitle { font-size: 20px; font-weight: 740; }
      .rowcopy { font-size: 13px; fill: #40536a; }
      .paneltitle { font-size: 12px; font-weight: 720; }
      .label { font-size: 11px; fill: #536579; }
      .small { font-size: 10px; fill: #65768a; }
      .card { fill: #fbfcfe; stroke: #cdd7e3; stroke-width: 1.3; }
      .panel { fill: #f4f7fa; stroke: #d5dde7; stroke-width: 1; }
      .chip { fill: #e9f0f7; stroke: #d1dce8; stroke-width: 1; }
      .tag { font-size: 10px; font-weight: 700; fill: #536579; letter-spacing: .3px; }
    </style>
  </defs>
  <rect width="1680" height="1860" fill="url(#page)"/>
  <text x="56" y="62" class="title">CYCLE 174 · REUSABLE WEATHER RENDERING ACROSS WORLDS</text>
  <text x="58" y="92" class="subtitle">UI ARTWORK BOARD · CONCEPTUAL TARGETS FOR OWNER REVIEW · NOT INSTALLED SCREENSHOTS OR ACCEPTANCE EVIDENCE</text>

  <rect x="54" y="118" width="1572" height="118" rx="14" class="card"/>
  <text x="78" y="150" class="rowtitle">Shared visual contract</text>
  <text x="78" y="177" class="rowcopy">First City and Minimal Open Landscape keep their own scene composition while consuming the same selected-time weather decision.</text>
  <text x="78" y="198" class="rowcopy">Cloud output stays wholly inside the top 33% envelope, including movement and effects. Rain and snow may extend below it.</text>
  <rect x="1198" y="140" width="404" height="70" rx="11" fill="#fff4dc" stroke="#e6c37c"/>
  <text x="1220" y="166" class="tag">SOURCE TRUTH</text>
  <text x="1220" y="188" class="rowcopy">Chance is not rain rate · unknown is not clear</text>

  <!-- OX-07 -->
  <rect x="54" y="258" width="1572" height="218" rx="14" class="card"/>
  <text x="78" y="294" class="rowtitle">OX-07 · Extract First City clouds</text>
  <text x="78" y="322" class="rowcopy">Keep the current First City</text><text x="78" y="341" class="rowcopy">appearance for day and rain.</text>
  <text x="78" y="370" class="rowcopy">Only the drawing boundary changes:</text><text x="78" y="389" class="rowcopy">resolved cloud decision + city style</text><text x="78" y="408" class="rowcopy">through a declared cloud element.</text>
  <rect x="460" y="278" width="480" height="176" rx="11" class="panel"/>
  <text x="480" y="302" class="paneltitle">DAY · GENERAL CLOUDS · FIRST CITY</text>
  <use href="#city" x="480" y="315" width="218" height="102"/><use href="#clouds" x="480" y="315" width="218" height="102"/><use href="#cloud-boundary" x="480" y="315" width="218" height="102"/>
  <text x="720" y="348" class="label">same upper cloud layers</text><text x="720" y="367" class="label">same skyline and light</text><text x="720" y="386" class="label">renderer entry stays local</text>
  <rect x="958" y="278" width="640" height="176" rx="11" class="panel"/>
  <text x="978" y="302" class="paneltitle">SUPPORTED RAIN · CLOUDS REMAIN THE EXISTING CITY ART</text>
  <use href="#city" x="978" y="315" width="260" height="102"/><use href="#clouds" x="978" y="315" width="260" height="102"/><use href="#rain" x="978" y="315" width="260" height="102"/><use href="#cloud-boundary" x="978" y="315" width="260" height="102"/>
  <text x="1260" y="345" class="label">rain-origin behavior is OX-03 / OX-08;</text><text x="1260" y="365" class="label">OX-07 preserves the cloud output</text><text x="1260" y="385" class="label">and existing composition order.</text>

  <!-- OX-45 -->
  <rect x="54" y="492" width="1572" height="218" rx="14" class="card"/>
  <text x="78" y="528" class="rowtitle">OX-45 · Use clouds in</text><text x="78" y="552" class="rowtitle">Minimal Open Landscape</text>
  <text x="78" y="582" class="rowcopy">Reuse the extracted capability.</text><text x="78" y="601" class="rowcopy">Do not invent cloud cover.</text>
  <text x="78" y="632" class="rowcopy">Guide applies to the whole visible</text><text x="78" y="651" class="rowcopy">cloud envelope, including effects.</text>
  <rect x="460" y="512" width="520" height="176" rx="11" class="panel"/>
  <text x="480" y="536" class="paneltitle">SUPPORTED CLOUD COVER · OPEN LANDSCAPE</text>
  <use href="#landscape" x="480" y="548" width="240" height="112"/><use href="#clouds" x="480" y="548" width="240" height="112"/><use href="#cloud-boundary" x="480" y="548" width="240" height="112"/>
  <text x="744" y="578" class="label">clouds entirely above</text><text x="744" y="597" class="label">the dashed top-third guide</text><text x="744" y="625" class="label">cloud tint and shape remain</text><text x="744" y="644" class="label">scene-authored.</text>
  <rect x="998" y="512" width="600" height="176" rx="11" class="panel"/>
  <text x="1018" y="536" class="paneltitle">UNKNOWN CLOUD COVER · NO FABRICATED CLOUDS</text>
  <use href="#landscape" x="1018" y="548" width="240" height="112"/><use href="#cloud-boundary" x="1018" y="548" width="240" height="112"/>
  <text x="1282" y="581" class="label">landscape remains;</text><text x="1282" y="600" class="label">weather marks follow</text><text x="1282" y="619" class="label">only independently</text><text x="1282" y="638" class="label">supported inputs.</text>

  <!-- OX-08 -->
  <rect x="54" y="726" width="1572" height="218" rx="14" class="card"/>
  <text x="78" y="762" class="rowtitle">OX-08 · Extract rain</text><text x="78" y="786" class="rowtitle">as its own capability</text>
  <text x="78" y="816" class="rowcopy">Preserve OX-03 placement:</text><text x="78" y="835" class="rowcopy">cloud base when visible, current</text><text x="78" y="854" class="rowcopy">no-cloud origin otherwise.</text>
  <text x="78" y="883" class="rowcopy">Rain marks are illustrative.</text>
  <rect x="460" y="746" width="352" height="176" rx="11" class="panel"/>
  <text x="478" y="770" class="paneltitle">RAIN · VISIBLE CLOUDS</text>
  <use href="#city" x="478" y="782" width="220" height="104"/><use href="#clouds" x="478" y="782" width="220" height="104"/><use href="#rain" x="478" y="782" width="220" height="104"/><use href="#cloud-boundary" x="478" y="782" width="220" height="104"/>
  <text x="710" y="819" class="label">streaks begin</text><text x="710" y="838" class="label">at cloud base</text>
  <rect x="828" y="746" width="352" height="176" rx="11" class="panel"/>
  <text x="846" y="770" class="paneltitle">RAIN · NO VISIBLE CLOUD</text>
  <use href="#city" x="846" y="782" width="220" height="104"/><use href="#rain" x="846" y="782" width="220" height="104"/>
  <text x="1078" y="817" class="label">existing rain-field</text><text x="1078" y="836" class="label">origin stays in place</text>
  <rect x="1196" y="746" width="402" height="176" rx="11" class="panel"/>
  <text x="1214" y="770" class="paneltitle">DRY · NO RAIN MARKS</text>
  <use href="#city" x="1214" y="782" width="220" height="104"/><use href="#clouds" x="1214" y="782" width="220" height="104"/><use href="#cloud-boundary" x="1214" y="782" width="220" height="104"/>
  <text x="1446" y="817" class="label">selected-time</text><text x="1446" y="836" class="label">reading stays exact</text>

  <!-- OX-46 -->
  <rect x="54" y="960" width="1572" height="218" rx="14" class="card"/>
  <text x="78" y="996" class="rowtitle">OX-46 · Extract snow</text><text x="78" y="1020" class="rowtitle">as a compatible capability</text>
  <text x="78" y="1050" class="rowcopy">Snow stays separate from rain.</text><text x="78" y="1069" class="rowcopy">Reuse only interfaces already</text><text x="78" y="1088" class="rowcopy">evidenced by OX-08.</text>
  <text x="78" y="1117" class="rowcopy">No generalized particle runtime.</text>
  <rect x="460" y="980" width="520" height="176" rx="11" class="panel"/>
  <text x="480" y="1004" class="paneltitle">SUPPORTED SNOW · FIRST CITY</text>
  <use href="#city" x="480" y="1016" width="240" height="112"/><use href="#clouds" x="480" y="1016" width="240" height="112"/><use href="#snow" x="480" y="1016" width="240" height="112"/><use href="#cloud-boundary" x="480" y="1016" width="240" height="112"/>
  <text x="744" y="1053" class="label">snow state comes from</text><text x="744" y="1072" class="label">the shared decision;</text><text x="744" y="1100" class="label">flakes remain illustrative.</text>
  <rect x="998" y="980" width="600" height="176" rx="11" class="panel"/>
  <text x="1018" y="1004" class="paneltitle">NO SNOW · PRESERVE ESSENTIAL FORECAST FACTS</text>
  <use href="#city" x="1018" y="1016" width="240" height="112"/><use href="#clouds" x="1018" y="1016" width="240" height="112"/><use href="#cloud-boundary" x="1018" y="1016" width="240" height="112"/>
  <text x="1282" y="1053" class="label">no snow marks;</text><text x="1282" y="1072" class="label">no layout or reading</text><text x="1282" y="1091" class="label">change is proposed.</text>

  <!-- OX-47 -->
  <rect x="54" y="1194" width="1572" height="586" rx="14" class="card"/>
  <text x="78" y="1230" class="rowtitle">OX-47 · Depth across both worlds</text>
  <text x="78" y="1258" class="rowcopy">Review each state in both scenes.</text>
  <text x="78" y="1278" class="rowcopy">Keep each world’s existing</text><text x="78" y="1298" class="rowcopy">composition and exact selected time.</text>
  <text x="78" y="1332" class="rowcopy">City: retain approved depth/order.</text><text x="78" y="1352" class="rowcopy">Open landscape: clouds → terrain</text><text x="78" y="1372" class="rowcopy">→ trees → precipitation.</text>
  <text x="78" y="1414" class="rowcopy">Unknown condition draws no</text><text x="78" y="1434" class="rowcopy">condition-derived rain/snow.</text>
  <text x="78" y="1454" class="rowcopy">Independent cloud cover may remain.</text>

  <text x="468" y="1230" class="tag">FIRST CITY · EXISTING CITY COMPOSITION</text>
  <text x="468" y="1486" class="tag">MINIMAL OPEN LANDSCAPE · SCENE-LOCAL PLACEMENT</text>
  <!-- City row: rain, snow, dry, unavailable -->
  <g>
    <rect x="460" y="1244" width="276" height="218" rx="10" class="panel"/><text x="476" y="1267" class="paneltitle">SUPPLIED RAIN</text><use href="#city" x="476" y="1278" width="244" height="116"/><use href="#clouds" x="476" y="1278" width="244" height="116"/><use href="#rain" x="476" y="1278" width="244" height="116"/><use href="#cloud-boundary" x="476" y="1278" width="244" height="116"/><text x="476" y="1420" class="small">cloud base when visible</text>
    <rect x="748" y="1244" width="276" height="218" rx="10" class="panel"/><text x="764" y="1267" class="paneltitle">SUPPLIED SNOW</text><use href="#city" x="764" y="1278" width="244" height="116"/><use href="#clouds" x="764" y="1278" width="244" height="116"/><use href="#snow" x="764" y="1278" width="244" height="116"/><use href="#cloud-boundary" x="764" y="1278" width="244" height="116"/><text x="764" y="1420" class="small">separate snow capability</text>
    <rect x="1036" y="1244" width="276" height="218" rx="10" class="panel"/><text x="1052" y="1267" class="paneltitle">SUPPORTED DRY</text><use href="#city" x="1052" y="1278" width="244" height="116"/><use href="#clouds" x="1052" y="1278" width="244" height="116"/><use href="#cloud-boundary" x="1052" y="1278" width="244" height="116"/><text x="1052" y="1420" class="small">no rain or snow marks</text>
    <rect x="1324" y="1244" width="276" height="218" rx="10" class="panel"/><text x="1340" y="1267" class="paneltitle">UNAVAILABLE CONDITION</text><use href="#city" x="1340" y="1278" width="244" height="116"/><use href="#clouds" x="1340" y="1278" width="244" height="116"/><use href="#cloud-boundary" x="1340" y="1278" width="244" height="116"/><text x="1340" y="1420" class="small">independent cloud evidence only</text>
  </g>
  <!-- Open landscape row: rain, snow, dry, unavailable -->
  <g>
    <rect x="460" y="1500" width="276" height="218" rx="10" class="panel"/><text x="476" y="1523" class="paneltitle">SUPPLIED RAIN</text><use href="#landscape" x="476" y="1534" width="244" height="116"/><use href="#clouds" x="476" y="1534" width="244" height="116"/><use href="#rain" x="476" y="1534" width="244" height="116"/><use href="#cloud-boundary" x="476" y="1534" width="244" height="116"/><text x="476" y="1676" class="small">cloud → terrain → trees → rain</text>
    <rect x="748" y="1500" width="276" height="218" rx="10" class="panel"/><text x="764" y="1523" class="paneltitle">SUPPLIED SNOW</text><use href="#landscape" x="764" y="1534" width="244" height="116"/><use href="#clouds" x="764" y="1534" width="244" height="116"/><use href="#snow" x="764" y="1534" width="244" height="116"/><use href="#cloud-boundary" x="764" y="1534" width="244" height="116"/><text x="764" y="1676" class="small">scene-local snow placement</text>
    <rect x="1036" y="1500" width="276" height="218" rx="10" class="panel"/><text x="1052" y="1523" class="paneltitle">SUPPORTED DRY</text><use href="#landscape" x="1052" y="1534" width="244" height="116"/><use href="#clouds" x="1052" y="1534" width="244" height="116"/><use href="#cloud-boundary" x="1052" y="1534" width="244" height="116"/><text x="1052" y="1676" class="small">no rain or snow marks</text>
    <rect x="1324" y="1500" width="276" height="218" rx="10" class="panel"/><text x="1340" y="1523" class="paneltitle">UNAVAILABLE CONDITION</text><use href="#landscape" x="1340" y="1534" width="244" height="116"/><use href="#clouds" x="1340" y="1534" width="244" height="116"/><use href="#cloud-boundary" x="1340" y="1534" width="244" height="116"/><text x="1340" y="1676" class="small">no condition-derived marks</text>
  </g>
  <rect x="460" y="1730" width="1140" height="34" rx="8" fill="#f3eefe" stroke="#d4c5ec"/>
  <text x="476" y="1752" class="label">In all states: no Park layers, no weather inference, no value or selected-time change; visible facts remain on the existing forecast path.</text>

  <text x="58" y="1822" class="small">Conceptual artwork only · It guides visual scope and review. Installed captures and scoped interactions remain required by each slice exit.</text>
</svg>
