<svg xmlns="http://www.w3.org/2000/svg" width="760" height="600" viewBox="0 0 760 600">
  <defs>
    <filter id="wornPigment" x="-10%" y="-10%" width="120%" height="120%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.055" numOctaves="2" seed="11" result="grain"/>
      <feDisplacementMap in="SourceGraphic" in2="grain" scale="3.6" xChannelSelector="R" yChannelSelector="G" result="roughEdges"/>
      <feComponentTransfer in="roughEdges">
        <feFuncA type="linear" slope="0.92" intercept="-0.025"/>
      </feComponentTransfer>
    </filter>
  </defs>
  <g filter="url(#wornPigment)" opacity="0.9" fill="#f0e7cb" stroke="#f0e7cb" stroke-linejoin="round" stroke-linecap="round">
    <!-- Oversized painted temperature with an illustrated weather symbol at its right edge. -->
    <text x="28" y="330" font-family="sans-serif" font-size="330" font-weight="700" stroke-width="3">49°</text>
    <g transform="translate(600 210) scale(0.9)" stroke-width="5">
      <path d="M-76,24 C-92,-9 -68,-43 -34,-41 C-23,-78 30,-84 52,-48 C89,-57 116,-24 104,9 C139,22 129,58 94,62 L-48,62 C-70,62 -84,46 -76,24 Z" stroke="#70d5e4" stroke-width="5"/>
      <path d="M-41,79 L-57,120 M0,79 L-16,120 M41,79 L25,120" fill="none" stroke="#70d5e4" stroke-width="12"/>
    </g>
    <!-- Large hand-painted condition lettering sits below the temperature-and-icon hero. -->
    <text x="70" y="550" font-family="Bungasai" font-size="150" font-weight="700" letter-spacing="-2" stroke-width="2.6">DRIZZLE</text>
  </g>
</svg>
