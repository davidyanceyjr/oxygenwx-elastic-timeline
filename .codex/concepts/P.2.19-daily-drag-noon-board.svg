<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1920" height="1080" viewBox="0 0 1920 1080">
  <defs>
    <linearGradient id="background" x2="0" y2="1"><stop stop-color="#101b2c"/><stop offset="1" stop-color="#1d324a"/></linearGradient>
    <linearGradient id="tape" x2="0" y2="1"><stop stop-color="#152c43"/><stop offset="1" stop-color="#071729"/></linearGradient>
    <clipPath id="beforeCrop"><rect x="60" y="229" width="840" height="350" rx="14"/></clipPath>
    <symbol id="sunIcon" viewBox="0 0 40 40"><g fill="none" stroke="#ffe1a0" stroke-width="3" stroke-linecap="round"><circle cx="20" cy="20" r="8"/><path d="M20 2v6M20 32v6M2 20h6M32 20h6M7 7l5 5M28 28l5 5M33 7l-5 5M12 28l-5 5"/></g></symbol>
    <symbol id="cloudIcon" viewBox="0 0 40 40"><path d="M9 28h22c6 0 8-9 1-12-2-1-4-1-6 0-3-9-15-9-18-1-9-1-10 13 1 13Z" fill="none" stroke="#e7f1f6" stroke-width="3" stroke-linejoin="round"/></symbol>
    <style>
      .title{font:700 36px sans-serif;fill:#f5f8fc}.subtitle{font:400 19px sans-serif;fill:#bfccdc}.heading{font:700 25px sans-serif;fill:#f5f8fc}.small{font:400 18px sans-serif;fill:#bacbda}.day{font:500 31px sans-serif;fill:#d8e5ef}.selectedDay{font:700 43px sans-serif;fill:#fff}.flow{font:700 23px sans-serif;fill:#f6f8fc}.detail{font:400 18px sans-serif;fill:#c9d7e3}
    </style>
  </defs>
  <rect width="1920" height="1080" fill="url(#background)"/>
  <text x="60" y="66" class="title">P.2.19 · Daily drag release selects the target date’s noon</text>
  <text x="60" y="102" class="subtitle">Separate follow-up to the observed cycle 111 daily-drag discrepancy · behavior and UI artwork draft · OWNER REVIEW PENDING</text>
  <text x="60" y="186" class="heading">BEFORE · installed Pixel, observed daily drag result</text>
  <text x="1020" y="186" class="heading">OUTPUT CONCEPT · same target date, noon selected</text>

  <g clip-path="url(#beforeCrop)">
    <image x="60" y="-1230" width="840" height="1727" preserveAspectRatio="none" xlink:href="P.2.19-daily-drag-before.png"/>
  </g>
  <rect x="60" y="229" width="840" height="350" rx="14" fill="none" stroke="#6f87a1" stroke-width="2"/>
  <text x="60" y="615" class="small">Recorded after FRI 5:37 AM → SAT; time badge remained 11:39 PM.</text>

  <rect x="1020" y="229" width="840" height="350" rx="14" fill="url(#tape)" stroke="#6f87a1" stroke-width="2"/>
  <text x="1104" y="316" text-anchor="middle" class="day">WED</text>
  <text x="1216" y="316" text-anchor="middle" class="day">THU</text>
  <text x="1328" y="316" text-anchor="middle" class="day">FRI</text>
  <text x="1440" y="316" text-anchor="middle" class="selectedDay">SAT</text>
  <text x="1552" y="316" text-anchor="middle" class="day">SUN</text>
  <text x="1664" y="316" text-anchor="middle" class="day">MON</text>
  <text x="1776" y="316" text-anchor="middle" class="day">TUE</text>
  <g stroke="#aec5d7" stroke-width="2"><path d="M1020 488H1860" opacity=".35"/><path d="M1160 344v27M1272 344v27M1384 344v27M1496 344v27M1608 344v27M1720 344v27M1832 344v27" opacity=".45"/></g>
  <use xlink:href="#cloudIcon" x="1084" y="386" width="40" height="40"/><use xlink:href="#sunIcon" x="1196" y="386" width="40" height="40"/><use xlink:href="#sunIcon" x="1308" y="386" width="40" height="40"/><use xlink:href="#cloudIcon" x="1420" y="386" width="40" height="40"/><use xlink:href="#cloudIcon" x="1532" y="386" width="40" height="40"/><use xlink:href="#sunIcon" x="1644" y="386" width="40" height="40"/><use xlink:href="#cloudIcon" x="1756" y="386" width="40" height="40"/>
  <g stroke="#f8dca1" stroke-width="4"><path d="M1440 460v56"/></g><circle cx="1440" cy="488" r="8" fill="#f8dca1"/>
  <rect x="1360" y="529" width="160" height="42" rx="21" fill="#253b4f"/>
  <text x="1440" y="558" text-anchor="middle" font-family="sans-serif" font-size="25" font-weight="700" fill="#ffe7b4">12:00 PM</text>
  <text x="1020" y="615" class="small">Artwork shows tape alignment and selected-time badge; forecast facts update from the selected noon.</text>

  <text x="60" y="696" class="heading">BEHAVIOR CONTRACT</text>
  <rect x="60" y="725" width="420" height="175" rx="15" fill="#263d53" stroke="#6e89a0"/>
  <text x="88" y="768" class="flow">1 · Drag daily tape</text>
  <text x="88" y="805" class="detail">Browse immediately at daily scale.</text>
  <text x="88" y="835" class="detail">The moving date stays under the</text>
  <text x="88" y="865" class="detail">fixed center playhead.</text>
  <path d="M492 811h62" stroke="#ffe2a7" stroke-width="4"/>
  <rect x="570" y="725" width="420" height="175" rx="15" fill="#263d53" stroke="#6e89a0"/>
  <text x="598" y="768" class="flow">2 · Release on date</text>
  <text x="598" y="805" class="detail">Resolve the date under the playhead</text>
  <text x="598" y="835" class="detail">in the location’s IANA timezone.</text>
  <text x="598" y="865" class="detail">Do not use touch-down as selection.</text>
  <path d="M1002 811h62" stroke="#ffe2a7" stroke-width="4"/>
  <rect x="1080" y="725" width="780" height="175" rx="15" fill="#304960" stroke="#f5d79d" stroke-width="2"/>
  <text x="1110" y="768" class="flow">3 · Select 12:00 local on that date</text>
  <text x="1110" y="805" class="detail">Project the target noon to the center playhead and update the forecast facts.</text>
  <text x="1110" y="835" class="detail">If noon lies outside a partial boundary, clamp to the nearest catalog limit</text>
  <text x="1110" y="865" class="detail">and communicate the adjustment. An in-window missing date stays selectable.</text>

  <text x="60" y="961" class="heading">PRESERVE</text>
  <text x="235" y="961" class="detail">Hourly scrubbing · timeline double-tap scale toggle · no-op single tap · main-area gestures · date icons and labels · selected-time authority</text>
  <text x="60" y="1028" class="small">Input crop is an actual installed screenshot. Output and flow are proposed artwork and behavior, not installed post-change evidence.</text>
</svg>
