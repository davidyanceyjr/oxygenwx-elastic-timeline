<!-- Contract strip -->
<rect x="48" y="858" width="1108" height="184" rx="18" class="panel"/>
<text x="72" y="892" class="eye">BEHAVIOR GATES</text>
<text x="72" y="925" class="h" font-size="15">1 · Period defines event editing</text><text x="72" y="948" class="small">Full D−30…D+13 window; baseline remains outside authored period.</text>
<text x="72" y="986" class="h" font-size="15">2 · Save does not activate</text><text x="72" y="1009" class="small">Explicit Preview uses a saved, revalidated SIMULATED or REPLAY record.</text>
<text x="624" y="925" class="h" font-size="15">3 · Type and source remain honest</text><text x="624" y="948" class="small">Missing ≠ zero · chance ≠ amount · unsupported stays absent.</text>
<text x="624" y="986" class="h" font-size="15">4 · Preserve existing boundaries</text><text x="624" y="1009" class="small">No LIVE/provider/cache/location mutation; debug exit restores the exact checkpoint.</text>

<rect x="1180" y="858" width="692" height="184" rx="18" class="panel"/>
<text x="1204" y="892" class="eye">FAIL-CLOSED · ALTERNATE STATE</text>
<rect x="1204" y="908" width="644" height="112" rx="13" class="amber"/>
<text x="1224" y="938" class="h" font-size="16">Can't preview this saved catalog</text>
<text x="1224" y="964" class="body" font-size="13">The saved record is missing, invalid, or changed. Your current forecast</text>
<text x="1224" y="984" class="body" font-size="13">and selected time are unchanged. Return to the catalog and choose another item.</text>
