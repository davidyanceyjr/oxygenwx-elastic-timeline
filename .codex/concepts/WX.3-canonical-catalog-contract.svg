<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1920" viewBox="0 0 1440 1920" role="img" aria-labelledby="title desc">
<title id="title">WX.3 — Canonical catalog contract</title>
<desc id="desc">Annotated contract board showing provider-neutral catalog identity, time semantics, provenance, nullable weather facts, canonical ranges, and live/simulated/replay schema parity.</desc>
<defs>
  <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L7,3 z" fill="#8ee2cf"/></marker>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#101d2b"/><stop offset="1" stop-color="#182d3c"/></linearGradient>
  <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#71d6c2"/><stop offset="1" stop-color="#8ebeff"/></linearGradient>
  <style>
    .sans{font-family:Inter,Roboto,"Arial",sans-serif}.mono{font-family:"Roboto Mono",monospace}
    .ink{fill:#f3f5f2}.muted{fill:#a8bac4}.teal{fill:#8ee2cf}.blue{fill:#a6caff}.amber{fill:#f1c477}
    .card{fill:#1e3443;stroke:#355263;stroke-width:1.5}.inner{fill:#162a38;stroke:#304b5c;stroke-width:1}
    .rule{stroke:#3b5969;stroke-width:1}.pill{fill:#294555;stroke:#496878;stroke-width:1}
  </style>
</defs>
<rect width="1440" height="1920" fill="url(#bg)"/>
<circle cx="1320" cy="130" r="180" fill="#55b8aa" opacity=".07"/><circle cx="95" cy="1650" r="230" fill="#709ad2" opacity=".06"/>
<g class="sans">
  <text x="84" y="83" class="teal" font-size="18" font-weight="700" letter-spacing="3">OXYGEN WX  /  DATA CONTRACT  /  03</text>
  <text x="84" y="151" class="ink" font-size="49" font-weight="700">One catalog. Honest facts.</text>
  <text x="84" y="194" class="muted" font-size="21">Provider-neutral identity, time, provenance, and nullable weather values.</text>
  <rect x="1110" y="70" width="244" height="42" rx="21" class="pill"/><text x="1232" y="97" text-anchor="middle" class="teal" font-size="14" font-weight="700" letter-spacing="1">APPROVED · 2026-10-27</text>

  <!-- envelope -->
  <rect x="72" y="236" width="1296" height="296" rx="22" class="card"/>
  <text x="106" y="282" class="teal" font-size="15" font-weight="700" letter-spacing="2">01  /  CATALOG ENVELOPE</text>
  <text x="106" y="322" class="ink" font-size="25" font-weight="650">A stable place and snapshot frame every fact.</text>
  <rect x="106" y="351" width="354" height="142" rx="15" class="inner"/>
  <text x="130" y="384" class="blue" font-size="14" font-weight="700" letter-spacing="1">LOCATION IDENTITY</text>
  <text x="130" y="419" class="ink mono" font-size="18">locationId: "loc_…"</text>
  <text x="130" y="451" class="muted" font-size="16">app-assigned · stable · opaque</text>
  <text x="130" y="478" class="muted" font-size="16">latitude / longitude · degrees</text>
  <rect x="480" y="351" width="354" height="142" rx="15" class="inner"/>
  <text x="504" y="384" class="blue" font-size="14" font-weight="700" letter-spacing="1">LOCAL TIME CONTEXT</text>
  <text x="504" y="419" class="ink mono" font-size="18">zoneId: America/Chicago</text>
  <text x="504" y="451" class="muted" font-size="16">IANA ZoneId · labels derive here</text>
  <text x="504" y="478" class="muted" font-size="16">validTime is always an Instant</text>
  <rect x="854" y="351" width="480" height="142" rx="15" class="inner"/>
  <text x="878" y="384" class="blue" font-size="14" font-weight="700" letter-spacing="1">SNAPSHOT IDENTITY</text>
  <text x="878" y="419" class="ink mono" font-size="18">datasetId: "set_…"  ·  asOf: Instant</text>
  <text x="878" y="451" class="muted" font-size="16">asOf = assembled / recorded time</text>
  <text x="878" y="478" class="muted" font-size="16">issuedAt is separate, when supplied</text>

  <!-- time -->
  <rect x="72" y="556" width="1296" height="205" rx="22" class="card"/>
  <text x="106" y="602" class="teal" font-size="15" font-weight="700" letter-spacing="2">02  /  TIME SUPPORT</text>
  <text x="106" y="643" class="ink" font-size="24" font-weight="650">Every fact says when it applies; accumulation says which interval it covers.</text>
  <line x1="159" y1="702" x2="1281" y2="702" stroke="url(#accent)" stroke-width="4"/>
  <circle cx="228" cy="702" r="10" fill="#8ee2cf"/><circle cx="720" cy="702" r="10" fill="#a6caff"/><circle cx="1196" cy="702" r="10" fill="#f1c477"/>
  <text x="228" y="687" text-anchor="middle" class="ink mono" font-size="17">validTime: Instant</text>
  <text x="720" y="687" text-anchor="middle" class="ink mono" font-size="17">[start, end)</text>
  <text x="1196" y="687" text-anchor="middle" class="ink mono" font-size="17">end = validTime</text>
  <text x="228" y="738" text-anchor="middle" class="muted" font-size="15">point facts apply here</text>
  <text x="720" y="738" text-anchor="middle" class="muted" font-size="15">only accumulated quantities</text>
  <text x="1196" y="738" text-anchor="middle" class="muted" font-size="15">half-open accumulation interval</text>

  <!-- provenance -->
  <rect x="72" y="785" width="1296" height="224" rx="22" class="card"/>
  <text x="106" y="831" class="teal" font-size="15" font-weight="700" letter-spacing="2">03  /  PROVENANCE HAS TWO AXES</text>
  <text x="106" y="870" class="ink" font-size="24" font-weight="650">Delivery origin does not decide what kind of weather product this is.</text>
  <rect x="106" y="894" width="470" height="82" rx="14" class="inner"/>
  <text x="130" y="923" class="blue" font-size="13" font-weight="700" letter-spacing="1">ORIGIN</text>
  <text x="130" y="955" class="ink" font-size="19">LIVE  ·  SIMULATED  ·  REPLAY</text>
  <text x="608" y="947" class="teal" font-size="27" font-weight="600">+</text>
  <rect x="665" y="894" width="669" height="90" rx="14" class="inner"/>
  <text x="689" y="923" class="blue" font-size="13" font-weight="700" letter-spacing="1">PRODUCT KIND</text>
  <text x="689" y="953" class="ink" font-size="17">FORECAST · ARCHIVED MODEL · REANALYSIS</text>
  <text x="689" y="974" class="muted" font-size="15">ACTUAL OBSERVATION · SYNTHETIC METEOROLOGICAL</text>
  <text x="106" y="1005" class="amber" font-size="14">Past valid time does not turn a model forecast into an observation. Reanalysis is not an in-situ observation.</text>

  <!-- facts -->
  <rect x="72" y="1033" width="1296" height="500" rx="22" class="card"/>
  <text x="106" y="1079" class="teal" font-size="15" font-weight="700" letter-spacing="2">04  /  COMPOSABLE, NULLABLE FACTS</text>
  <text x="106" y="1118" class="ink" font-size="24" font-weight="650">Facts stay independent. Absent is unknown; zero is a supplied value.</text>
  <rect x="106" y="1143" width="1228" height="44" rx="8" fill="#294555"/>
  <text x="130" y="1171" class="blue" font-size="14" font-weight="700">FACT</text><text x="545" y="1171" class="blue" font-size="14" font-weight="700">CANONICAL UNIT</text><text x="850" y="1171" class="blue" font-size="14" font-weight="700">ACCEPTED RANGE</text><text x="1165" y="1171" class="blue" font-size="14" font-weight="700">MISSING</text>
  <g font-size="15" class="ink">
   <text x="130" y="1211">Temperature</text><text x="545" y="1211">°C</text><text x="850" y="1211">−100 … 70</text><text x="1165" y="1211" class="muted">null</text>
   <text x="130" y="1245">Precipitation / thunder probability</text><text x="545" y="1245">percent, separate facts</text><text x="850" y="1245">0 … 100</text><text x="1165" y="1245" class="muted">null</text>
   <text x="130" y="1279">Rain / total precipitation</text><text x="545" y="1279">mm per explicit interval</text><text x="850" y="1279">0 … 2000 each</text><text x="1165" y="1279" class="muted">null</text>
   <text x="130" y="1313">Precipitation rate</text><text x="545" y="1313">mm/hour</text><text x="850" y="1313">0 … 500</text><text x="1165" y="1313" class="muted">null</text>
   <text x="130" y="1347">Snowfall / snow depth</text><text x="545" y="1347">cm per interval / cm point</text><text x="850" y="1347">0 … 500 / 0 … 2000</text><text x="1165" y="1347" class="muted">null</text>
   <text x="130" y="1381">Wind / gust · direction</text><text x="545" y="1381">km/h · degrees from north</text><text x="850" y="1381">0 … 500 · 0 ≤ x &lt; 360</text><text x="1165" y="1381" class="muted">null</text>
   <text x="130" y="1415">Surface / sea-level pressure</text><text x="545" y="1415">hPa, distinct fields</text><text x="850" y="1415">100 … 1200 / 800 … 1100</text><text x="1165" y="1415" class="muted">null</text>
   <text x="130" y="1449">Humidity / cloud / visibility</text><text x="545" y="1449">percent / percent / km</text><text x="850" y="1449">0 … 100 / 0 … 100 / 0 … 500</text><text x="1165" y="1449" class="muted">null</text>
  </g>
  <line x1="106" y1="1224" x2="1334" y2="1224" class="rule"/><line x1="106" y1="1258" x2="1334" y2="1258" class="rule"/><line x1="106" y1="1292" x2="1334" y2="1292" class="rule"/><line x1="106" y1="1326" x2="1334" y2="1326" class="rule"/><line x1="106" y1="1360" x2="1334" y2="1360" class="rule"/><line x1="106" y1="1394" x2="1334" y2="1394" class="rule"/><line x1="106" y1="1428" x2="1334" y2="1428" class="rule"/><line x1="106" y1="1462" x2="1334" y2="1462" class="rule"/>
  <text x="106" y="1500" class="amber" font-size="15">Clear · partly cloudy · cloudy · rain · snow · storm. Severe inputs only when sourced; never infer alerts.</text>

  <!-- parity and guardrails -->
  <rect x="72" y="1562" width="1296" height="218" rx="22" class="card"/>
  <text x="106" y="1608" class="teal" font-size="15" font-weight="700" letter-spacing="2">05  /  SHARED SHAPE, CLEAR BOUNDARY</text>
  <text x="106" y="1648" class="ink" font-size="24" font-weight="650">Same envelope for every origin. No provider DTOs or demo-only fields.</text>
  <rect x="106" y="1670" width="1228" height="53" rx="15" class="inner"/>
  <rect x="125" y="1680" width="250" height="34" rx="17" class="pill"/><text x="250" y="1703" text-anchor="middle" class="ink" font-size="15">LIVE</text>
  <rect x="405" y="1680" width="250" height="34" rx="17" class="pill"/><text x="530" y="1703" text-anchor="middle" class="ink" font-size="15">SIMULATED</text>
  <rect x="685" y="1680" width="250" height="34" rx="17" class="pill"/><text x="810" y="1703" text-anchor="middle" class="ink" font-size="15">REPLAY</text>
  <path d="M375 1714 V1725 H985 M655 1714 V1725 M935 1714 V1725 M985 1725 H1020" fill="none" stroke="#8ee2cf" stroke-width="2" marker-end="url(#arrow)"/><text x="1040" y="1703" class="teal" font-size="16">SAME CATALOG SHAPE</text>
  <text x="106" y="1757" class="muted" font-size="16">Weather conditions may say storm or snow. They never create alerts or unsupported measurements.</text>
  <text x="84" y="1855" class="muted" font-size="14" letter-spacing="1">WX.3 CONTRACT BOARD  ·  DESIGN INPUT ONLY  ·  NOT IMPLEMENTATION OR ACCEPTANCE EVIDENCE</text>
</g>
</svg>
