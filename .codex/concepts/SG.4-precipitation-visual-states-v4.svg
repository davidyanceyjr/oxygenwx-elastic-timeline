ll="#fff" font-family="DejaVu Sans" font-size="18" font-weight="700">RAIN</text><text x="64" y="764" class="small">Overcast from edge to edge; rain below cloud base.</text><rect x="566" y="256" width="468" height="480" rx="18" fill="none" stroke="#8aa4b1" stroke-width="3"/><rect x="580" y="272" width="174" height="54" rx="10" fill="#183d5a"/><text x="594" y="306" fill="#fff" font-family="DejaVu Sans" font-size="18" font-weight="700">LIGHT RAIN</text><text x="572" y="764" class="small">Open sky between clouds; rain below those clouds.</text><rect x="1074" y="256" width="468" height="480" rx="18" fill="none" stroke="#8aa4b1" stroke-width="3"/><rect x="1088" y="272" width="174" height="54" rx="10" fill="#183d5a"/><text x="1102" y="306" fill="#fff" font-family="DejaVu Sans" font-size="18" font-weight="700">SNOW</text><text x="1080" y="764" class="small">Cloud bank above all falling snow; no exposed moon.</text><rect x="40" y="813" width="1520" height="170" rx="22" fill="#fff" stroke="#c9d9e0" stroke-width="2"/><text x="64" y="854" class="lab">SCENE RULE</text><text x="64" y="895" class="body">No precipitation mark appears in cloud-free sky or above its source cloud. Text and selected time stay readable above the art.</text><text x="64" y="930" class="body">A carried hour keeps the prior supplied scene and its source time; it does not create a new weather fact.</text><text x="1536" y="1020" text-anchor="end" class="small">Revision v4 · owner approval pending · concept, not installed evidence</text></svg>