<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="940" viewBox="0 0 1500 940" role="img" aria-labelledby="title desc">
  <title id="title">P.2.22 location-aware timeline double-tap behavior</title>
  <desc id="desc">A behavior flow showing daily double-tap selecting the touched date at 7 AM local time, wrapping an out-of-catalog target to the first in-catalog 7 AM entry, and hourly double-tap returning to daily without changing the exact selected time.</desc>
  <defs>
    <linearGradient id="bg" x2="0" y2="1"><stop stop-color="#0b1929"/><stop offset="1" stop-color="#1a2c40"/></linearGradient>
    <style>
      .title{font:700 30px system-ui;fill:#eff5fa}.sub{font:16px system-ui;fill:#aebfcd}.heading{font:700 20px system-ui;fill:#f4f8fb}.body{font:16px system-ui;fill:#dce6ed}.small{font:14px system-ui;fill:#aec0ce}.panel{fill:#13263a;stroke:#506980;stroke-width:2}.state{fill:#17334a;stroke:#7dbbd0;stroke-width:2}.target{fill:#263e55;stroke:#f2cd77;stroke-width:3}.arrow{stroke:#75c8df;stroke-width:4;fill:none;marker-end:url(#arrow)}.rail{stroke:#9cb0c0;stroke-width:3}.tick{stroke:#758da1;stroke-width:2}.play{stroke:#f4d17b;stroke-width:4}.badge{fill:#30465d}.pill{fill:#324b61}
    </style>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#75c8df"/></marker>
  </defs>
  <rect width="1500" height="940" fill="url(#bg)"/>
  <text x="52" y="58" class="title">P.2.22 · Location-aware timeline double-tap</text>
  <text x="52" y="88" class="sub">Behavior board · owner-approved entry and carousel rule · 2026-11-06</text>

  <rect x="48" y="126" width="430" height="410" rx="20" class="panel"/>
  <rect x="535" y="126" width="430" height="410" rx="20" class="panel"/>
  <rect x="1022" y="126" width="430" height="410" rx="20" class="panel"/>
  <text x="76" y="166" class="heading">1 · DAILY, MONDAY SELECTED</text>
  <text x="562" y="166" class="heading">2 · RESOLVE TO LOCAL DATE</text>
  <text x="1049" y="166" class="heading">3 · HOURLY, WEDNESDAY</text>

  <text x="78" y="208" class="small">Monday at 7 AM is under the center playhead.</text>
  <line x1="82" y1="315" x2="444" y2="315" class="rail"/>
  <g class="tick"><path d="M111 305v20M183 301v28M255 305v20M327 301v28M399 305v20"/></g>
  <text x="87" y="277" class="body">MON</text><text x="159" y="277" class="body">TUE</text><text x="231" y="277" class="body">WED</text><text x="303" y="277" class="body">THU</text><text x="375" y="277" class="body">FRI</text>
  <path d="M183 292v47" class="play"/><rect x="139" y="365" width="90" height="34" rx="17" class="badge"/><text x="184" y="388" text-anchor="middle" class="body">7 AM</text>
  <circle cx="255" cy="315" r="28" fill="none" stroke="#f2cd77" stroke-width="3"/><text x="76" y="447" class="small">Double-tap the WED date position.</text>

  <rect x="565" y="214" width="370" height="244" rx="16" class="state"/>
  <text x="592" y="253" class="heading">Tap coordinate → daily date</text>
  <text x="592" y="294" class="body">Active catalog:</text>
  <text x="616" y="322" class="small">Resolve 7 AM using the selected</text>
  <text x="616" y="345" class="small">location's IANA timezone.</text>
  <text x="592" y="382" class="body">Fixture/debug:</text>
  <text x="616" y="410" class="small">Use that local date's 7 AM sample.</text>
  <text x="592" y="440" class="small">Out of catalog? Carousel to first date at 7 AM.</text>

  <line x1="477" y1="322" x2="525" y2="322" class="arrow"/>
  <line x1="964" y1="322" x2="1012" y2="322" class="arrow"/>
  <text x="490" y="297" class="small">resolve</text><text x="976" y="297" class="small">select + expand</text>

  <text x="1053" y="208" class="small">The tapped date's 7 AM local instant is centered.</text>
  <line x1="1058" y1="315" x2="1418" y2="315" class="rail"/>
  <g class="tick"><path d="M1080 305v20M1134 301v28M1188 305v20M1242 301v28M1296 305v20M1350 301v28M1404 305v20"/></g>
  <text x="1062" y="277" class="small">4 AM</text><text x="1116" y="277" class="small">5 AM</text><text x="1170" y="277" class="small">6 AM</text><text x="1224" y="277" class="small">7 AM</text><text x="1278" y="277" class="small">8 AM</text><text x="1332" y="277" class="small">9 AM</text><text x="1386" y="277" class="small">10 AM</text>
  <path d="M1242 292v47" class="play"/><rect x="1198" y="365" width="90" height="34" rx="17" class="badge"/><text x="1243" y="388" text-anchor="middle" class="body">7 AM</text>
  <text x="1053" y="447" class="small">Hourly facts and scene follow Wednesday's selected time.</text>

  <rect x="48" y="576" width="1404" height="284" rx="20" class="panel"/>
  <text x="78" y="620" class="heading">RETURN PATH · EXACT INSTANT PRESERVED</text>
  <rect x="82" y="652" width="390" height="164" rx="16" class="state"/>
  <text x="108" y="692" class="body">Hourly selection: WED · 4:00 PM</text>
  <text x="108" y="727" class="small">Double-tap anywhere on the tape.</text>
  <text x="108" y="766" class="small">Coordinate is ignored for this transition.</text>
  <line x1="490" y1="734" x2="635" y2="734" class="arrow"/>
  <rect x="655" y="652" width="390" height="164" rx="16" class="target"/>
  <text x="681" y="692" class="body">Daily selection: WED · 4:00 PM</text>
  <text x="681" y="727" class="small">Same exact selected instant under the playhead.</text>
  <text x="681" y="766" class="small">No reset to noon on scale-only return.</text>
  <rect x="1080" y="652" width="340" height="164" rx="16" class="pill"/>
  <text x="1107" y="692" class="heading">Unaffected</text>
  <text x="1107" y="727" class="small">Single tap · drag · main-area</text>
  <text x="1107" y="750" class="small">gestures · accessibility action</text>
  <text x="1107" y="786" class="small">No new visible controls.</text>
  <text x="52" y="908" class="sub">Daily entry selects 7 AM local on the touched date, wrapping overflow to the first catalog date. Hourly return retains the precise selection.</text>
</svg>
