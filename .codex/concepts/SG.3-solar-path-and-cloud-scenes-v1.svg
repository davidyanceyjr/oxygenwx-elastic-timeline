<svg xmlns="http://www.w3.org/2000/svg" width="1900" height="1260" viewBox="0 0 1900 1260">
<defs>
 <linearGradient id="paper" x2="0" y2="1"><stop stop-color="#eef5f7"/><stop offset="1" stop-color="#dce8ed"/></linearGradient>
 <linearGradient id="sunrise" x2="0" y2="1"><stop stop-color="#90b5cd"/><stop offset=".62" stop-color="#efb69c"/><stop offset="1" stop-color="#e8cfbc"/></linearGradient>
 <linearGradient id="noon" x2="0" y2="1"><stop stop-color="#75a9ca"/><stop offset="1" stop-color="#d6e1df"/></linearGradient>
 <linearGradient id="sunset" x2="0" y2="1"><stop stop-color="#536783"/><stop offset=".65" stop-color="#d58f88"/><stop offset="1" stop-color="#f0bd93"/></linearGradient>
 <linearGradient id="night" x2="0" y2="1"><stop stop-color="#152642"/><stop offset="1" stop-color="#3a526b"/></linearGradient>
 <clipPath id="ref"><rect x="54" y="174" width="356" height="732" rx="24"/></clipPath>
 <style>
  .title{font:700 38px 'DejaVu Sans',sans-serif;fill:#18334b}.sub{font:20px 'DejaVu Sans',sans-serif;fill:#49677d}
  .eyebrow{font:700 16px 'DejaVu Sans',sans-serif;letter-spacing:2px;fill:#00859b}.label{font:700 15px 'DejaVu Sans',sans-serif;letter-spacing:1.4px;fill:#00859b}
  .body{font:17px 'DejaVu Sans',sans-serif;fill:#244259}.small{font:14px 'DejaVu Sans',sans-serif;fill:#58738a}
