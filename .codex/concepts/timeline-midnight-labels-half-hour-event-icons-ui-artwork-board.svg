<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1920" height="1300" viewBox="0 0 1920 1300" role="img" aria-labelledby="title desc">
  <title id="title">Timeline midnight labels and half-hour event icons UI artwork board</title>
  <desc id="desc">Product-owner-approved UI artwork dated 2026-11-09, paired with an unedited installed Pixel 3 XL daily-screen capture. Proposed daily and hourly timeline strips put weekday labels at local midnight. Daily summary content stays at noon; compact hourly event symbols sit at half-hour positions.</desc>
  <defs>
    <linearGradient id="page" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f2f5f8"/><stop offset="1" stop-color="#dce5ee"/></linearGradient>
    <linearGradient id="tape" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#254b6c"/><stop offset=".42" stop-color="#112a43"/><stop offset="1" stop-color="#08182a"/></linearGradient>
    <clipPath id="captureClip"><rect x="108" y="230" width="420" height="864" rx="12"/></clipPath>
  </defs>
  <rect width="1920" height="1300" fill="url(#page)"/>
  <text x="64" y="68" fill="#172b43" font-family="sans-serif" font-size="34" font-weight="700">Timeline tape · UI artwork board</text>
  <text x="64" y="106" fill="#4e6176" font-family="sans-serif" font-size="19">BEHAVIOR BOARD APPROVED · UI ARTWORK APPROVED 2026-11-09 · capture-led proposals</text>

  <!-- The installed capture is retained unedited as the actual before reference. -->
  <g font-family="sans-serif">
