    <image x="108" y="230" width="420" height="864" preserveAspectRatio="xMidYMid meet" href="timeline-midnight-labels-half-hour-event-icons-before.png" xlink:href="timeline-midnight-labels-half-hour-event-icons-before.png" clip-path="url(#captureClip)"/>
    <rect x="100" y="921" width="436" height="145" rx="12" fill="none" stroke="#ffcf67" stroke-width="4" stroke-dasharray="12 8"/>
