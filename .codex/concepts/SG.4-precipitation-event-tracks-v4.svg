<rect width="1600" height="1120" fill="url(#paper)"/>
<text x="48" y="42" class="eyebrow">OXYGEN · SCENE GENERATION · SG.4 · REVIEW BOARD</text>
<text x="48" y="92" class="title">Precipitation overlays follow supported evidence.</text>
<text x="48" y="123" class="sub">Layer rule: source clouds → precipitation beneath them → topmost temperature/data; catalog values remain the source of truth.</text>

<g fill="#fff" stroke="#c9d9e0" stroke-width="2">
  <rect x="40" y="151" width="365" height="257" rx="20"/><rect x="425" y="151" width="365" height="257" rx="20"/>
  <rect x="810" y="151" width="365" height="257" rx="20"/><rect x="1195" y="151" width="365" height="257" rx="20"/>
</g>
<text x="64" y="188" class="label">POINT-SUPPORTED EVENT</text>
<text x="64" y="224" class="h">RAIN / SNOW</text>
<text x="64" y="260" class="body"><tspan x="64">Keep the source sample instant.</tspan><tspan x="64" dy="23">Show its representative time cell</tspan><tspan x="64" dy="23">using SG.1's bounded rule.</tspan></text>
<rect x="64" y="338" width="315" height="43" rx="10" fill="#e7f3f6"/>
<text x="82" y="365" class="small">Cell edge is illustrative, not event time.</text>

<text x="449" y="188" class="label">SOURCE-BOUNDED INTERVAL</text>
<text x="449" y="224" class="h">AMOUNT / RATE</text>
<text x="449" y="260" class="body"><tspan x="449">Render only within supplied bounds.</tspan><tspan x="449" dy="23">Preserve amount and rate as separate</tspan><tspan x="449" dy="23">facts and keep the original interval.</tspan></text>
<rect x="449" y="338" width="315" height="43" rx="10" fill="#e7f3f6"/>
<text x="467" y="365" class="small">Never extend art beyond the interval.</text>

<text x="834" y="188" class="label">EXPECTED SAMPLE MISSING</text>
<text x="834" y="224" class="h">CARRY PRIOR HOUR</text>
<text x="834" y="260" class="body"><tspan x="834">Use the prior supplied condition</tspan><tspan x="834" dy="23">for display; keep its source time.</tspan><tspan x="834" dy="23">A leading gap shows daily facts.</tspan></text>
<rect x="834" y="338" width="315" height="43" rx="10" fill="#fff1dc"/>
<text x="852" y="365" class="small">No new hourly source fact is made.</text>

<text x="1219" y="188" class="label">CHANCE WITHOUT EVENT EVIDENCE</text>
<text x="1219" y="224" class="h">PROBABILITY ONLY</text>
<text x="1219" y="260" class="body"><tspan x="1219">Keep probability readable as chance.</tspan><tspan x="1219" dy="23">Do not create rain/snow art or use</tspan><tspan x="1219" dy="23">probability as intensity.</tspan></text>
<rect x="1219" y="338" width="315" height="43" rx="10" fill="#e7f3f6"/>
<text x="1237" y="365" class="small">Zero does not select a condition.</text>

<rect x="40" y="432" width="1520" height="337" rx="22" fill="#fff" stroke="#c9d9e0" stroke-width="2"/>
<text x="64" y="473" class="label">SIX-HOUR SCAN · 08:00–14:00 · SELECTED-TIME AUTHORITY</text>
<text x="64" y="503" class="small">Example: supplied CLEAR → RAIN → absent 11:00 hour carrying 10:00 RAIN → supplied CLEAR. Display boundaries do not assert onset or clearing minutes.</text>
<g clip-path="url(#city)">
