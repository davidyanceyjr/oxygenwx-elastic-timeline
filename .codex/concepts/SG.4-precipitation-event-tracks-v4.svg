  <rect x="390" y="646" width="760" height="52" fill="url(#rainCurtain)" mask="url(#rainAreaFade)"/>
  <rect x="1062" y="552" width="430" height="48" rx="12" fill="#183d5a" opacity="1"/>
  <text x="1277" y="582" text-anchor="middle" fill="#fff" font-family="DejaVu Sans" font-size="17" font-weight="700">11:00 DISPLAY · RAIN FROM 10:00</text>
</g>
<g fill="#fff" stroke="#cad9df" stroke-width="2">
 <rect x="86" y="702" width="216" height="47" rx="11"/><rect x="576" y="702" width="216" height="47" rx="11"/>
 <rect x="821" y="702" width="216" height="47" rx="11"/><rect x="1066" y="702" width="216" height="47" rx="11"/>
</g>
<text x="194" y="732" text-anchor="middle" class="mono">08:00 · CLEAR</text>
<text x="684" y="732" text-anchor="middle" class="mono">10:00 · RAIN POINT</text>
<text x="929" y="732" text-anchor="middle" class="mono">11:00 · RAIN (10:00)</text>
<text x="1174" y="732" text-anchor="middle" class="mono">12:00 · CLEAR</text>

<rect x="40" y="795" width="1520" height="244" rx="22" fill="#fff" stroke="#c9d9e0" stroke-width="2"/>
<text x="64" y="835" class="label">SUPPLIED CATEGORY → SCENE</text>
<text x="64" y="873" class="h">Keep each supplied CLEAR / PARTLY_CLOUDY / CLOUDY label; draw no falling precipitation.</text>
<text x="64" y="908" class="body">An interior absent hour carries the prior display with its source time. A leading gap shows daily facts only.</text>
<path d="M64 937h1470" stroke="#d9e4e8" stroke-width="2"/>
<text x="64" y="970" class="small">Scene changes remain deterministic at the selected instant. Readable probability, amount, source time and missingness stay visible in text.</text>
<text x="64" y="997" class="small">All precipitation falls beneath visible source clouds. RAIN has full cloud cover; Light Rain has a few clouds. Reduced motion holds the scene still.</text>
<text x="1536" y="1080" text-anchor="end" class="small">Revision v4 · owner approval pending · concept, not installed evidence</text>
</svg>
