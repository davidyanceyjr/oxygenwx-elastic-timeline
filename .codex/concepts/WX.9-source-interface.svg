<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1880" viewBox="0 0 1440 1880" role="img" aria-labelledby="title desc">
<title id="title">WX.9 — Shared catalog source and load-result contract</title>
<desc id="desc">Draft owner-review board showing one shared Now value, a common request and suspendable source interface, typed canonical load outcomes, WX.5 coverage semantics, provenance, cancellation, and safe in-memory publication without app source wiring.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#101d2b"/><stop offset="1" stop-color="#182d3c"/></linearGradient>
  <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#71d6c2"/><stop offset="1" stop-color="#8ebeff"/></linearGradient>
  <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0,0 L0,8 L8,4 z" fill="#8ee2cf"/></marker>
  <style>
    .sans{font-family:Inter,Roboto,"Arial",sans-serif}.mono{font-family:"Roboto Mono",monospace}
    .ink{fill:#f3f5f2}.muted{fill:#a8bac4}.teal{fill:#8ee2cf}.blue{fill:#a6caff}.amber{fill:#f1c477}.red{fill:#f29b91}
    .card{fill:#1e3443;stroke:#355263;stroke-width:1.5}.inner{fill:#162a38;stroke:#304b5c;stroke-width:1}
    .rule{stroke:#3b5969;stroke-width:1}.pill{fill:#294555;stroke:#496878;stroke-width:1}
  </style>
</defs>
<rect width="1440" height="1880" fill="url(#bg)"/>
<circle cx="1320" cy="130" r="180" fill="#55b8aa" opacity=".07"/><circle cx="95" cy="1630" r="230" fill="#709ad2" opacity=".06"/>
<g class="sans">
  <text x="84" y="78" class="teal" font-size="18" font-weight="700" letter-spacing="3">OXYGEN WX  /  SOURCE CONTRACT  /  09</text>
  <text x="84" y="146" class="ink" font-size="48" font-weight="700">One request. One canonical result.</text>
  <text x="84" y="188" class="muted" font-size="21">A shared source boundary for live, simulated, and recorded catalogs.</text>
  <rect x="1080" y="66" width="274" height="44" rx="22" class="pill"/><text x="1217" y="94" text-anchor="middle" class="teal" font-size="14" font-weight="700" letter-spacing="1">OWNER-APPROVED</text>

  <rect x="72" y="230" width="1296" height="286" rx="22" class="card"/>
  <text x="106" y="275" class="teal" font-size="15" font-weight="700" letter-spacing="2">01  /  SHARED CURRENT TIME</text>
  <text x="106" y="315" class="ink" font-size="24" font-weight="650">Kotlin and Compose use the same app clock: Now.</text>
  <rect x="106" y="342" width="305" height="116" rx="15" class="inner"/>
  <circle cx="153" cy="400" r="27" fill="#294555" stroke="#8ee2cf" stroke-width="2"/><path d="M153 382 V400 L166 408" fill="none" stroke="#8ee2cf" stroke-width="3" stroke-linecap="round"/>
  <text x="196" y="390" class="blue" font-size="14" font-weight="700">ONE CLOCK</text><text x="196" y="424" class="ink mono" font-size="20">Now: Instant</text>
  <path d="M411 400 H451" fill="none" stroke="#8ee2cf" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="470" y="342" width="370" height="116" rx="15" class="inner"/><text x="655" y="383" text-anchor="middle" class="blue" font-size="14" font-weight="700">KOTLIN + COMPOSE</text><text x="655" y="419" text-anchor="middle" class="ink" font-size="18">both read the same Now</text>
  <path d="M840 400 H884" fill="none" stroke="#8ee2cf" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="903" y="342" width="431" height="116" rx="15" class="inner"/><text x="929" y="382" class="blue" font-size="14" font-weight="700">AT REQUEST CREATION</text><text x="929" y="417" class="ink mono" font-size="17">request.asOf = Now</text><text x="929" y="442" class="muted" font-size="13">Capture once; source uses that instant.</text>
  <text x="106" y="490" class="amber" font-size="14">This slice shares current time only; it does not add a timer framework or change timeline behavior.</text>

  <rect x="72" y="540" width="1296" height="286" rx="22" class="card"/>
  <text x="106" y="585" class="teal" font-size="15" font-weight="700" letter-spacing="2">02  /  ONE SOURCE INTERFACE</text>
  <text x="106" y="625" class="ink" font-size="23" font-weight="650">Each source receives the same request and returns the same result type.</text>
  <rect x="106" y="656" width="224" height="116" rx="15" class="inner"/><text x="218" y="693" text-anchor="middle" class="blue" font-size="14" font-weight="700">LIVE SOURCE</text><text x="218" y="728" text-anchor="middle" class="ink" font-size="16">provider-neutral output</text><text x="218" y="752" text-anchor="middle" class="muted" font-size="13">no transport DTO escapes</text>
  <rect x="356" y="656" width="224" height="116" rx="15" class="inner"/><text x="468" y="693" text-anchor="middle" class="blue" font-size="14" font-weight="700">SIMULATED SOURCE</text><text x="468" y="728" text-anchor="middle" class="ink" font-size="16">same canonical output</text><text x="468" y="752" text-anchor="middle" class="muted" font-size="13">synthetic provenance</text>
  <rect x="606" y="656" width="224" height="116" rx="15" class="inner"/><text x="718" y="693" text-anchor="middle" class="blue" font-size="14" font-weight="700">REPLAY SOURCE</text><text x="718" y="728" text-anchor="middle" class="ink" font-size="16">same canonical output</text><text x="718" y="752" text-anchor="middle" class="muted" font-size="13">recorded provenance</text>
  <path d="M330 715 H892 M580 715 H892 M830 715 H892" fill="none" stroke="#8ee2cf" stroke-width="2"/>
  <path d="M892 715 H939" fill="none" stroke="#8ee2cf" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="958" y="656" width="376" height="116" rx="15" class="inner"/>
  <text x="1146" y="690" text-anchor="middle" class="blue mono" font-size="16">suspend fun load(request)</text>
  <text x="1146" y="724" text-anchor="middle" class="ink" font-size="15">CatalogLoadResult</text>
  <text x="1146" y="752" text-anchor="middle" class="amber" font-size="13">Cancellation propagates separately.</text>
  <rect x="106" y="785" width="1228" height="28" rx="14" fill="#294555"/>
  <text x="720" y="805" text-anchor="middle" class="ink mono" font-size="14">Request = CatalogLocation + DatasetId + asOf: Instant</text>

  <rect x="72" y="850" width="1296" height="397" rx="22" class="card"/>
  <text x="106" y="895" class="teal" font-size="15" font-weight="700" letter-spacing="2">03  /  TYPED LOAD OUTCOMES</text>
  <text x="106" y="935" class="ink" font-size="23" font-weight="650">Catalogs travel only with usable data outcomes.</text>
  <rect x="106" y="962" width="386" height="102" rx="15" class="inner"/><circle cx="138" cy="994" r="10" fill="#8ee2cf"/><text x="162" y="999" class="teal" font-size="15" font-weight="700">SUCCESS</text><text x="132" y="1034" class="ink" font-size="16">Complete CanonicalCatalog</text>
  <rect x="527" y="962" width="386" height="102" rx="15" class="inner"/><circle cx="559" cy="994" r="10" fill="#f1c477"/><text x="583" y="999" class="amber" font-size="15" font-weight="700">PARTIAL</text><text x="553" y="1034" class="ink" font-size="16">Catalog + expected-support metadata</text>
  <rect x="948" y="962" width="386" height="102" rx="15" class="inner"/><circle cx="980" cy="994" r="10" fill="#a6caff"/><text x="1004" y="999" class="blue" font-size="15" font-weight="700">NO DATA</text><text x="974" y="1034" class="ink" font-size="16">Typed outcome · no catalog payload</text>
  <rect x="106" y="1084" width="598" height="102" rx="15" class="inner"/><circle cx="138" cy="1116" r="10" fill="#f29b91"/><text x="162" y="1121" class="red" font-size="15" font-weight="700">INVALID REQUEST</text><text x="132" y="1156" class="ink" font-size="16">Typed reason · no catalog payload</text>
  <rect x="730" y="1084" width="604" height="102" rx="15" class="inner"/><circle cx="762" cy="1116" r="10" fill="#f29b91"/><text x="786" y="1121" class="red" font-size="15" font-weight="700">TRANSPORT FAILURE</text><text x="756" y="1156" class="ink" font-size="16">Typed reason · no catalog payload</text>
  <rect x="106" y="1197" width="1228" height="30" rx="15" fill="#294555"/><text x="720" y="1218" text-anchor="middle" class="blue" font-size="14">CANCELLATION CONTROL FLOW · coroutine cancellation stops the load; it is not a CatalogLoadResult.</text>

  <rect x="72" y="1270" width="1296" height="290" rx="22" class="card"/>
  <text x="106" y="1315" class="teal" font-size="15" font-weight="700" letter-spacing="2">04  /  PARTIAL COVERAGE + PROVENANCE</text>
  <rect x="106" y="1342" width="598" height="176" rx="15" class="inner"/>
  <text x="132" y="1379" class="blue" font-size="14" font-weight="700">WX.5 EXPECTED SUPPORT</text>
  <text x="132" y="1415" class="ink" font-size="16">Declare what the source provides by local date and field.</text>
  <rect x="132" y="1433" width="156" height="42" rx="12" class="pill"/><text x="210" y="1460" text-anchor="middle" class="teal" font-size="14">COMPLETE</text>
  <rect x="302" y="1433" width="156" height="42" rx="12" class="pill"/><text x="380" y="1460" text-anchor="middle" class="amber" font-size="14">PARTIAL</text>
  <rect x="472" y="1433" width="196" height="42" rx="12" class="pill"/><text x="570" y="1460" text-anchor="middle" class="muted" font-size="14">MISSING</text>
  <text x="132" y="1500" class="amber" font-size="13">NOT PROVIDED BY SOURCE → null; not a coverage failure.</text>
  <rect x="730" y="1342" width="604" height="176" rx="15" class="inner"/>
  <text x="756" y="1379" class="blue" font-size="14" font-weight="700">ORIGIN AND CACHE ARE SEPARATE</text>
  <text x="756" y="1415" class="ink mono" font-size="15">LIVE  +  cacheState = CACHED</text>
  <text x="756" y="1448" class="ink mono" font-size="15">SIMULATED  +  synthetic product</text>
  <text x="756" y="1481" class="ink mono" font-size="15">REPLAY  +  preserved product kind</text>
  <text x="756" y="1507" class="amber" font-size="13">One canonical weather model for every origin.</text>

  <rect x="72" y="1583" width="1296" height="220" rx="22" class="card"/>
  <text x="106" y="1628" class="teal" font-size="15" font-weight="700" letter-spacing="2">05  /  SAFE PUBLICATION · NO ACTIVE CATALOG STORE</text>
  <rect x="106" y="1652" width="341" height="92" rx="14" class="inner"/><text x="276" y="1688" text-anchor="middle" class="blue" font-size="14" font-weight="700">INPUTS</text><text x="276" y="1721" text-anchor="middle" class="ink" font-size="16">current catalog + load result</text>
  <path d="M447 1698 H503" fill="none" stroke="#8ee2cf" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="520" y="1652" width="341" height="92" rx="14" class="inner"/><text x="690" y="1688" text-anchor="middle" class="blue" font-size="14" font-weight="700">PURE ACCEPTANCE GATE</text><text x="690" y="1721" text-anchor="middle" class="ink" font-size="16">evaluate result type</text>
  <path d="M861 1698 H917" fill="none" stroke="#8ee2cf" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="934" y="1652" width="400" height="92" rx="14" class="inner"/><text x="1134" y="1681" text-anchor="middle" class="teal" font-size="14" font-weight="700">SUCCESS / PARTIAL → CANDIDATE</text><text x="1134" y="1710" text-anchor="middle" class="amber" font-size="14">NO-DATA / FAILURE → KEEP CURRENT</text>
  <text x="106" y="1780" class="muted" font-size="14">Contract checks only: no persistence, app startup wiring, source picker, or active catalog store.</text>

  <text x="84" y="1848" class="muted" font-size="14" letter-spacing="1">WX.9 SOURCE CONTRACT BOARD  ·  OWNER-APPROVED DESIGN INPUT  ·  NOT IMPLEMENTATION OR ACCEPTANCE EVIDENCE</text>
</g>
</svg>
