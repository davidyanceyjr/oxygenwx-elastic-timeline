  <rect x="554" y="761" width="383" height="160" rx="2" fill="none" stroke="#40d0d4" stroke-width="3" stroke-dasharray="7 6"/>

  <text x="1005" y="183" class="label">DESIGN INTENT</text>
  <rect x="995" y="204" width="560" height="280" rx="20" fill="#fff" stroke="#d4dfe7"/>
  <text x="1025" y="246" class="ink" font-size="21" font-weight="700">More vertical touch space</text>
  <text x="1025" y="283" class="body">• Grow the timeline from 84 dp to about 120 dp.</text>
  <text x="1025" y="316" class="body">• Use two bands: date context and scrub rail.</text>
  <text x="1025" y="349" class="body">• Move the forecast cluster and lower facts upward.</text>
  <text x="1025" y="382" class="body">• Keep city, sky share, and weather composition intact.</text>
  <text x="1025" y="415" class="body">• Keep selected time attached to the rail playhead.</text>
  <text x="1025" y="458" class="small">Existing selected-time, scale, gesture, and data semantics.</text>

  <rect x="995" y="505" width="560" height="217" rx="20" fill="#fff" stroke="#d4dfe7"/>
  <text x="1025" y="547" class="label">BEHAVIOR CONTRACT</text>
  <text x="1025" y="583" class="body">Selected instant ↔ readout ↔ playhead stay paired.</text>
  <text x="1025" y="616" class="body">Daily overview and hourly precision keep their ownership.</text>
  <text x="1025" y="649" class="body">Zoom changes the scale; it never changes selected time.</text>
  <text x="1025" y="682" class="body">Large text and compact screens keep all three bands legible.</text>

  <rect x="995" y="743" width="560" height="197" rx="20" fill="#e1ebf1"/>
  <text x="1025" y="786" class="label">REVIEW BEFORE IMPLEMENTATION</text>
  <text x="1025" y="822" class="body">Pixel portrait + 360×640 dp compact.</text>
  <text x="1025" y="855" class="body">Default + 1.3 font; RTL and reduced-motion impact.</text>
  <text x="1025" y="888" class="body">Check text/facts clearance, gestures, and timeline readability.</text>
  <text x="1025" y="923" class="small">This proposal changes the previously approved screen footprint.</text>
</svg>
