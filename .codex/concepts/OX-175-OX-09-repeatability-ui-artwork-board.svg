<svg xmlns="http://www.w3.org/2000/svg" width="1720" height="1040" viewBox="0 0 1720 1040" role="img" aria-labelledby="title desc">
  <title id="title">OX-09 repeatability across scene and world changes</title>
  <desc id="desc">Four schematic app states show a First City baseline and repeat, Open Landscape after a world switch and repeat, and First City after returning. Each world is compared with its own samples while the selected instant and forecast facts stay fixed. These LIVE catalog states do not require a DEMO DATA badge.</desc>
  <defs>
    <linearGradient id="page" x1="0" x2="0" y1="0" y2="1"><stop stop-color="#f5f8fb"/><stop offset="1" stop-color="#e9eff5"/></linearGradient>
    <linearGradient id="sky" x1="0" x2="0" y1="0" y2="1"><stop stop-color="#81a8b9"/><stop offset="1" stop-color="#c7d5d1"/></linearGradient>
    <linearGradient id="landSky" x1="0" x2="0" y1="0" y2="1"><stop stop-color="#8fb7c0"/><stop offset="1" stop-color="#d4d5bb"/></linearGradient>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#58738a"/></marker>
    <style>
      .font { font-family: Inter, "DejaVu Sans", Arial, sans-serif; }
      .title { font-size: 32px; font-weight: 700; fill: #18324a; }
      .subtitle { font-size: 17px; fill: #52697e; }
      .step { font-size: 13px; font-weight: 700; letter-spacing: 1.1px; fill: #50708a; }
      .cardtitle { font-size: 17px; font-weight: 700; fill: #18324a; }
      .small { font-size: 12px; fill: #496174; }
      .tiny { font-size: 10px; fill: #587084; }
      .sceneTag { font-size: 10px; font-weight: 700; letter-spacing: .8px; fill: #f7fbff; }
      .note { font-size: 15px; fill: #263f54; }
    </style>
  </defs>

  <rect width="1720" height="1040" fill="url(#page)"/>
  <text class="font title" x="54" y="64">OX-09 · Repeatability across scene/world changes</text>
  <text class="font subtitle" x="56" y="96">Behavior and appearance supplement · same selected instant and supplied inputs across the sequence</text>
  <rect x="54" y="119" width="1612" height="48" rx="12" fill="#e2ebf3" stroke="#c0cfdb"/>
  <text class="font small" x="76" y="149">FIXED FOR EVERY SAMPLE</text>
  <text class="font note" x="278" y="149">same place · catalog revision · selected instant · weather decision · build · viewport</text>

  <!-- Step connectors sit above the state cards. -->
  <text class="font tiny" text-anchor="middle" x="442" y="199">repeat same selection</text>
  <line x1="425" y1="216" x2="461" y2="216" stroke="#58738a" stroke-width="2" marker-end="url(#arrow)"/>
  <text class="font tiny" text-anchor="middle" x="858" y="199">switch world · repeat</text>
  <line x1="841" y1="216" x2="877" y2="216" stroke="#58738a" stroke-width="2" marker-end="url(#arrow)"/>
  <text class="font tiny" text-anchor="middle" x="1274" y="199">return · reselect</text>
  <line x1="1257" y1="216" x2="1293" y2="216" stroke="#58738a" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- State card 1: First City baseline. -->
  <g transform="translate(48 229)">
    <rect width="376" height="570" rx="18" fill="#ffffff" stroke="#b8c8d5" stroke-width="1.4"/>
    <text class="font step" x="20" y="30">01 · BASELINE A</text>
    <text class="font cardtitle" x="20" y="57">First City · initial</text>
    <rect x="20" y="74" width="336" height="300" rx="11" fill="url(#sky)"/>
    <text class="font sceneTag" x="34" y="96">SCHEMATIC SCENE OUTPUT</text>
    <path d="M20 294 L20 235 L70 219 L103 228 L103 194 L151 184 L151 225 L190 211 L222 220 L222 201 L266 190 L266 235 L311 220 L356 232 L356 374 L20 374 Z" fill="#657783" opacity=".85"/>
    <rect x="46" y="247" width="12" height="15" fill="#b7c5be" opacity=".6"/><rect x="76" y="240" width="9" height="12" fill="#b7c5be" opacity=".55"/>
    <rect x="164" y="231" width="11" height="14" fill="#c9c6a8" opacity=".58"/><rect x="286" y="247" width="10" height="13" fill="#c9c6a8" opacity=".5"/>
    <path d="M20 314 C84 289 130 305 186 298 C254 289 305 301 356 284 L356 374 L20 374 Z" fill="#35564c"/>
    <path d="M38 323 C69 294 98 296 122 325 C143 303 174 306 194 331 C224 302 253 306 275 330 C301 302 327 306 349 328 L349 374 L38 374 Z" fill="#49745f"/>
    <text class="font small" x="25" y="400">Existing forecast facts stay visible</text>
    <text class="font tiny" x="25" y="466">SELECTED INSTANT</text>
    <text class="font small" x="25" y="489">t* · same position in every state</text>
    <line x1="32" y1="526" x2="344" y2="526" stroke="#8ca0b0" stroke-width="3" stroke-linecap="round"/>
    <g stroke="#8ca0b0" stroke-width="1.2"><line x1="70" y1="518" x2="70" y2="534"/><line x1="115" y1="520" x2="115" y2="532"/><line x1="160" y1="518" x2="160" y2="534"/><line x1="205" y1="520" x2="205" y2="532"/><line x1="250" y1="518" x2="250" y2="534"/><line x1="295" y1="520" x2="295" y2="532"/></g>
    <circle cx="188" cy="526" r="7" fill="#eaf4fb" stroke="#315b78" stroke-width="3"/>
    <text class="font tiny" text-anchor="middle" x="188" y="553">A · compare within First City</text>
  </g>

  <!-- State card 2: same-world repeat. -->
  <g transform="translate(464 229)">
    <rect width="376" height="570" rx="18" fill="#ffffff" stroke="#b8c8d5" stroke-width="1.4"/>
    <text class="font step" x="20" y="30">02 · REPEAT A′</text>
    <text class="font cardtitle" x="20" y="57">First City · same selection</text>
    <rect x="20" y="74" width="336" height="300" rx="11" fill="url(#sky)"/>
    <text class="font sceneTag" x="34" y="96">SAME WORLD · SAME INPUTS</text>
    <path d="M20 294 L20 235 L70 219 L103 228 L103 194 L151 184 L151 225 L190 211 L222 220 L222 201 L266 190 L266 235 L311 220 L356 232 L356 374 L20 374 Z" fill="#657783" opacity=".85"/>
    <rect x="46" y="247" width="12" height="15" fill="#b7c5be" opacity=".6"/><rect x="76" y="240" width="9" height="12" fill="#b7c5be" opacity=".55"/>
    <rect x="164" y="231" width="11" height="14" fill="#c9c6a8" opacity=".58"/><rect x="286" y="247" width="10" height="13" fill="#c9c6a8" opacity=".5"/>
    <path d="M20 314 C84 289 130 305 186 298 C254 289 305 301 356 284 L356 374 L20 374 Z" fill="#35564c"/>
    <path d="M38 323 C69 294 98 296 122 325 C143 303 174 306 194 331 C224 302 253 306 275 330 C301 302 327 306 349 328 L349 374 L38 374 Z" fill="#49745f"/>
    <text class="font small" x="25" y="400">Compare A′ with A, including motion</text>
    <text class="font tiny" x="25" y="466">SELECTED INSTANT</text>
    <text class="font small" x="25" y="489">t* · unchanged</text>
    <line x1="32" y1="526" x2="344" y2="526" stroke="#8ca0b0" stroke-width="3" stroke-linecap="round"/>
    <g stroke="#8ca0b0" stroke-width="1.2"><line x1="70" y1="518" x2="70" y2="534"/><line x1="115" y1="520" x2="115" y2="532"/><line x1="160" y1="518" x2="160" y2="534"/><line x1="205" y1="520" x2="205" y2="532"/><line x1="250" y1="518" x2="250" y2="534"/><line x1="295" y1="520" x2="295" y2="532"/></g>
    <circle cx="188" cy="526" r="7" fill="#eaf4fb" stroke="#315b78" stroke-width="3"/>
    <text class="font tiny" text-anchor="middle" x="188" y="553">A ↔ A′ within First City</text>
  </g>

  <!-- State card 3: Open Landscape entry and repeat. -->
  <g transform="translate(880 229)">
    <rect width="376" height="570" rx="18" fill="#ffffff" stroke="#b8c8d5" stroke-width="1.4"/>
    <text class="font step" x="20" y="30">03 · SWITCH B / REPEAT B′</text>
    <text class="font cardtitle" x="20" y="57">Open Landscape</text>
    <rect x="20" y="74" width="336" height="300" rx="11" fill="url(#landSky)"/>
    <text class="font sceneTag" x="34" y="96">SAME INSTANT · WORLD CHANGES</text>
    <path d="M20 284 C76 235 122 251 166 218 C208 187 249 211 290 182 C316 165 337 181 356 169 L356 374 L20 374 Z" fill="#688c83" opacity=".9"/>
    <path d="M20 315 C78 282 116 303 170 270 C222 239 280 282 356 240 L356 374 L20 374 Z" fill="#416a59"/>
    <path d="M20 338 C91 307 131 330 195 302 C247 279 305 310 356 291 L356 374 L20 374 Z" fill="#35564c"/>
    <g fill="#35654f" stroke="#594b3f" stroke-width="5" stroke-linecap="round">
      <path d="M112 322 L112 277 M112 294 L98 280 M112 301 L127 285"/><circle cx="112" cy="268" r="18" stroke="none"/>
      <path d="M129 327 L129 293 M129 305 L118 295 M129 308 L140 296"/><circle cx="129" cy="287" r="13" stroke="none"/>
      <path d="M282 319 L282 270 M282 290 L266 277 M282 297 L299 279"/><circle cx="282" cy="260" r="19" stroke="none"/>
    </g>
    <text class="font small" x="25" y="400">Record B and B′ within this world</text>
    <text class="font tiny" x="25" y="466">SELECTED INSTANT</text>
    <text class="font small" x="25" y="489">t* · unchanged</text>
    <line x1="32" y1="526" x2="344" y2="526" stroke="#8ca0b0" stroke-width="3" stroke-linecap="round"/>
    <g stroke="#8ca0b0" stroke-width="1.2"><line x1="70" y1="518" x2="70" y2="534"/><line x1="115" y1="520" x2="115" y2="532"/><line x1="160" y1="518" x2="160" y2="534"/><line x1="205" y1="520" x2="205" y2="532"/><line x1="250" y1="518" x2="250" y2="534"/><line x1="295" y1="520" x2="295" y2="532"/></g>
    <circle cx="188" cy="526" r="7" fill="#eaf4fb" stroke="#315b78" stroke-width="3"/>
    <text class="font tiny" text-anchor="middle" x="188" y="553">Expected composition differs from A</text>
  </g>

  <!-- State card 4: return to First City. -->
  <g transform="translate(1296 229)">
    <rect width="376" height="570" rx="18" fill="#ffffff" stroke="#b8c8d5" stroke-width="1.4"/>
    <text class="font step" x="20" y="30">04 · RETURN A″</text>
    <text class="font cardtitle" x="20" y="57">First City · reselect</text>
    <rect x="20" y="74" width="336" height="300" rx="11" fill="url(#sky)"/>
    <text class="font sceneTag" x="34" y="96">COMPARE WITH A / A′</text>
    <path d="M20 294 L20 235 L70 219 L103 228 L103 194 L151 184 L151 225 L190 211 L222 220 L222 201 L266 190 L266 235 L311 220 L356 232 L356 374 L20 374 Z" fill="#657783" opacity=".85"/>
    <rect x="46" y="247" width="12" height="15" fill="#b7c5be" opacity=".6"/><rect x="76" y="240" width="9" height="12" fill="#b7c5be" opacity=".55"/>
    <rect x="164" y="231" width="11" height="14" fill="#c9c6a8" opacity=".58"/><rect x="286" y="247" width="10" height="13" fill="#c9c6a8" opacity=".5"/>
    <path d="M20 314 C84 289 130 305 186 298 C254 289 305 301 356 284 L356 374 L20 374 Z" fill="#35564c"/>
    <path d="M38 323 C69 294 98 296 122 325 C143 303 174 306 194 331 C224 302 253 306 275 330 C301 302 327 306 349 328 L349 374 L38 374 Z" fill="#49745f"/>
    <text class="font small" x="25" y="400">World return must preserve selection</text>
    <text class="font tiny" x="25" y="466">SELECTED INSTANT</text>
    <text class="font small" x="25" y="489">t* · unchanged</text>
    <line x1="32" y1="526" x2="344" y2="526" stroke="#8ca0b0" stroke-width="3" stroke-linecap="round"/>
    <g stroke="#8ca0b0" stroke-width="1.2"><line x1="70" y1="518" x2="70" y2="534"/><line x1="115" y1="520" x2="115" y2="532"/><line x1="160" y1="518" x2="160" y2="534"/><line x1="205" y1="520" x2="205" y2="532"/><line x1="250" y1="518" x2="250" y2="534"/><line x1="295" y1="520" x2="295" y2="532"/></g>
    <circle cx="188" cy="526" r="7" fill="#eaf4fb" stroke="#315b78" stroke-width="3"/>
    <text class="font tiny" text-anchor="middle" x="188" y="553">A, A′, A″ are the comparison set</text>
  </g>

  <rect x="54" y="830" width="1612" height="118" rx="16" fill="#ffffff" stroke="#c3d1dc"/>
  <text class="font cardtitle" x="78" y="866">Compare within each world</text>
  <text class="font note" x="78" y="895">First City: A ↔ A′ ↔ A″ · Open Landscape: B ↔ B′ · different world art is expected</text>
  <text class="font small" x="78" y="923">Separate animation phase from re-randomized layout. Preserve forecast facts and the selected instant; no DEMO DATA badge is required for these LIVE states.</text>

  <text class="font tiny" x="56" y="988">Conceptual state artwork for OX-09 · not an installed screenshot or visual acceptance evidence</text>
</svg>
