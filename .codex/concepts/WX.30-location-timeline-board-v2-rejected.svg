 <text x="72" y="365" class="small">The shorter list repeats around this same rail.</text>
 <rect x="42" y="420" width="1084" height="174" rx="18" fill="#102838" stroke="#315264"/>
 <text x="72" y="460" class="label">ONE CONTROLLER</text><text x="72" y="496" class="body">A drag on either data set moves the same rail and both sets together.</text><text x="72" y="530" class="body">The shorter populated set wraps circularly; no second scroll state exists.</text><text x="72" y="564" class="body">Touching either side makes that location the centered readout source.</text>
