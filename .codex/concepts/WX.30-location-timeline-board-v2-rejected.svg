 <rect x="42" y="130" width="1084" height="255" rx="18" fill="#122b3d" stroke="#315264"/>
 <text x="72" y="169" class="label">SEARCH RESULTS · ABOVE THE RAIL</text><text x="72" y="205" class="small">TUS          SCO          DTH          TUS …</text>
