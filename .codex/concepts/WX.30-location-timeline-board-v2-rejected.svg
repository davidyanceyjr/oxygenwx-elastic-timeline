 <rect x="606" y="677" width="520" height="194" rx="18" fill="#172c3b" stroke="#3d806d" stroke-width="2"/><text x="634" y="718" style="font:700 20px Inter,Roboto,Arial,sans-serif;fill:#86e99b">SAVED LOCATION</text><text x="634" y="756" class="body">Full details and actions below the readout.</text><rect x="634" y="783" width="150" height="44" rx="22" fill="#153a45" stroke="#67c8b6" stroke-width="2"/><text x="709" y="811" text-anchor="middle" class="body">Remove</text><rect x="804" y="783" width="150" height="44" rx="22" fill="#89d9c7"/><text x="879" y="811" text-anchor="middle" class="chip">VIEW</text>
 <text x="42" y="930" class="label">PERSISTENCE</text><text x="42" y="970" class="note">Save: add saved place, persist catalog, activate. View: activate temporarily; discard its catalog on switch.</text><text x="42" y="1006" class="note">Saved View uses its saved catalog. Remove retains the approved confirmation and storage behavior.</text>
 <text x="42" y="1066" class="label">COLOR KEY</text><circle cx="157" cy="1107" r="9" fill="#83ed8b"/><text x="177" y="1113" class="small">current saved place</text><circle cx="439" cy="1107" r="9" fill="#ffd67b"/><text x="459" y="1113" class="small">focused search result</text><circle cx="784" cy="1107" r="9" fill="#eaf2f4"/><text x="804" y="1113" class="small">other entries</text>
 <text x="42" y="1185" class="small">Review: shared rail/gesture · circular repetition · Save vs View persistence · focus colors.</text>
