<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="2200" height="1550" viewBox="0 0 2200 1550" role="img" aria-labelledby="title desc">
  <title id="title">WX.19 · Location selector UI concept</title>
  <desc id="desc">Actual installed Pixel 3 XL before screenshot beside a proposed location selector sheet over that same app screen, with UI states and later installed before and after evidence requirements.</desc>
  <defs>
    <style>
      text{font-family:Inter,"DejaVu Sans",Arial,sans-serif;fill:#eef4f6}
      .title{font-size:43px;font-weight:700}.sub{font-size:20px;fill:#b9ccd5}
      .head{font-size:25px;font-weight:700}.label{font-size:19px;font-weight:700}
      .body{font-size:18px;fill:#d0dde2}.small{font-size:16px;fill:#b5c9d0}
      .mint{fill:#88dfcf}.amber{fill:#efc38b}
      .panel{fill:#1a3040;stroke:#517589;stroke-width:2}.deep{fill:#112537;stroke:#476779;stroke-width:1.5}
    </style>
    <clipPath id="beforeClip"><rect x="78" y="233" width="562" height="1000" rx="24"/></clipPath>
    <clipPath id="afterClip"><rect x="790" y="233" width="562" height="1000" rx="24"/></clipPath>
  </defs>
  <rect width="2200" height="1550" fill="#0d1b29"/>
  <text x="72" y="70" class="title">WX.19 · Manual location search and selector</text>
  <text x="74" y="109" class="sub">UI concept grounded in an installed app capture · Pixel 3 XL · 1260 × 2240 viewport</text>
  <rect x="1862" y="42" width="264" height="42" rx="21" fill="#244052" stroke="#77a7ae"/>
  <text x="1994" y="70" text-anchor="middle" class="small">CONCEPT · FOR APPROVAL</text>

  <rect x="65" y="155" width="592" height="1160" rx="22" class="panel"/>
  <text x="88" y="194" class="head">BEFORE  ·  installed app</text>
  <image x="78" y="233" width="562" height="1000" xlink:href="WX.19-location-selector-before-installed.png" clip-path="url(#beforeClip)" preserveAspectRatio="none"/>
  <rect x="78" y="233" width="562" height="1000" rx="24" fill="none" stroke="#7798a7" stroke-width="2"/>
  <text x="88" y="1262" class="small">Actual debug app capture · no location UI present</text>
  <text x="88" y="1290" class="small">Capture is design baseline, not acceptance evidence.</text>

  <rect x="777" y="155" width="588" height="1160" rx="22" class="panel"/>
  <text x="800" y="194" class="head">PROPOSED  ·  selector open</text>
  <image x="790" y="233" width="562" height="1000" xlink:href="WX.19-location-selector-before-installed.png" clip-path="url(#afterClip)" preserveAspectRatio="none"/>
  <rect x="790" y="233" width="562" height="1000" rx="24" fill="#061521" opacity=".55"/>
  <rect x="802" y="369" width="538" height="855" rx="25" fill="#13293a" stroke="#89dccc" stroke-width="2.5"/>
  <rect x="1019" y="385" width="100" height="7" rx="3.5" fill="#6f8e9d"/>
  <text x="829" y="435" class="head">Locations</text>
  <text x="1302" y="435" text-anchor="end" class="mint" font-size="19">Close</text>
  <text x="829" y="465" class="small">Search and choose a place manually</text>
  <rect x="827" y="490" width="486" height="64" rx="15" fill="#233f50" stroke="#729ba8" stroke-width="1.5"/>
  <text x="849" y="530" class="body">⌕  Springfield</text>
  <text x="829" y="593" class="label">SEARCH RESULTS</text>
  <rect x="826" y="611" width="488" height="111" rx="13" fill="#1e394b" stroke="#5a7e8f"/>
  <text x="846" y="644" class="label">Springfield, Illinois</text>
  <text x="846" y="675" class="small">United States · America/Chicago</text>
  <text x="846" y="703" class="small">39.8017, −89.6437</text>
  <rect x="1222" y="639" width="73" height="43" rx="12" fill="#2b5c60"/>
  <text x="1258" y="667" text-anchor="middle" font-size="17">Add</text>
  <rect x="826" y="736" width="488" height="111" rx="13" fill="#1e394b" stroke="#5a7e8f"/>
  <text x="846" y="769" class="label">Springfield, Massachusetts</text>
  <text x="846" y="800" class="small">United States · America/New_York</text>
  <text x="846" y="828" class="small">42.1015, −72.5898</text>
  <rect x="1222" y="764" width="73" height="43" rx="12" fill="#2b5c60"/>
  <text x="1258" y="792" text-anchor="middle" font-size="17">Add</text>
  <line x1="828" y1="874" x2="1314" y2="874" stroke="#486576"/>
  <text x="829" y="912" class="label">SAVED LOCATIONS</text>
  <rect x="826" y="932" width="488" height="90" rx="13" fill="#194246" stroke="#83d9c8" stroke-width="1.5"/>
  <circle cx="851" cy="976" r="10" fill="#8fe4cf"/>
  <text x="874" y="970" class="label">Chicago, Illinois</text>
  <text x="874" y="995" class="small">Selected · America/Chicago</text>
  <text x="1293" y="982" text-anchor="end" class="small">Remove</text>
  <rect x="826" y="1035" width="488" height="90" rx="13" fill="#1e394b" stroke="#5a7e8f"/>
  <circle cx="851" cy="1079" r="10" fill="none" stroke="#9bb3bf" stroke-width="2"/>
  <text x="874" y="1073" class="label">Madison, Wisconsin</text>
  <text x="874" y="1098" class="small">Select · America/Chicago</text>
  <text x="1293" y="1085" text-anchor="end" class="small">Remove</text>
  <text x="829" y="1173" class="small">Search does not request device location.</text>
  <rect x="790" y="233" width="562" height="1000" rx="24" fill="none" stroke="#7798a7" stroke-width="2"/>
  <text x="800" y="1262" class="small">Design composite over the same installed capture.</text>
  <text x="800" y="1290" class="small">A real after capture is required during WX.19.</text>

  <rect x="1393" y="155" width="740" height="1160" rx="22" class="panel"/>
  <text x="1423" y="202" class="head">Interaction contract</text>
  <text x="1423" y="248" class="mint label">01  Open and return</text>
  <text x="1423" y="282" class="body">The main-screen access route is owner-planned.</text>
  <text x="1423" y="311" class="body">When opened, Close returns to the</text>
  <text x="1423" y="340" class="body">same time and timeline position.</text>
  <line x1="1423" y1="370" x2="2104" y2="370" stroke="#476779"/>
  <text x="1423" y="414" class="mint label">02  Find and distinguish</text>
  <text x="1423" y="448" class="body">Show place, region, country, and timezone.</text>
  <text x="1423" y="477" class="body">Same-name results remain separate choices.</text>
  <text x="1423" y="506" class="body">Add a result before it appears in saved locations.</text>
  <line x1="1423" y1="536" x2="2104" y2="536" stroke="#476779"/>
  <text x="1423" y="580" class="mint label">03  Saved state</text>
  <text x="1423" y="614" class="body">Current selection is explicit. Select and Remove</text>
  <text x="1423" y="643" class="body">are separate labeled actions with confirmation for</text>
  <text x="1423" y="672" class="body">removing the selected place.</text>
  <line x1="1423" y1="702" x2="2104" y2="702" stroke="#476779"/>
  <text x="1423" y="746" class="amber label">04  Honest states</text>
  <text x="1423" y="780" class="body">Loading, no matches, and request failure each</text>
  <text x="1423" y="809" class="body">have distinct text and recovery. Search results</text>
  <text x="1423" y="838" class="body">never imply weather has loaded for that place.</text>
  <line x1="1423" y1="868" x2="2104" y2="868" stroke="#476779"/>
  <text x="1423" y="912" class="mint label">05  Accessible use</text>
  <text x="1423" y="946" class="body">Search, result, Add, Select, Remove, and Close</text>
  <text x="1423" y="975" class="body">have spoken labels and clear focus order.</text>
  <text x="1423" y="1004" class="body">Controls stay usable at larger font sizes.</text>
  <line x1="1423" y1="1034" x2="2104" y2="1034" stroke="#476779"/>
  <text x="1423" y="1078" class="amber label">Acceptance evidence for every UI change</text>
  <text x="1423" y="1112" class="body">Installed before and after captures of the same</text>
  <text x="1423" y="1141" class="body">state, plus touch, readability, and accessibility</text>
  <text x="1423" y="1170" class="body">observations. A mockup is never the after capture.</text>
  <text x="1423" y="1266" class="small">WX.19 design input · no app UI implemented by this board</text>

  <text x="75" y="1392" class="mint label">Scope note</text>
  <text x="220" y="1392" class="body">This board defines “selector open”. Main-screen access is owner-planned; weather activation and startup are separate slices.</text>
  <text x="75" y="1440" class="small">Before source: installed debug app on Pixel 3 XL, serial 8AKY0M32X, captured with scripts/dev.py screenshot. Proposed panel is an annotated design composite.</text>
  <text x="75" y="1472" class="small">Board approval does not establish installed visual or interaction acceptance; implementation must capture the real after screen and compare it with the before screen.</text>
</svg>
