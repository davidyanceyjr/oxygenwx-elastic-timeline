    <text x="228" y="289" text-anchor="middle" class="screen" font-size="30" font-weight="700">Chicago</text>
    <g transform="translate(301 270)" fill="none" stroke="#fff" stroke-width="2.4"><path d="M11 1c-6 0-10 4-10 10 0 7 10 17 10 17s10-10 10-17c0-6-4-10-10-10z"/><circle cx="11" cy="11" r="3"/></g>
    <text x="185" y="430" text-anchor="middle" class="screen" font-size="95" font-weight="300">33°</text>
    <g transform="translate(250 366)" fill="#e8f6ff" stroke="#bde5fb" stroke-width="3"><circle cx="21" cy="38" r="17"/><circle cx="43" cy="30" r="25"/><circle cx="67" cy="42" r="17"/><rect x="16" y="40" width="58" height="20" rx="10"/></g>
    <text x="240" y="495" text-anchor="middle" class="screen" font-size="16">SUN  ↑ 6:45 AM   ↓ 4:38 PM</text>
    <text x="240" y="521" text-anchor="middle" class="screen" font-size="16">MOON  ↑ 7:12 AM   ↓ 5:50 PM</text>
    <text x="240" y="557" text-anchor="middle" class="screen" font-size="18">HIGH 36°    /    LOW 28°</text>
    <text x="119" y="708" text-anchor="middle" class="screen" font-size="18" opacity=".8">☂ 72%</text>
    <text x="359" y="708" text-anchor="middle" class="screen" font-size="18" opacity=".8">↗ 12 mph</text>
    <line x1="75" y1="769" x2="405" y2="769" stroke="#d9edff" opacity=".6"/><line x1="240" y1="755" x2="240" y2="786" stroke="#ffe4a7" stroke-width="3"/>
    <text x="615" y="269" text-anchor="middle" class="screen" font-size="24" font-weight="700">Chicago</text>
    <g transform="translate(678 251)" fill="none" stroke="#fff" stroke-width="2"><path d="M10 1c-5 0-9 4-9 9 0 7 9 15 9 15s9-8 9-15c0-5-4-9-9-9z"/><circle cx="10" cy="10" r="3"/></g>
    <text x="585" y="390" text-anchor="middle" class="screen" font-size="73" font-weight="300">33°</text>
    <g transform="translate(636 333) scale(.72)" fill="#e8f6ff" stroke="#bde5fb" stroke-width="3"><circle cx="21" cy="38" r="17"/><circle cx="43" cy="30" r="25"/><circle cx="67" cy="42" r="17"/><rect x="16" y="40" width="58" height="20" rx="10"/></g>
    <text x="628" y="446" text-anchor="middle" class="screen" font-size="12">SUN ↑ 6:45  ↓ 4:38</text>
    <text x="628" y="466" text-anchor="middle" class="screen" font-size="12">MOON ↑ 7:12  ↓ 5:50</text>
