  <g fill="none" stroke="#183e5e" stroke-width="2"><rect x="45" y="135" width="390" height="690" rx="30"/><rect x="475" y="135" width="305" height="620" rx="26"/></g>
  <text x="825" y="150" class="h">READING ORDER</text>
  <text x="825" y="185" class="note">1  Location + small picker trigger; time on tape</text>
  <text x="825" y="217" class="note">2  Temperature + symbol form a tight pair</text>
  <text x="825" y="249" class="note">3  Sun/Moon rise and set times remain</text>
  <text x="825" y="281" class="note">4  High / low; lower indicators flank blank slot</text>
  <text x="825" y="327" class="tiny">Symbol artwork shown schematically; use existing WA renderer.</text>
  <text x="825" y="355" class="tiny">No lower magnifier or gear; center icon opens picker.</text>
  <text x="825" y="400" class="h">AFFECTED STATES</text>
  <rect x="825" y="425" width="525" height="80" rx="12" fill="#dceaf3"/>
  <text x="847" y="455" class="note">RAIN  ·  41° + WA rain symbol; no word</text>
  <text x="847" y="482" class="tiny">Numeric chance remains in lower indicator row.</text>
  <rect x="825" y="520" width="525" height="80" rx="12" fill="#dceaf3"/>
  <text x="847" y="550" class="note">UNAVAILABLE  ·  33° + WA unknown symbol</text>
  <text x="847" y="577" class="tiny">Unavailable status may appear; numeric facts independent.</text>
  <rect x="825" y="615" width="525" height="100" rx="12" fill="#dceaf3"/>
  <text x="847" y="647" class="note">PRIOR SUPPLIED HOUR  ·  symbol + source cue</text>
  <text x="847" y="674" class="tiny">“Condition from 1:00 PM; selected hour unavailable”</text>
  <text x="847" y="696" class="tiny">Source-time disclosure stays adjacent to the symbol.</text>
  <text x="825" y="757" class="h">LOWER INDICATORS · TYPOGRAPHIC CUE</text>
  <rect x="825" y="773" width="160" height="68" rx="13" fill="#173d5d"/>
  <text x="905" y="818" text-anchor="middle" class="screen" font-size="30" font-weight="700">☂ 72%</text>
  <rect x="1175" y="773" width="175" height="68" rx="13" fill="#173d5d"/>
  <text x="1262" y="818" text-anchor="middle" class="screen" font-size="30" font-weight="700">↗ 12 mph</text>
  <text x="45" y="870" class="sub">Review: picker trigger, symbol spacing, event times, two numeric lower indicators, compact and missing states.</text>
  <text x="45" y="900" class="sub">Owner approved after blank middle-slot revision. Installed screenshots and interaction checks establish acceptance.</text>
</svg>
