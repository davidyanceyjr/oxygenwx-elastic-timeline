<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1920" viewBox="0 0 1440 1920" role="img" aria-labelledby="title desc">
<title id="title">WX.5 — 44-day window and honest coverage</title>
<desc id="desc">Draft contract board for the local-date window, DST-aware expected support, explicit field coverage, daily value provenance, and strict normalization boundaries.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#101d2b"/><stop offset="1" stop-color="#182d3c"/></linearGradient>
  <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#71d6c2"/><stop offset="1" stop-color="#8ebeff"/></linearGradient>
  <style>
    .sans{font-family:Inter,Roboto,"Arial",sans-serif}.mono{font-family:"Roboto Mono",monospace}
    .ink{fill:#f3f5f2}.muted{fill:#a8bac4}.teal{fill:#8ee2cf}.blue{fill:#a6caff}.amber{fill:#f1c477}.red{fill:#f29b91}
    .card{fill:#1e3443;stroke:#355263;stroke-width:1.5}.inner{fill:#162a38;stroke:#304b5c;stroke-width:1}
    .rule{stroke:#3b5969;stroke-width:1}.pill{fill:#294555;stroke:#496878;stroke-width:1}
  </style>
</defs>
<rect width="1440" height="1920" fill="url(#bg)"/>
<circle cx="1320" cy="130" r="180" fill="#55b8aa" opacity=".07"/><circle cx="95" cy="1650" r="230" fill="#709ad2" opacity=".06"/>
<g class="sans">
  <text x="84" y="83" class="teal" font-size="18" font-weight="700" letter-spacing="3">OXYGEN WX  /  DATA CONTRACT  /  05</text>
  <text x="84" y="151" class="ink" font-size="48" font-weight="700">44 local dates. Honest coverage.</text>
  <text x="84" y="194" class="muted" font-size="21">DST-aware calendar support, explicit completeness, and traceable daily values.</text>
  <rect x="1110" y="70" width="244" height="42" rx="21" class="pill"/><text x="1232" y="97" text-anchor="middle" class="teal" font-size="14" font-weight="700" letter-spacing="1">APPROVED · 2026-10-27</text>

  <rect x="72" y="236" width="1296" height="300" rx="22" class="card"/>
  <text x="106" y="282" class="teal" font-size="15" font-weight="700" letter-spacing="2">01  /  DATE WINDOW</text>
  <text x="106" y="322" class="ink" font-size="25" font-weight="650">One controlled instant and one IANA zone define the target dates.</text>
  <rect x="106" y="351" width="1228" height="142" rx="15" class="inner"/>
  <text x="140" y="390" class="blue mono" font-size="19">D = asOf.atZone(location.zoneId).toLocalDate()</text>
  <text x="140" y="428" class="ink mono" font-size="20">D−30 … D−1</text><text x="432" y="428" class="teal" font-size="20">30 historical dates</text>
  <text x="775" y="428" class="ink mono" font-size="20">D … D+13</text><text x="1017" y="428" class="teal" font-size="20">14 forecast dates</text>
  <line x1="140" y1="455" x2="1290" y2="455" stroke="url(#accent)" stroke-width="4"/>
  <circle cx="140" cy="455" r="8" fill="#8ee2cf"/><circle cx="925" cy="455" r="8" fill="#a6caff"/><circle cx="1290" cy="455" r="8" fill="#f1c477"/>
  <text x="140" y="480" class="muted mono" font-size="14">local start of D−30</text><text x="1290" y="480" text-anchor="end" class="muted mono" font-size="14">local start of D+14 · exclusive</text>
  <text x="106" y="520" class="amber" font-size="15">Window identity is by LocalDate. Instant bounds are half-open; out-of-window facts are rejected.</text>

  <rect x="72" y="560" width="1296" height="305" rx="22" class="card"/>
  <text x="106" y="606" class="teal" font-size="15" font-weight="700" letter-spacing="2">02  /  LOCAL DAY SUPPORT</text>
  <text x="106" y="646" class="ink" font-size="24" font-weight="650">A day runs from its local start to the next local start.</text>
  <rect x="106" y="670" width="1228" height="147" rx="15" class="inner"/>
  <text x="140" y="709" class="blue mono" font-size="17">[date.atStartOfDay(zone), nextDate.atStartOfDay(zone))</text>
  <text x="140" y="755" class="ink" font-size="17">Hourly point fields</text><text x="444" y="755" class="muted" font-size="17">expected instants advance by 1 hour from local start, stopping before next start</text>
  <text x="140" y="791" class="ink" font-size="17">Accumulated fields</text><text x="444" y="791" class="muted" font-size="17">explicit [start,end) support is checked against expected local-day hour intervals</text>
  <rect x="106" y="824" width="580" height="28" rx="14" class="pill"/><text x="396" y="844" text-anchor="middle" class="teal" font-size="14" font-weight="700">SPRING DAY · 23 HOURLY SUPPORT SLOTS</text>
  <rect x="754" y="824" width="580" height="28" rx="14" class="pill"/><text x="1044" y="844" text-anchor="middle" class="blue" font-size="14" font-weight="700">FALL DAY · 25 HOURLY SUPPORT SLOTS</text>

  <rect x="72" y="889" width="1296" height="348" rx="22" class="card"/>
  <text x="106" y="935" class="teal" font-size="15" font-weight="700" letter-spacing="2">03  /  FIELD AND DAY COVERAGE</text>
  <text x="106" y="975" class="ink" font-size="24" font-weight="650">Completeness is measured against explicit support for each date and field.</text>
  <rect x="106" y="1000" width="1228" height="58" rx="12" class="inner"/>
  <rect x="128" y="1013" width="332" height="32" rx="16" class="pill"/><text x="294" y="1035" text-anchor="middle" class="ink" font-size="15">COMPLETE · all expected support present</text>
  <rect x="482" y="1013" width="346" height="32" rx="16" class="pill"/><text x="655" y="1035" text-anchor="middle" class="ink" font-size="15">PARTIAL · some, not all, present</text>
  <rect x="850" y="1013" width="456" height="32" rx="16" class="pill"/><text x="1078" y="1035" text-anchor="middle" class="ink" font-size="15">MISSING · no expected support present</text>
  <text x="130" y="1100" class="blue" font-size="14" font-weight="700" letter-spacing="1">POINT FIELD EXAMPLE</text>
  <text x="130" y="1131" class="muted" font-size="16">Expected instants: 00:00, 01:00, … through the actual local day.</text>
  <text x="130" y="1161" class="muted" font-size="16">Present values are matched to those instants; no 24-hour assumption.</text>
  <line x1="714" y1="1080" x2="714" y2="1200" class="rule"/>
  <text x="754" y="1100" class="blue" font-size="14" font-weight="700" letter-spacing="1">ACCUMULATED FIELD EXAMPLE</text>
  <text x="754" y="1131" class="muted" font-size="16">Expected intervals tile the local day; supplied intervals must match.</text>
  <text x="754" y="1161" class="muted" font-size="16">Gaps or overlaps cannot count as complete support.</text>
  <text x="106" y="1180" class="blue" font-size="15">All 44 CatalogDay entries remain present, including dates with no facts.</text>
  <text x="106" y="1210" class="amber" font-size="15">Absent stays unavailable. An explicit measured zero remains a supplied value.</text>

  <rect x="72" y="1261" width="1296" height="282" rx="22" class="card"/>
  <text x="106" y="1307" class="teal" font-size="15" font-weight="700" letter-spacing="2">04  /  DAILY VALUE ORIGIN</text>
  <text x="106" y="1347" class="ink" font-size="24" font-weight="650">A daily number carries its origin and the support behind it.</text>
  <rect x="106" y="1372" width="560" height="108" rx="15" class="inner"/>
  <text x="132" y="1407" class="blue" font-size="14" font-weight="700" letter-spacing="1">PROVIDER_SUPPLIED</text>
  <text x="132" y="1440" class="muted" font-size="16">Keep the provider's daily value and identify its support.</text>
  <text x="132" y="1466" class="muted" font-size="16">Its origin stays supplied even if hourly values are missing.</text>
  <rect x="692" y="1372" width="642" height="108" rx="15" class="inner"/>
  <text x="718" y="1407" class="blue" font-size="14" font-weight="700" letter-spacing="1">DERIVED</text>
  <text x="718" y="1440" class="muted" font-size="16">Record its support interval/basis. Complete only with complete,</text>
  <text x="718" y="1466" class="muted" font-size="16">non-overlapping expected support; otherwise unavailable/incomplete.</text>
  <text x="106" y="1518" class="amber" font-size="15">Provider-supplied and derived values remain distinguishable; no missing input is fabricated.</text>

  <rect x="72" y="1567" width="1296" height="236" rx="22" class="card"/>
  <text x="106" y="1613" class="teal" font-size="15" font-weight="700" letter-spacing="2">05  /  NORMALIZATION AND COMPATIBILITY</text>
  <text x="106" y="1653" class="ink" font-size="24" font-weight="650">Stable ordering and explicit rejection keep results deterministic.</text>
  <rect x="106" y="1677" width="340" height="78" rx="14" class="inner"/><text x="130" y="1708" class="blue" font-size="14" font-weight="700">ORDER</text><text x="130" y="1738" class="ink" font-size="16">ascending validTime</text>
  <rect x="466" y="1677" width="390" height="78" rx="14" class="inner"/><text x="490" y="1708" class="blue" font-size="14" font-weight="700">DUPLICATES</text><text x="490" y="1738" class="ink" font-size="16">identical collapse · conflict rejects</text>
  <rect x="876" y="1677" width="458" height="78" rx="14" class="inner"/><text x="900" y="1708" class="red" font-size="14" font-weight="700">OUTSIDE [START, END)</text><text x="900" y="1738" class="ink mono" font-size="16">typed error · OUT_OF_WINDOW_FACT</text>
  <text x="84" y="1855" class="muted" font-size="14" letter-spacing="1">WX.5 CONTRACT BOARD  ·  OWNER-APPROVED DESIGN INPUT  ·  BUILT FROM WX.3 CONTRACT LANGUAGE  ·  NOT IMPLEMENTATION OR ACCEPTANCE EVIDENCE</text>
</g>
</svg>
