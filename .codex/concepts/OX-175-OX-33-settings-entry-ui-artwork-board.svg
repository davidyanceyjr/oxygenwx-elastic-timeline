<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1120" viewBox="0 0 1600 1120">
  <defs>
    <linearGradient id="page" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#e9f0f2"/><stop offset="1" stop-color="#d8e3e6"/>
    </linearGradient>
    <linearGradient id="sky" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#82c8dc"/><stop offset="1" stop-color="#d5e7df"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#18384a" flood-opacity=".17"/>
    </filter>
    <style>
      .ui { font-family: Roboto, Arial, sans-serif; fill: #173044; }
      .light { fill: #ffffff; }
      .title { font-size: 28px; font-weight: 700; }
      .body { font-size: 18px; }
      .small { font-size: 15px; }
      .status { font-size: 15px; font-weight: 700; }
      .muted { fill: #55717d; }
      .tag { font-family: Roboto, Arial, sans-serif; font-size: 14px; font-weight: 700; letter-spacing: .7px; fill: #486572; }
    </style>
  </defs>
  <rect width="1600" height="1120" fill="#f6f8f7"/>
  <text class="ui" x="60" y="55" font-size="24" font-weight="700">OX-33 • Settings entry and catalog list</text>
  <text class="ui muted" x="60" y="85" font-size="16">Supplement to the shared cycle 175 UI artwork • read-only Settings, no theme selection</text>

  <!-- Forecast state with the selected Settings entry point -->
  <g transform="translate(70 125)" filter="url(#shadow)">
    <rect width="660" height="900" rx="30" fill="url(#sky)" stroke="#698590" stroke-width="2"/>
    <text class="tag" x="28" y="42">FORECAST • EXISTING STATE</text>
    <circle cx="525" cy="245" r="62" fill="#fff6cb" opacity=".92"/>
    <path d="M0 420 Q150 310 300 430 T660 400 V900 H0Z" fill="#457d74" opacity=".76"/>
    <path d="M0 520 Q160 430 330 530 T660 505 V900 H0Z" fill="#315c63" opacity=".72"/>
    <rect x="34" y="84" width="330" height="58" rx="29" fill="#173044" fill-opacity=".88" stroke="#9ecbd8" stroke-width="2"/>
    <text class="ui light" x="63" y="121" font-size="19">World: Living Urban Park  ▾</text>
    <rect x="376" y="84" width="66" height="58" rx="18" fill="#173044" fill-opacity=".88" stroke="#9ecbd8" stroke-width="2"/>
    <g transform="translate(409 113)" fill="none" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round">
      <circle r="7"/><path d="M0-20v5M0 15v5M20 0h-5M-15 0h-5M14-14l-4 4M-10 10l-4 4M14 14l-4-4M-10-10l-4-4"/>
    </g>
    <text class="ui" x="330" y="278" font-size="48" font-weight="700" text-anchor="middle">Forecast</text>
    <text class="ui" x="330" y="314" font-size="19" text-anchor="middle">Weather facts remain visible</text>
    <rect x="48" y="625" width="564" height="125" rx="22" fill="#f8fbfa" fill-opacity=".94"/>
    <text class="ui" x="78" y="668" font-size="16" font-weight="700">PLACE</text>
    <text class="ui" x="78" y="705" font-size="18">Current forecast facts remain unchanged</text>
    <rect x="48" y="780" width="564" height="72" rx="18" fill="#173044" fill-opacity=".84"/>
    <path d="M82 818H578" stroke="#bdd9df" stroke-width="3"/>
    <circle cx="316" cy="818" r="11" fill="#ffe7a4" stroke="#173044" stroke-width="4"/>
    <text class="ui light" x="80" y="845" font-size="14">Timeline remains unchanged</text>
  </g>

  <!-- Settings state -->
  <g transform="translate(850 125)" filter="url(#shadow)">
    <rect width="660" height="900" rx="30" fill="#f7faf9" stroke="#698590" stroke-width="2"/>
    <rect width="660" height="106" rx="30" fill="#173044"/>
    <path d="M0 76 Q0 106 30 106 H630 Q660 106 660 76" fill="#173044"/>
    <text x="42" y="66" font-family="Arial, sans-serif" font-size="30" fill="#fff">‹</text>
    <text class="ui light" x="91" y="66" font-size="28" font-weight="700">Settings</text>
    <text class="ui muted" x="44" y="159" font-size="14" font-weight="700" letter-spacing="1.2">WEATHER WORLD</text>

    <rect x="32" y="184" width="596" height="142" rx="20" fill="#eaf4ec" stroke="#6a9a7a" stroke-width="2"/>
    <text class="ui" x="58" y="226" font-size="22" font-weight="700">Living Urban Park</text>
    <text class="ui muted" x="58" y="261" font-size="17">Bundled free</text>
    <rect x="463" y="205" width="137" height="38" rx="19" fill="#2b6d53"/>
    <text x="531" y="230" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#fff" text-anchor="middle">Active</text>

    <rect x="32" y="346" width="596" height="120" rx="20" fill="#ffffff" stroke="#c7d4d8" stroke-width="2"/>
    <text class="ui" x="58" y="390" font-size="21" font-weight="700">Installed alternate</text>
    <text class="ui muted" x="58" y="426" font-size="16">App-owned registration</text>
    <rect x="424" y="374" width="176" height="38" rx="19" fill="#e6f1f4"/>
    <text class="ui status" x="512" y="399" text-anchor="middle">Compatible</text>
    <text class="ui muted" x="512" y="440" font-size="14" text-anchor="middle">Available</text>

    <rect x="32" y="486" width="596" height="120" rx="20" fill="#ffffff" stroke="#c7d4d8" stroke-width="2"/>
    <text class="ui" x="58" y="530" font-size="21" font-weight="700">Registered theme</text>
    <text class="ui muted" x="58" y="566" font-size="16">App-owned registration</text>
    <rect x="414" y="514" width="186" height="38" rx="19" fill="#fff0dc"/>
    <text class="ui status" x="507" y="539" text-anchor="middle">Incompatible</text>
    <text class="ui muted" x="507" y="580" font-size="14" text-anchor="middle">Unavailable</text>

    <rect x="32" y="626" width="596" height="120" rx="20" fill="#ffffff" stroke="#c7d4d8" stroke-width="2"/>
    <text class="ui" x="58" y="670" font-size="21" font-weight="700">Registered theme</text>
    <text class="ui muted" x="58" y="706" font-size="16">App-owned registration</text>
    <rect x="448" y="654" width="152" height="38" rx="19" fill="#f1e7ed"/>
    <text class="ui status" x="524" y="679" text-anchor="middle">Disabled</text>
    <text class="ui muted" x="524" y="720" font-size="14" text-anchor="middle">Unavailable</text>

  </g>
  <text class="ui" x="400" y="1050" font-size="17" font-weight="700" text-anchor="middle">Gear opens Settings • accessible name “Settings”</text>
  <text class="ui" x="1180" y="1050" font-size="16" font-weight="700" text-anchor="middle">Read-only rows • Park content version omitted until assigned</text>
</svg>
