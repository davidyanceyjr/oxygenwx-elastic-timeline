<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="670" viewBox="0 0 1200 670">
<rect width="1200" height="670" fill="#0b1c2b"/><g font-family="sans-serif" fill="#eef6f8"><text x="36" y="42" font-size="25">Location selection — proposed flow (owner approval pending)</text><text x="36" y="75" font-size="15">Illustrative layout; existing visual styling and removal confirmation remain authoritative.</text>
<g transform="translate(40 110)"><rect width="330" height="485" rx="22" fill="#132b3d" stroke="#82d8c9"/><text x="20" y="40" font-size="21">Locations</text><text x="20" y="70" font-size="14">Search and choose a place manually</text><rect x="20" y="90" width="220" height="43" rx="6" fill="#1d3a4c"/><text x="32" y="117" font-size="16">Search places</text><rect x="248" y="90" width="64" height="43" rx="8" fill="#82d8c9"/><text x="257" y="117" font-size="14" fill="#062f32">Search</text><text x="20" y="170" font-size="17">Search results</text><rect x="20" y="185" width="290" height="70" rx="8" fill="#1d3a4c"/><text x="32" y="213" font-size="16">Example place</text><text x="32" y="239" font-size="14">Select → save and load</text><text x="20" y="300" font-size="17">Saved locations</text><rect x="20" y="315" width="290" height="70" rx="8" fill="#1d3a4c"/><text x="32" y="344" font-size="16">Previously selected place</text><text x="32" y="370" font-size="14">Select</text><text x="240" y="370" font-size="14">Remove</text></g>
<path d="M390 350h115" stroke="#82d8c9" stroke-width="4"/><path d="M490 340l15 10-15 10" fill="none" stroke="#82d8c9" stroke-width="4"/><text x="390" y="320" font-size="14">select succeeds</text>
<g transform="translate(525 110)"><rect width="300" height="485" rx="22" fill="#172f42" stroke="#82d8c9"/><text x="20" y="40" font-size="21">Main forecast</text><text x="20" y="82" font-size="16">Selected location</text><text x="20" y="115" font-size="14">Loading its forecast…</text><circle cx="150" cy="235" r="67" fill="#e5c680"/><text x="20" y="380" font-size="14">Existing forecast and timeline</text><text x="20" y="410" font-size="14">Location menu closed</text></g>
<g transform="translate(860 130)" font-size="16"><text y="0">Behavior</text><text y="35" font-size="14">• Either selection path loads</text><text y="58" font-size="14">  the chosen location.</text><text y="95" font-size="14">• Reopening shows saved</text><text y="118" font-size="14">  selections until removed.</text><text y="155" font-size="14">• Selection failure stays visible;</text><text y="178" font-size="14">  do not claim it loaded.</text><text y="215" font-size="14">• Pending debug entry cancels;</text><text y="238" font-size="14">  active debug restores first.</text></g></g></svg>