<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img"><rect width="1600" height="1000" fill="#0b1a2b"/><text x="45" y="55" fill="#fff" font-family="Arial,sans-serif" font-size="34" font-weight="700">SG.11  /  WEATHER EVENT MAPPING</text><text x="45" y="88" fill="#a9c9d8" font-family="Arial,sans-serif" font-size="18" font-weight="400">APPROVED BEHAVIOR BOARD  •  2026-11-04</text><rect x="45" y="130" width="440" height="190" rx="18" fill="#173148" stroke="#58cdb8" stroke-width="2"/><text x="65" y="164" fill="#fff" font-family="Arial,sans-serif" font-size="22" font-weight="700">1  Open-Meteo response</text><text x="65" y="197" fill="#eaf4f8" font-family="Arial,sans-serif" font-size="17" font-weight="400">Existing request already includes weather_code.</text><text x="65" y="225" fill="#eaf4f8" font-family="Arial,sans-serif" font-size="17" font-weight="400">Retain exact bounded response and request</text><text x="65" y="253" fill="#eaf4f8" font-family="Arial,sans-serif" font-size="17" font-weight="400">identity in each new recording.</text><rect x="580" y="130" width="440" height="190" rx="18" fill="#173148" stroke="#f4bb6b" stroke-width="2"/><text x="600" y="164" fill="#fff" font-family="Arial,sans-serif" font-size="22" font-weight="700">2  Code → WA Event Ledger</text><text x="600" y="197" fill="#eaf4f8" font-family="Arial,sans-serif" font-size="17" font-weight="400">Named source-semantic mapping table.</text><text x="600" y="225" fill="#eaf4f8" font-family="Arial,sans-serif" font-size="17" font-weight="400">Documented code meaning → typed WA ID.</text><text x="600" y="253" fill="#eaf4f8" font-family="Arial,sans-serif" font-size="17" font-weight="400">Never infer an event from other measures.</text><rect x="1115" y="130" width="440" height="190" rx="18" fill="#173148" stroke="#58cdb8" stroke-width="2"/><text x="1135" y="164" fill="#fff" font-family="Arial,sans-serif" font-size="22" font-weight="700">3  Canonical catalog</text><text x="1135" y="197" fill="#eaf4f8" font-family="Arial,sans-serif" font-size="17" font-weight="400">Keep numeric source code + typed event.</text><text x="1135" y="225" fill="#eaf4f8" font-family="Arial,sans-serif" font-size="17" font-weight="400">Scene reads canonical facts as before.</text><text x="1135" y="253" fill="#eaf4f8" font-family="Arial,sans-serif" font-size="17" font-weight="400">Symbol and accessible name use event ID.</text><path d="M488 226H570 M1024 226H1105" stroke="#80ddca" stroke-width="5" marker-end="url(#arr)"/><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#80ddca"/></marker></defs><rect x="45" y="370" width="710" height="180" rx="18" fill="#173148" stroke="#58cdb8" stroke-width="2"/><text x="65" y="404" fill="#fff" font-family="Arial,sans-serif" font-size="22" font-weight="700">Recording and replay</text><text x="65" y="437" fill="#eaf4f8" font-family="Arial,sans-serif" font-size="17" font-weight="400">New: raw response + request metadata + canonical code/event travel together.</text><text x="65" y="465" fill="#eaf4f8" font-family="Arial,sans-serif" font-size="17" font-weight="400">Old recordings: broad facts remain readable; lost raw codes cannot be recovered.</text><text x="65" y="493" fill="#eaf4f8" font-family="Arial,sans-serif" font-size="17" font-weight="400">Recording raw samples is for future reinterpretation, not scene rendering.</text><rect x="845" y="370" width="710" height="180" rx="18" fill="#173148" stroke="#f4bb6b" stroke-width="2"/><text x="865" y="404" fill="#fff" font-family="Arial,sans-serif" font-size="22" font-weight="700">Source claim</text><text x="865" y="437" fill="#eaf4f8" font-family="Arial,sans-serif" font-size="17" font-weight="400">47 supplyable WA events; CONDITION_UNAVAILABLE is presentation-only.</text><text x="865" y="465" fill="#eaf4f8" font-family="Arial,sans-serif" font-size="17" font-weight="400">Unknown code → unavailable, never clear. Keep source wording when supplied.</text><text x="865" y="493" fill="#eaf4f8" font-family="Arial,sans-serif" font-size="17" font-weight="400">Open-Meteo supplies numeric codes, not description strings.</text><rect x="45" y="600" width="710" height="230" rx="18" fill="#173148" stroke="#58cdb8" stroke-width="2"/><text x="65" y="634" fill="#fff" font-family="Arial,sans-serif" font-size="22" font-weight="700">Selected-time symbol</text><text x="65" y="667" fill="#eaf4f8" font-family="Arial,sans-serif" font-size="17" font-weight="400">0 CLEAR: day SUNNY / night CLEAR_NIGHT.</text><text x="65" y="695" fill="#eaf4f8" font-family="Arial,sans-serif" font-size="17" font-weight="400">2 PARTLY CLOUDY: day / night artwork variants.</text><text x="65" y="723" fill="#eaf4f8" font-family="Arial,sans-serif" font-size="17" font-weight="400">Day: sunrise − 1 h inclusive to sunset − 1 h exclusive.</text><text x="65" y="751" fill="#eaf4f8" font-family="Arial,sans-serif" font-size="17" font-weight="400">Dawn counts day; dusk counts night. Scene light timing is unchanged.</text><rect x="845" y="600" width="710" height="230" rx="18" fill="#173148" stroke="#f4bb6b" stroke-width="2"/><text x="865" y="634" fill="#fff" font-family="Arial,sans-serif" font-size="22" font-weight="700">Review gates</text><text x="865" y="667" fill="#eaf4f8" font-family="Arial,sans-serif" font-size="17" font-weight="400">Approved: 48 → FREEZING_FOG; 77 → FLURRIES_SNOW_GRAINS</text><text x="865" y="695" fill="#eaf4f8" font-family="Arial,sans-serif" font-size="17" font-weight="400">Approved: 97 heavy thunderstorm → THUNDERSTORM</text><text x="865" y="723" fill="#eaf4f8" font-family="Arial,sans-serif" font-size="17" font-weight="400">Multiple explicit events: source primary, then fixed priority.</text><text x="865" y="751" fill="#eaf4f8" font-family="Arial,sans-serif" font-size="17" font-weight="400">Owner-approved full fallback order is in the linked ledger.</text><text x="45" y="898" fill="#b9d0db" font-family="Arial,sans-serif" font-size="18" font-weight="400">Ledger: SG.11-weather-event-mapping-behavior-board.md  •  Artwork: approved WA asset board</text><text x="45" y="934" fill="#b9d0db" font-family="Arial,sans-serif" font-size="18" font-weight="400">SG.11 mapping ends at typed projection. SG.12 owns the center readout composition.</text></svg>