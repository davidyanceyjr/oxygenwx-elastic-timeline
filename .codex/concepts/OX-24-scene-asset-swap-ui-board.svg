<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820">
<defs>
  <linearGradient id="sky" x2="0" y2="1"><stop stop-color="#669eb4"/><stop offset="1" stop-color="#e9c995"/></linearGradient>
  <linearGradient id="ground" x2="0" y2="1"><stop stop-color="#233c4a"/><stop offset="1" stop-color="#101d2a"/></linearGradient>
  <g id="city"><path d="M0 350V240h50v-76h52v65h44v-99h55v49h44v-83h58v133h50v-70h60v88h47v-105h67v208Z" fill="#344d5d"/><path d="M0 350V278h83v-54h80v53h72v-85h85v92h70v-65h70v131Z" fill="#263c4e"/></g>
  <g id="leaf"><circle cx="0" cy="0" r="43"/><circle cx="44" cy="-9" r="34"/><circle cx="-40" cy="5" r="32"/></g>
  <clipPath id="sceneClip"><rect width="464" height="440"/></clipPath>
