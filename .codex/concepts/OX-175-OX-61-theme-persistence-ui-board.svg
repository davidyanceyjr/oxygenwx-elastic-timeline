<svg xmlns="http://www.w3.org/2000/svg" width="1520" height="850" viewBox="0 0 1520 850" role="img" aria-labelledby="title desc">
  <title id="title">OX-61 theme persistence artwork supplement</title>
  <desc id="desc">A schematic pair showing same-session forecast continuity during an installed theme switch and the saved installed world returning after cold launch with forecast access from normal startup.</desc>
  <defs>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; fill: #26394d; }
      .title { font-size: 30px; font-weight: 700; }
      .subtitle { font-size: 16px; fill: #60748a; }
      .panel-title { font-size: 21px; font-weight: 700; }
      .label { font-size: 17px; font-weight: 600; }
      .small { font-size: 14px; fill: #526a82; }
      .tiny { font-size: 12px; fill: #627990; }
      .panel { fill: #fff; stroke: #bac9d8; stroke-width: 2; }
      .scene { fill: #e7f0f5; stroke: #b7c8d4; stroke-width: 1.5; }
      .hill { fill: #c8d7c3; }
      .pill { fill: #fff; stroke: #d3dde6; stroke-width: 1.3; }
      .green { fill: #e7f3eb; stroke: #6e9b7e; stroke-width: 1.6; }
      .blue { fill: #eaf1f8; stroke: #7598be; stroke-width: 1.6; }
      .note { fill: #fff3de; stroke: #c99b54; stroke-width: 1.4; }
      .line { stroke: #607f9d; stroke-width: 3; fill: none; marker-end: url(#arrow); }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#607f9d"/></marker>
  </defs>
  <rect width="1520" height="850" fill="#f5f7fa"/>
  <text x="48" y="54" class="title">Oxygen Time Lab · Cycle 175 · OX-61</text>
  <text x="48" y="84" class="subtitle">Saved installed theme returns after cold launch; forecast and timeline state use normal startup.</text>
  <text x="48" y="108" class="tiny">Scope supplement · no new in-app controls · not installed acceptance evidence</text>

  <rect x="48" y="138" width="700" height="530" rx="18" class="panel"/>
  <text x="78" y="180" class="panel-title">Same-session choice · OX-32 invariants</text>
  <text x="78" y="210" class="small">After the installed candidate commits, keep the active weather context unchanged.</text>
  <rect x="82" y="248" width="250" height="238" rx="12" class="scene"/>
  <path d="M83 395 Q170 352 245 385 T331 371 V485 H83 Z" class="hill"/>
  <circle cx="278" cy="291" r="22" fill="#f3d890"/>
  <path d="M128 320 Q148 287 168 320 Q190 286 210 320 Q228 301 247 320" fill="none" stroke="#fff" stroke-width="13" stroke-linecap="round"/>
  <text x="108" y="445" class="label">Current world</text>
  <text x="108" y="469" class="small">Forecast remains readable</text>
  <line x1="350" y1="365" x2="424" y2="365" class="line"/>
  <rect x="445" y="248" width="250" height="238" rx="12" class="scene"/>
  <path d="M446 395 Q533 352 608 385 T694 371 V485 H446 Z" class="hill"/>
  <circle cx="640" cy="291" r="22" fill="#f3d890"/>
  <path d="M491 320 Q511 287 531 320 Q553 286 573 320 Q591 301 610 320" fill="none" stroke="#fff" stroke-width="13" stroke-linecap="round"/>
  <text x="471" y="445" class="label">Installed alternate</text>
  <text x="471" y="469" class="small">Same forecast context</text>
  <rect x="86" y="526" width="624" height="86" rx="12" class="green"/>
  <text x="112" y="561" class="label">Same place · catalog · selected instant · facts · timeline</text>
  <text x="112" y="588" class="small">The existing atomic OX-32 switch remains responsible for this continuity.</text>
  <text x="90" y="645" class="tiny">Persist the installed packId only after a successful world commit.</text>

  <rect x="772" y="138" width="700" height="530" rx="18" class="panel"/>
  <text x="802" y="180" class="panel-title">Cold launch · saved compatible theme</text>
  <text x="802" y="210" class="small">OX-58 restores the catalog; OX-61 resolves the saved app-owned packId.</text>
  <rect x="810" y="248" width="286" height="54" rx="10" class="blue"/>
  <text x="832" y="282" class="label">Compatible installed theme key</text>
  <line x1="1107" y1="275" x2="1150" y2="275" class="line"/>
  <rect x="1163" y="248" width="267" height="54" rx="10" class="green"/>
  <text x="1183" y="282" class="label">Installed world is active</text>
  <rect x="810" y="326" width="620" height="210" rx="12" class="scene"/>
  <path d="M811 451 Q915 406 1035 443 T1244 428 T1429 438 V535 H811 Z" class="hill"/>
  <circle cx="1356" cy="365" r="22" fill="#f3d890"/>
  <path d="M878 386 Q898 353 918 386 Q940 352 960 386 Q978 367 997 386" fill="none" stroke="#fff" stroke-width="13" stroke-linecap="round"/>
  <text x="842" y="497" class="label">Saved alternate world</text>
  <rect x="810" y="560" width="620" height="74" rx="11" class="note"/>
  <text x="832" y="591" class="label">Forecast available through normal startup</text>
  <text x="832" y="616" class="small">Exact prior time, facts, and timeline scale are not persisted by OX-61.</text>
  <text x="814" y="656" class="tiny">No Settings, purchase flow, banner, or extra loading control.</text>

  <text x="50" y="725" class="label">Availability boundary</text>
  <text x="50" y="756" class="small">Only a still-available compatible app-owned entry is restored. OX-62 owns a missing or incompatible saved key.</text>
  <text x="50" y="785" class="small">The stable key is the catalog packId; catalog version and content identity remain separate.</text>
  <text x="50" y="819" class="tiny">Schematic states describe the accepted result; installed screenshots and scoped checks remain required.</text>
</svg>
