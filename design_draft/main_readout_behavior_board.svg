<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1120" viewBox="0 0 1600 1120">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071a35"/>
      <stop offset="1" stop-color="#102c50"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f4ad35"/>
      <stop offset="0.5" stop-color="#ffe184"/>
      <stop offset="1" stop-color="#e6a02a"/>
    </linearGradient>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto">
      <path d="M1 1L10 6L1 11" fill="none" stroke="#55d9ee" stroke-width="2"/>
    </marker>
    <style>
      text { font-family: Inter, "DejaVu Sans", sans-serif; fill: #f4f7fd; }
      .muted { fill: #b7c8dc; }
      .cyan { fill: #56d9eb; }
      .gold { fill: #ffdb79; }
      .title { font-size: 42px; font-weight: 700; letter-spacing: 1px; }
      .section { font-size: 25px; font-weight: 700; }
      .body { font-size: 21px; }
      .small { font-size: 17px; }
      .panel { fill: #0c2442; stroke: #315171; stroke-width: 2; }
      .line { stroke: #55d9ee; stroke-width: 3; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="1600" height="1120" fill="url(#bg)"/>
  <path d="M0 930 Q330 850 650 930 T1300 910 T1600 900V1120H0Z" fill="#0a203b" opacity=".8"/>
  <text x="72" y="83" class="title">MR.1 · MAIN READOUT BEHAVIOR</text>
  <text x="74" y="125" class="body muted">Selected-time contract · Florence Golden Night artwork companion</text>

  <rect x="72" y="170" width="1456" height="170" rx="24" class="panel"/>
  <text x="112" y="218" class="section gold">TIMELINE FOCUS</text>
  <text x="112" y="263" class="body">Focused instant T is the single source for every readout fact.</text>
  <line x1="165" y1="296" x2="1405" y2="296" stroke="#54718e" stroke-width="5" stroke-linecap="round"/>
  <line x1="810" y1="282" x2="810" y2="314" stroke="#ffdb79" stroke-width="5"/>
  <circle cx="810" cy="296" r="11" fill="#ffdb79"/>
  <text x="785" y="329" class="small gold">T</text>
  <path d="M800 350V395" class="line"/>

  <rect x="72" y="410" width="925" height="500" rx="24" class="panel"/>
  <text x="112" y="460" class="section gold">HERO FACTS FOR T</text>
  <text x="112" y="510" class="body">Location name + location icon</text>
  <path d="M180 680 A300 125 0 0 1 780 680" fill="none" stroke="url(#gold)" stroke-width="8" stroke-linecap="round"/>
  <circle cx="480" cy="565" r="25" fill="#f4c84e" opacity=".95"/>
  <text x="480" y="573" text-anchor="middle" font-size="22" fill="#122747">☼</text>
  <text x="480" y="690" text-anchor="middle" font-size="84" font-weight="300">55°</text>
  <text x="480" y="742" text-anchor="middle" font-size="36" class="cyan">≈ 53°</text>
  <text x="480" y="790" text-anchor="middle" font-size="29">Clear night</text>
  <text x="112" y="835" class="small muted">Primary temperature · apparent temperature · supported condition</text>
  <text x="112" y="866" class="small muted">Condition symbol and decorative arc may respond to T;</text>
  <text x="112" y="893" class="small muted">decoration never delays or changes the displayed facts.</text>

  <rect x="1025" y="410" width="503" height="500" rx="24" class="panel"/>
  <text x="1065" y="460" class="section gold">SUPPORT ROW FOR T</text>
  <text x="1276" y="522" text-anchor="middle" class="small muted">Exactly three · evenly spaced · transparent</text>
  <line x1="1193" y1="558" x2="1193" y2="747" stroke="#55718f" stroke-width="2"/>
  <line x1="1360" y1="558" x2="1360" y2="747" stroke="#55718f" stroke-width="2"/>
  <text x="1110" y="612" text-anchor="middle" font-size="38" class="cyan">☂</text>
  <text x="1276" y="612" text-anchor="middle" font-size="38" class="cyan">≋</text>
  <text x="1443" y="612" text-anchor="middle" font-size="38" class="cyan">◌</text>
  <text x="1110" y="660" text-anchor="middle" class="small">Precip</text>
  <text x="1276" y="660" text-anchor="middle" class="small">Wind</text>
  <text x="1443" y="660" text-anchor="middle" class="small">Humidity</text>
  <text x="1110" y="711" text-anchor="middle" font-size="31" font-weight="700">0%</text>
  <text x="1276" y="711" text-anchor="middle" font-size="31" font-weight="700">6 mph</text>
  <text x="1443" y="711" text-anchor="middle" font-size="31" font-weight="700">58%</text>
  <text x="1065" y="800" class="small muted">Each value updates immediately as focus moves.</text>
  <text x="1065" y="836" class="small muted">No opaque cards, boxes, or filled containers.</text>

  <rect x="72" y="940" width="1456" height="160" rx="22" fill="#142c48" stroke="#45617c" stroke-width="2"/>
  <text x="108" y="984" class="section cyan">INDEPENDENTLY UNAVAILABLE?</text>
  <text x="108" y="1024" class="body">Show that fact unavailable under existing rules; keep other supported facts. Never invent zero or borrow a neighboring value.</text>
  <text x="108" y="1072" class="small muted">Preserve skyline, timeline, selected instant, source honesty, and existing gesture ownership.</text>
  <text x="108" y="1095" class="small muted">Detail views / mini-graphs are outside MR.1.</text>
</svg>
